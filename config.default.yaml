# Cau hinh mac dinh. Moi game co the ghi de bang <project>/config.yaml (chi can ghi khoa muon doi).

target_lang: vi
# Ngon ngu nguon (ja/zh/ko/en). Trong = tu nhan theo chu trong game.
source_lang: ""

# ---- Dinh tuyen model (alias cua Claude Code: haiku / sonnet / opus) ----
# Nguyen tac: model manh chi dung o noi quyet dinh chat luong toan game.
models:
  bible: opus          # dung ho so nhan vat/xung ho: 1 lan/game, sai o day = sai ca game
  ui: haiku            # menu, ten vat pham, thuat ngu he thong, chuoi ngan
  description: sonnet  # mo ta vat pham/ky nang
  dialogue: sonnet     # hoi thoai thuong (phan lon khoi luong)
  key_scene: opus      # canh duoc danh dau quan trong trong bible (key_scenes) hoac tag "deep"
  repair: opus         # dich lai dong QA bao loi lan 2 tro di
# Muc suy nghi (--effort) theo vai tro: low / medium / high. Bo trong = mac dinh cua model.
# Effort thap -> it token suy nghi -> tiet kiem han muc. Can so sanh thu tren tung game.
effort:
  bible: high
  ui:            # haiku: de trong (chua chac haiku nhan --effort)
  description: low
  dialogue: medium
  key_scene: high
  repair: medium
# Leo thang: dong loi QA lan 1 dich lai bang chinh model cu; tu lan 2 dung models.repair.
max_attempts: 3

# ---- Chia lo (cang lon cang it lan goi, nhung loi 1 lo ton nhieu hon) ----
batch:
  max_entries: 40
  max_source_chars: 6000
  context_lines: 4      # so dong da dich lien truoc dua vao lam ngu canh

# ---- Claude Code (claude -p) ----
claude:
  executable: claude          # hoac duong dan day du toi claude.exe
  timeout_sec: 600
  max_turns: 4
  # Thay toan bo system prompt mac dinh cua Claude Code + tat cong cu:
  # day la cach giam token moi lan goi nhieu nhat.
  replace_system_prompt: true
  disable_tools: true
  no_session_persistence: true
  extra_args: []
  # Khi het han muc (5 gio / tuan): cho roi chay tiep thay vi thoat.
  wait_on_limit: true
  limit_wait_minutes: 30
  max_limit_waits: 48

# ---- QA / giao dien ----
qa:
  # RPG Maker MV/MZ: khung thoai mac dinh ~4 dong. So ky tu/dong phu thuoc font & do rong khung,
  # chinh theo game sau khi choi thu.
  max_lines_per_box: 4
  max_line_chars: 48
  auto_wrap: true
  # Ti le dai toi da so voi ban goc cho chuoi UI (menu, nut). Tieng Viet thuong dai hon.
  ui_max_ratio: 2.2
  ui_max_chars: 24
  # error = dich lai cho ngan hon; warn = chi ghi nhan (RPG Maker tu co chu cho vua o).
  ui_too_long: error

# ---- RPG Maker MV/MZ ----
rpgmaker:
  # Font goc nhieu game (font Trung/Nhat) thieu dau tieng Viet. Dat duong dan .ttf co dau
  # (vd C:/Windows/Fonts/arial.ttf) -> apply chep vao www/fonts va sua gamefont.css. Trong = giu font goc.
  font_file: ""
  # Chu cung trong plugin JS dang object {'key': 'value'}: [{file: js/plugins/X.js, start: "var X = {", end: "};"}]
  js_tables: []
  # Thay chuoi co dinh trong JS (file tinh tu thu muc cha cua data/), count = so lan phai gap:
  # [{file: js/plugins/X.js, find: 'StorageManager.load("language")', replace: '""', count: 3}]
  js_replace: []

# ---- Unreal Engine 4.26+/5 (pak v11 khong ma hoa, chu nam trong .locres) ----
unreal:
  # Pak nen Oodle can oo2core_*_win64.dll. Trong = tim trong thu muc game.
  oodle_dll: ""
  source_culture: en        # culture dung lam ban nguon de dich
  target: Game              # Content/Localization/<target>/<culture>/<target>.locres
  # Culture ghi ban Viet. Trong = moi culture game co (moi lua chon ngon ngu deu ra tieng Viet).
  cultures: []
  # Pak mod tuong doi trong game. Trong = <Project>/Content/Paks/<Project>-zVietHoa_999_P.pak
  # (KHONG dat trong ~mods: uu tien 3000+ thua pak goc '<Project>-Windows.pak' = 4000)
  mod_pak: ""
  # Font thieu dau tieng Viet -> {.ufont trong pak: .ufont khac trong pak hoac file .ttf/.otf}
  fonts: {}
  # Khoa bien the (so it/nhieu, mao tu) dung chung ban dich cua khoa goc, khong gui model.
  variant_suffixes: []
  # Ghi de loai dong theo regex namespace: {"ST_Foo": dialogue}
  kinds: {}
