  - Thần lực trong tinh dịch Thành chủ nuốt sức Succubus và biến đổi tử cung Lilina; Succubus muốn hỏi
    Phù thủy Hắc ám \N[9]. Sanga có 'năng lực khác thường' và nhắn Lilina tới Đế quốc tìm mình. \N[60]
    từng tới Torres và thành công cụ của Vua Succubus.
  - 'Dây chuyền của Aisha là ''món cuối cùng chứng minh cô còn là người''; Owen: ''cô ấy cuối cùng đã
