  - 'Vua Kỳ Lân: sức Vua Succubus cho Lilina tuổi thọ ngang kỳ lân; Lilina tự nói ''kẻ bất tử như ta''.
    ce88: ''Em hay nó, cuối cùng chỉ được chọn một''.'
  - 'ce148 (thầy phòng y tế Thổ ''rất hứng thú với con của cô''), ce20 (''sữa để dành cho một vị đại nhân
