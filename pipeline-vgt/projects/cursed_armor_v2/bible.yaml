  to: lilina
  self: ta
  call: 'mày; khi nói về Lilina với khách: con nhỏ này / nó (gốc gọi tên thì giữ \N[1])'
  note: 'Điều giáo sư coi Lilina là hàng hóa: ra lệnh trịch thượng ta–mày, chào hàng với khách thì gọi
    bằng ngôi ba. [biên tập trưởng độc lập, 02/11]'
- from: lilina
  to: lilith
  self: tôi
  call: cô (gốc gọi tên thì 'cô \N[44]')
  note: Hai bên là bên bán và bên ký hợp đồng, giữ khoảng cách; ghép với giọng tôi–cô của Lilith cho khớp.
    [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: slime_scholar
  self: tôi
  call: 'ông; khi trang trọng: ông học giả'
  note: Hai người lạ gặp nhau qua Hội, được phép dùng 'tôi'; gọi 'ông' cho khớp với tôi/cô (độ tuổi bề
    ngoài xem câu hỏi). [biên tập trưởng độc lập, 02/11]
- from: doctor
  to: lilina
  self: tôi
  call: em
  note: Bác sĩ nam lớn tuổi hơn nói với bệnh nhân nữ trẻ thì gọi 'em' như ngoài đời; xưng 'tôi' giữ vai
    thầy thuốc. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: doctor
  self: em
  call: bác sĩ
  note: Bệnh nhân trẻ tuổi xưng em, gọi chức danh như gốc gọi 醫生. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: cell_boss
  self: tôi
  call: 'ông; khi chửi, giận: lão'
  note: Bị ép nhưng vẫn thù hằn, cố giữ khoảng cách nên dùng tôi/ông; lúc mắng gọi 'lão' để khớp với 'ông
    đây'. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: charlo
  self: tớ; trong cảnh sa đọa tự gọi tên \N[1] khi gốc dùng
  call: cậu
  note: Hai bạn đồng môn ngang hàng; tớ/cậu dùng được dù giới tính Charlo chưa thống nhất. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: jack
  self: tớ
  call: cậu
  changes: 'Sau khi bị ép hẹn: xưng ''tôi'' để giữ khoảng cách, vẫn gọi ''cậu'''
  note: Bạn đồng học; bị nắm thóp thì cô dè chừng nhưng vẫn mềm mỏng, gốc có câu 我們可以聊聊嗎. [biên tập trưởng
    độc lập, 02/11]
- from: potter
  to: lilina
  self: ta
  call: 'mày; khi chửi: đồ heo lười'
  note: Quan quản lý coi nữ tù như gia súc, quát tháo, ra lệnh cộc ('Theo ta!', 'Ra ruộng nằm sấp!'),
    nên ta – mày cho đúng giọng khinh miệt. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: potter
  self: 'tôi; độc thoại （）: mình'
  call: 'ông; độc thoại （）: lão'
  note: Thân phận tù nhân bị ép, bề ngoài cam chịu ('Vâng…') nhưng giữ khoảng cách, phản kháng ('Tôi đâu
    phải gia súc'); trong đầu thì khinh ra mặt. [biên tập trưởng độc lập, 02/11]
- from: prisoner54
  to: lilina
  self: tao
  call: 'mày; khi chửi: con dâm nữ'
  note: Nữ tù cục cằn, xua đuổi ('Cút, cút đi'), mặc cả đồ ăn, nên tao – mày; (cặp này là 女囚犯, nữ). [biên
    tập trưởng độc lập, 02/11]
- from: lilina
  to: prisoner54
  self: em
  call: chị
  note: Lilina đang bị dục vọng chi phối, nũng nịu nài nỉ ('Đừng lạnh lùng thế mà～'), nên hạ mình em –
    chị trước một kẻ đáp tao – mày, đúng kiểu người Việt. [biên tập trưởng độc lập, 02/11]
- from: giaovu
  to: lilina
  self: thầy
  call: em
  note: Giáo viên với học viên cũ ('thầy rất nhớ dáng em chăm chỉ học'), dặn dò kiểu thầy giáo ('Tối đừng
    chạy lung tung, về ký túc xá sớm'). [biên tập trưởng độc lập, 02/11]
- from: fitch
  to: bachtuyet
  self: ta
  call: cô / \N[67]
  note: Ông chủ trường đua nắm tiền chữa bệnh của mẹ cô, nói kiểu bề trên, thao túng ('thành tích dạo
    này kém nhỉ～'), nên ta – cô. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: fire_spirit
  self: tôi
  call: 'ngài; khi Tinh linh đã gọi Nữ vương đại nhân: ngươi (xưng ta)'
  changes: 'Từ lúc Tinh linh khẩn cầu và tôn Lilina làm Nữ vương: Lilina đổi sang ta – ngươi.'
  note: Lần đầu gặp, Lilina là người lạ đến xin mượn bảo vật của một thực thể cổ xưa, nên dùng tôi – ngài;
    về sau vị thế đảo ngược. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: galon
  self: tôi
  call: ngài
  note: Người lạ đến xin vật báu của một vị vua vong linh, vừa sợ vừa van ('Xin ngài tin tôi'), nên tôi
    – ngài trang trọng là hợp lý. [biên tập trưởng độc lập, 02/11]
- from: bruru
  to: fire_spirit
  self: (không có, chỉ nói 'Bù-rù')
  call: (không có)
  note: Bù-rù chỉ nói 'Bù-rù', ngữ điệu nằm ở dấu câu. Không thêm đại từ. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: galen
  self: tôi
  call: ông
  note: Người lạ, cô đang cần nhờ vả nên giữ khoảng cách bằng 'tôi', gọi 'ông' cho khớp với giọng 'ta'
    của hắn. [biên tập trưởng độc lập, 02/11]
- from: longngam
  to: loki
  self: tôi
  call: chỉ huy
  note: Hai người làm chung việc, Long Ngâm lễ phép. Gọi theo chức vụ ('Vậy chỉ huy có cách nào hay hơn
    không?') thì tránh được phải đoán tuổi. [biên tập trưởng độc lập, 02/11]
- from: cospiro
  to: mercenary
  self: ta
  call: 'các ngươi; một tên: ngươi'
  note: Thủ lĩnh Đoàn lính đánh thuê ra lệnh cộc ('Rút! Mang con đàn bà này về cho ta'). [biên tập trưởng
    độc lập, 02/11]
- from: mercenary
  to: cospiro
  self: 'thuộc hạ; cả nhóm: bọn thuộc hạ'
  call: đại nhân
  note: 'Gốc gọi 大人, đáp ''是！'': thuộc cấp trực tiếp, kính và sợ. [biên tập trưởng độc lập, 02/11]'
- from: insect_king
  to: lilina
  self: 'lặp đúng chữ trong bản dịch câu vừa rồi của Lilina (thường là ''mình''); lời riêng của nó: mình'
  call: 'lặp nguyên văn; lời riêng: không gọi (bỏ chủ ngữ)'
  note: Nó đọc to nguyên văn ý nghĩ của Lilina bằng giọng cô, nên phải lặp từng chữ đã dịch thì trò đùa
    mới ăn. [biên tập trưởng độc lập, 02/11]
- from: shop_clerk
  to: lilina
  self: em
  call: chị
  note: Nhân viên bán hàng nói ngọt, chèo kéo khách ('…cần tiền đó～'), xưng em gọi khách là chị theo kiểu
    bán hàng ở Việt Nam. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: shop_clerk
  self: chị
  call: em
  note: Khớp với cách cô nhân viên xưng em; Lilina là khách hỏi giá, giọng thân, không cần 'tôi'. [biên
    tập trưởng độc lập, 02/11]
- from: darren
  to: bill
  self: ta
  call: 'ngươi; nói về hắn: thằng đó/hắn'
  note: Giám ngục trưởng nói giọng quan cách, cộc với thuộc hạ ('Giờ làm việc mà chạy đi đâu rồi!'). [biên
    tập trưởng độc lập, 02/11]
- from: berika
  to: Succubus
  self: ta
  call: ngươi
  note: 'Dòng của Berika ở cặp này chủ yếu là Mắt Quỷ (魔眼) nói: ngang hàng với Succubus, cùng phục vụ
    Vua Succubus, giọng khinh khỉnh; Berika chính chủ thì gọi Mắt Quỷ là ''Mắt Quỷ đại nhân''. [biên tập
    trưởng độc lập, 02/11]'
- from: Succubus
  to: berika
  self: ta
  call: 'ngươi; gọi tên: Mắt Quỷ'
  note: Với người ngoài Succubus xưng ta; cố nhân ngang hàng, mỉa ngọt ('Lâu rồi không gặp ha～'). [biên
    tập trưởng độc lập, 02/11]
- from: berika
  to: ross
  self: ta
  call: 'ngươi; gọi tên: Ross'
  note: Berika là chủ thật, giật dây Ross, ra lệnh dứt khoát trong phòng làm việc. [biên tập trưởng độc
    lập, 02/11]
- from: mercenary
  to: owen
  self: thuộc hạ
  call: 'đại nhân; gọi tên: Owen đại nhân'
  note: Tên đào ngũ (tai mắt của Owen) xin thưởng, gốc '\N[12]大人'; đám lính báo cáo cũng dùng giọng thuộc
    cấp. [biên tập trưởng độc lập, 02/11]
- from: owen
  to: mercenary
  self: ta
  call: 'các ngươi; một tên: ngươi'
  note: Owen lộ mặt chỉ huy, diễn thuyết với bên thua và quát 'Câm miệng! Lính đánh thuê!'. [biên tập
    trưởng độc lập, 02/11]
- from: lilina
  to: sophia
  self: tôi
  call: 'cô; nhắc trong độc thoại: Sophia'
  note: Bị nhập xác, bị cưỡng ép nên cố ý giữ khoảng cách, phản kháng yếu ớt ('Đừng tưởng… tôi sẽ để các
    người…'). [biên tập trưởng độc lập, 02/11]
- from: sax
  to: shirley
  self: lão phu
  call: ngươi
  note: Lão quản gia già ra lệnh, nhắc 'đừng quên chức trách của ngươi'. [biên tập trưởng độc lập, 02/11]
- from: guard53
  to: trosi
  self: ta
  call: cô em
  note: Lính gác hống hách, trêu ghẹo cô nữ nô được Thành chủ cưng nên giọng suồng sã nhưng không chửi.
    [biên tập trưởng độc lập, 02/11]
- from: trosi
  to: guard53
  self: em; giữ \N[59] khi gốc dùng \N[59]
  call: chủ nhân (\N[53]主人 → 'chủ nhân lính gác')
  note: Trosi đóng vai nữ nô ngoan, gọi 'chủ nhân' theo gốc, xưng 'em' cho mềm và hợp giọng nhõng nhẽo.
    [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: master_generic
  self: em; giữ tên \N[1] khi gốc tự xưng bằng tên; 'người ta' khi gốc dùng 人家
  call: 'chủ nhân; khách nữ (女主人): nữ chủ nhân'
  changes: 'Trước khi nhận vai nô lệ (câu hỏi mở đầu ''là khách à?''): gọi ''quý khách'', chưa xưng. Từ
    lúc chấp nhận vai: em / chủ nhân.'
  note: Lilina trong vai nô lệ kỹ viện nên hạ mình, xưng em, gọi chủ nhân. [biên tập trưởng độc lập, 02/11]
- from: master_generic
  to: lilina
  self: 'ta; chủ thô lỗ, dọa trả hàng: tao'
  call: 'ngươi; chủ thô lỗ: mày; lúc âu yếm hám dục: cưng'
  note: Nhãn chung cho chủ thuê/khách, giọng bề trên với nô lệ; mức thô theo từng người. [biên tập trưởng
    độc lập, 02/11]
- from: cospiro
  to: owen
  self: ta
  call: ngươi
  changes: 'Khi Cospiro còn đóng vai tân binh lười: xưng ''tôi'', gọi ''hội trưởng''. Từ lúc hai bên lật
    bài đối đầu: ta / ngươi.'
  note: Trong samples hai bên đã là kẻ thù đấu trí, Cospiro lộ mặt thủ lĩnh lính đánh thuê. [biên tập
    trưởng độc lập, 02/11]
- from: hiller
  to: Succubus
  self: ta
  call: ngươi
  note: Tướng quỷ lộ mặt đe dọa linh hồn trong giáp, hai bên thù địch ngang cơ. [biên tập trưởng độc lập,
    02/11]
- from: student52
  to: teacher51
  self: em
  call: 'thầy; nếu giáo viên là nữ: cô'
  note: 'Học viên với giáo viên ở học viện: em – thầy/cô là chuẩn, không dùng ''tớ/tôi''. [biên tập trưởng
    độc lập, 02/11]'
- from: teacher51
  to: student52
  self: 'thầy; nếu giáo viên là nữ: cô'
  call: 'em; nói cả lớp: các em'
  note: Giọng đạo mạo của người dạy, tự xưng theo vai để tô đậm cái 'lẽ thường' vô lý. [biên tập trưởng
    độc lập, 02/11]
- from: guard53
  to: chloria
  self: 'ta; nói chung cả bọn: bọn ta'
  call: cô
  note: Lính gác suồng sã nhưng dè chừng sủng nô của Thành chủ (vội xin lỗi khi lỡ lời), nên không 'mày/cô
    em'. [biên tập trưởng độc lập, 02/11]
- from: dale
  to: seth
  self: bố
  call: 'con; khi gọi: Seth'
  note: Cha con trong nhà thợ rèn. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: lydis
  self: chị
  call: em
  note: Lilina là hội viên lâu năm, chủ động bắt chuyện tân binh nhút nhát và để ý cô ta; chị – em vừa
    thân vừa có thế trên. [biên tập trưởng độc lập, 02/11]
- from: lydis
  to: lilina
  self: em
  call: chị
  note: Tân binh tinh linh ngại ngùng, xưng em như hồ sơ, gọi đàn chị là chị. [biên tập trưởng độc lập,
    02/11]
- from: lilina
  to: roger
  self: em
  call: anh
  note: Cả hai cùng dưới trướng một 'chủ nhân' (Roger nhắc 'chủ nhân sẽ nổi giận'), Roger giúp đỡ như
    đàn anh hiền lành; anh – em thay cho 'tôi – anh'. [biên tập trưởng độc lập, 02/11]
- from: fitch
  to: sax
  self: ta
  call: 'ông; khi gọi lớn: quản gia'
  note: 'Ông chủ giang hồ ra lệnh cộc cho quản gia lớn tuổi: ''ta'' giữ thế chủ, ''ông'' giữ phép với
    người già. [biên tập trưởng độc lập, 02/11]'
- from: sax
  to: fitch
  self: tôi
  call: 'chủ nhân; khi thưa: ngài'
  note: Trước chủ, quản gia bỏ giọng 'lão phu' trịch thượng, thưa gửi đúng phép người làm; 'tôi' là khoảng
    cách chủ – tớ. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: parker
  self: em
  call: anh (gọi tên Parker khi gốc gọi tên)
  note: Đồng nghiệp trong Hội. Mặc định Parker lớn hơn, kiểu đàn anh nóng tính tốt bụng; 'em – anh' tự
    nhiên và tránh được 'tôi'. [biên tập trưởng độc lập, 02/11]
- from: parker
  to: lilina
  self: anh
  call: em
  note: Khớp với chiều kia; Parker nói bộc trực, thân mà không suồng sã ('Được, anh đi ngay!'). [biên
    tập trưởng độc lập, 02/11]
- from: lilina
  to: nicole
  self: chị
  call: em
  note: Nicole là nhân viên tiệm, đon đả, tự xưng 'em' với khách; Lilina là khách nên xưng chị gọi em
    cho khớp. [biên tập trưởng độc lập, 02/11]
- from: nicole
  to: lilina
  self: em
  call: chị
  note: Giọng nhân viên chèo kéo, ngọt với khách ('để em dọn cho chị nhé～'); khi nói với chủ tiệm về Lilina
    thì gọi 'chị Lilina'. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: villager2
  self: tôi
  call: 'các người; khi tức giận: lũ khốn'
  note: Hai gã dân làng lạ mặt giở trò lúc cô ngủ, nên Lilina giữ khoảng cách, giọng thù địch. [biên tập
    trưởng độc lập, 02/11]
- from: villager2
  to: lilina
  self: tao
  call: 'mày; khi nói với đại ca về cô: con nhỏ này'
  note: Gã em ngốc, thô tục; chủ yếu nói về cô với anh mình, ít khi nói thẳng với cô. [biên tập trưởng
    độc lập, 02/11]
- from: hart
  to: lilina
  self: tớ
  call: cậu
  changes: Với nam học viên khác Hart vẫn xưng 'tao', gọi 'mày/thằng nhóc' (你小子).
  note: Cùng là học viên, Hart giả bộ xởi lởi ('đùa thôi, đùa thôi'), nên dùng giọng bạn học chứ không
    phải tao/mày. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: hart
  self: tớ
  call: cậu
  note: Bạn học, Lilina ở học viện ngây ngô, gọi tên Hart, giọng ngang hàng. [biên tập trưởng độc lập,
    02/11]
- from: lilina
  to: lucia
  self: mình
  call: Lucia (gọi tên)
  note: Chưa rõ ai lớn hơn, nên Lilina gọi tên và xưng 'mình' cho trung tính; khi nài nỉ thì kéo dài 'Lucia～
    làm ơn mà～'. [biên tập trưởng độc lập, 02/11]
- from: lucia
  to: lilina
  self: Lucia
  call: Lilina (gọi tên)
  note: Lucia đã mất nhân cách, tự xưng bằng tên và gọi thẳng tên Lilina ('Lilina～ Lucia vào nhé～'). [biên
    tập trưởng độc lập, 02/11]
- from: sanga
  to: chloria
  self: '\N[59]; khi xưng danh công chúa: ta'
  call: 'ngươi; khi van xin cả hai: các người'
  note: Công chúa kiêu hãnh chống cự, gốc dùng \N[59]; câu '\N[59] là công chúa Đế quốc!' có thể chuyển
    'ta' cho có khí thế. [biên tập trưởng độc lập, 02/11]
- from: jon
  to: trosi
  self: bổn vương
  call: 'ngươi (gọi tên \N[63]); khi chiều chuộng cả hai chị em: hai đứa'
  note: Thành chủ ban ơn từ trên xuống với nữ nô, nhưng có lúc chiều hai chị em ('Thật hết cách với hai
    đứa!'). [biên tập trưởng độc lập, 02/11]
- from: trosi
  to: jon
  self: \N[59]
  call: chủ nhân
  note: Nữ nô ngoan, nhõng nhẽo, luôn gọi 'chủ nhân'. [biên tập trưởng độc lập, 02/11]
- from: godvoice
  to: lilina
  self: (không xưng)
  call: '(không gọi Lilina; khi cần thì nói với người chơi: bạn)'
  note: Giọng hệ thống, thông báo ngắn cho người chơi, không thoại với nhân vật. [biên tập trưởng độc
    lập, 02/11]
- from: lilina
  to: godvoice
  self: (không xưng; độc thoại thì 'mình')
  call: (không gọi)
  note: Lilina không nói với Giọng của Thần, chỉ tự nói câu chặn đường; nếu cần đại từ thì dùng 'mình'
    như độc thoại. [biên tập trưởng độc lập, 02/11]
- from: melissa
  to: lucia
  self: ta
  call: 'Lucia (gọi tên); ngôi hai: ngươi'
  note: Chủ ra lệnh cho món đồ chơi, giọng bề trên nhẹ nhàng ('Lucia, trói nó lên giá bên trái'). [biên
    tập trưởng độc lập, 02/11]
- from: lilina
  to: mystery_man
  self: tôi
  call: ngươi
  note: Gã lạ mặt bất ngờ trói được cô, nên Lilina cảnh giác, giữ khoảng cách ('Kẻ nào!', 'Đừng có tự
    nói tự nghe chứ…'). [biên tập trưởng độc lập, 02/11]
- from: mystery_man
  to: lilina
  self: ta
  call: nàng
  note: Giọng phô trương, lãng mạn kiểu cầu hôn ('người yêu dấu của ta'), nên dùng ta/nàng. [biên tập
    trưởng độc lập, 02/11]
- from: lilina
  to: taylor
  self: tôi
  call: ngài
  note: 'Tù nhân nói với quan quản lý mỏ: quan hệ trên dưới, xa lạ, trang trọng. [biên tập trưởng độc
    lập, 02/11]'
- from: taylor
  to: lilina
  self: ta
  call: cô
  note: Giọng quan chức cộc, coi cô là tù nhân nữ hiếm gặp, không thân. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: lisa
  self: em
  call: chị
  note: Lisa xưng chị, dỗ Lilina như đàn em, nên Lilina đáp em/chị cho khớp. [biên tập trưởng độc lập,
    02/11]
- from: darren
  to: guard53
  self: ta
  call: 'các ngươi; khi quát: bọn bay'
  note: Giám ngục trưởng ra lệnh cho lính dưới quyền, quát kiểu 'Câm mồm! Bọn bay là sơn tặc hay lính
    Đế quốc!'. [biên tập trưởng độc lập, 02/11]
- from: guard53
  to: darren
  self: thuộc hạ
  call: đại nhân
  changes: Lính nói với nhau thì xưng 'ông đây/tao' (老子).
  note: Lính đáp cấp trên 'Rõ! Đại nhân!'. [biên tập trưởng độc lập, 02/11]
- from: longngam
  to: ross
  self: tôi
  call: 'hiệu trưởng; khi phẫn nộ, đối đầu: ông'
  changes: Lúc mới vào phòng Long Ngâm còn lễ phép ('Hiệu trưởng, muộn thế này gọi tôi tới có việc gì
    ạ?'). Từ lúc thấy cảnh trong phòng và nổi giận ('Câm miệng!') thì gọi 'ông'.
  note: Hai người là đồng nghiệp, Ross lớn tuổi hơn và giữ chức trên; Long Ngâm lễ phép, giữ khoảng cách
    nên xưng 'tôi', lúc giận chỉ hạ xuống 'ông', không thành 'mày' vì tính cậu chính trực. [biên tập trưởng
    độc lập, 02/11]
- from: ross
  to: longngam
  self: ta
  call: cậu (gọi tên \N[7])
  note: Ross lớn tuổi hơn, ở thế bề trên và đang lộ mặt chủ mưu, giọng ban ơn kẻ cả với đồng nghiệp trẻ.
    [biên tập trưởng độc lập, 02/11]
- from: fire_spirit
  to: Succubus
  self: ta
  call: ngươi
  note: Tinh linh ngạo mạn, ra lệnh cộc ('Nhanh! Đưa khế ước cho ta!'), hai bên không thân, đều là thực
    thể phi nhân. [biên tập trưởng độc lập, 02/11]
- from: Succubus
  to: fire_spirit
  self: ta
  call: cô
  note: Succubus xưng 'ta' với người khác ngoài Lilina; gọi 'cô' cho đúng giọng mỉa mai, đỏng đảnh ('để
    ta giúp cô cởi trói nhé～'). [biên tập trưởng độc lập, 02/11]
- from: ils
  to: lilina
  self: tôi
  call: cô
  note: Hai mạo hiểm giả xa lạ đấu với nhau, Ils giọng nhà binh, thẳng thắn; 'tôi/cô' giữ đúng khoảng
    cách đối thủ. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: ils
  self: tôi
  call: anh
  note: Lilina tỉnh táo, nói với một mạo hiểm giả nam lạ, có vẻ lớn tuổi hơn, nên xưng 'tôi' gọi 'anh'
    cho đúng chất mạo hiểm giả và đúng khoảng cách. [biên tập trưởng độc lập, 02/11]
- from: snake_b
  to: snake_a
  self: em
  call: chị
  note: Xà nữ B gọi A là 姐姐; với chị ruột thì xưng 'em', không dùng 'ta' như khi nói với Lilina. [biên
    tập trưởng độc lập, 02/11]
- from: snake_b
  to: snake_c
  self: chị
  call: em
  note: Chị hai nói với em út; bên ngoài tàn nhẫn nhưng giữa chị em vẫn theo vai vế. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: rapist
  self: ta
  call: ngươi
  note: Lilina áp đảo một tên tội phạm, giọng đắc thắng, trêu chọc ('Định thôi miên ta à? Không có cửa
    đâu!'); không dùng 'tôi/anh' vì quá khách sáo với kẻ hiếp dâm. [biên tập trưởng độc lập, 02/11]
- from: rapist
  to: lilina
  self: tôi
  call: cô
  note: Hắn bị đánh bại, đầu hàng, giọng khúm núm; khi nhắc tới cô ở ngôi thứ ba (这女人) thì dịch 'con đàn
    bà này'. [biên tập trưởng độc lập, 02/11]
- from: anna
  to: ross
  self: em
  call: thầy (giữ \N[51] khi gốc dùng)
  note: Học viên với giáo viên; 'thầy phòng y tế' trong hồ sơ là lỗi thay thế từ, đúng ra phải là 'thầy'
    (老師). [biên tập trưởng độc lập, 02/11]
- from: ross
  to: anna
  self: thầy
  call: em (gọi tên \N[27])
  note: Ross giữ giọng thầy giáo ân cần để dụ và cấy ám thị cho học trò; hồ sơ ghi 'thầy phòng y tế' là
    lỗi, đúng ra là 'thầy'. [biên tập trưởng độc lập, 02/11]
handbook:
- src: 性福 / 幸福 (我好～\{性福\}～哦 / 我也覺得我很\{幸福\} / 太性福了 / 好性福啊)
  type: chơi chữ đồng âm, lặp xuyên game
  meaning: 性福 (phúc chăn gối) đồng âm với 幸福 (hạnh phúc)
  why: Lilina và nô lệ nói 'tính phúc', người ngây thơ đáp 'hạnh phúc'. Lặp ở Map006, 014, 040, 045, 085,
    092, 105, 124, 143, 190 và nhiều nơi khác
  vi: '性福 → ''hạnh phịch''; 幸福 → ''hạnh phúc''. Ví dụ: ''Em hạnh～\{phịch\}～quá～'' / ''Anh cũng thấy rất
    \{hạnh phúc\}''. Thống nhất cả game (thay cho phương án ''sướng'' ở ghi chép phần 14–21). Ở cảnh khóc
    Map040 vẫn dùng ''hạnh phịch'' vì độ chua đến từ nước mắt.'
- src: 有想要做的事嗎
  type: giấy nhiệm vụ kích hoạt ám thị
  meaning: Câu hỏi vô hại nhưng là công tắc kích hoạt 'Phù thủy hút tinh'
  why: Người chơi phải nhận ra câu này mỗi lần nó lặp lại
  vi: Có việc gì muốn làm không? (giữ y hệt mọi nơi, không thêm đại từ)
- src: 說實話
  type: giấy nhiệm vụ ám thị
  meaning: Buộc Lilina nói ra suy nghĩ thật dù vẫn tỉnh (ám thị 'Nói sao làm vậy')
  why: Lặp hàng chục lần
  vi: 'Nói thật đi (kéo dài: ''Nói～thật～đi～'')'
- src: '暗示: 野外露出/愛玩少女/高潮失禁/捨身取欲/異種苗床/活體人偶/吸精魔女/脫衣清醒/言行一致/夜晚調教/保守秘密/抵觸強奸/無法高潮/不許說謊'
  type: tên ám thị và lạc ấn (vật phẩm Danh sách Ám thị)
  meaning: Mỗi hệ ma pháp gắn một ám thị
  why: Là cơ chế gameplay; việc lách ám thị phụ thuộc đúng câu chữ
  vi: Khoe thân ngoài trời / Cô gái đồ chơi / Lên đỉnh són tiểu / Xả thân vì dâm / Ổ đẻ dị loài / Búp
    bê sống / Phù thủy hút tinh / Cởi đồ thì tỉnh / Nói sao làm vậy / Dạy dỗ ban đêm / Giữ bí mật / Kháng
    cự cưỡng hiếp / Không thể lên đỉnh / Không được nói dối
- src: 學習X系魔法，……，這是常識 / 使用光系魔法，就是要暴露自己的身體…
  type: công thức tẩy não lặp
  meaning: Biến hành vi tình dục thành 'kiến thức nền' của từng hệ
  why: Ross nói, Lilina lặp lại y nguyên; Map174 dùng lại
  vi: Học ma pháp hệ X thì…, đó là lẽ thường. / Dùng phép hệ X nghĩa là phải… (câu Lilina nhắc lại trùng
    từng chữ; 常識 luôn là 'lẽ thường', giữ mã màu)
- src: 感知它，控制它，聚焦它，釋放它！
  type: khẩu quyết bốn bước
  meaning: Bốn bước ma pháp Thủy hệ, ám chỉ tình dục
  why: Lặp ở Map160 ev10p0 và ev10p6
  vi: Cảm nhận nó, khống chế nó, hội tụ nó, giải phóng nó!
- src: 光的意義在於看見，正如暗的作用在於遮蔽 / 要駕馭風，先成為風 / 只有光才能揭示出了你的真實！ / 光的意義在于揭示真實
  type: châm ngôn giả, motif
  meaning: Lý lẽ để bắt cởi đồ hoặc 'tự do'
  why: Lặp ở cảnh Simelia và ở Học viện
  vi: Ý nghĩa của ánh sáng là để nhìn thấy, cũng như bóng tối là để che giấu / Muốn chế ngự gió, trước
    hết phải hóa thành gió / Chỉ ánh sáng mới phơi bày được con người thật của em! / Ý nghĩa của ánh sáng
    là phơi bày chân thật
- src: 自由之風 / 在風的領域里……一切都是自由的 / 欲望之火 / 溫暖之火 / 火系魔法的本質就是要溫暖人心
  type: motif ẩn dụ các hệ
  meaning: Gió tự do, lửa dục vọng, lửa sưởi ấm
  why: Lặp như câu chú, bị dùng làm cớ phóng túng
  vi: ngọn gió tự do / trong lãnh địa của gió… mọi thứ đều tự do / ngọn lửa dục vọng / ngọn lửa sưởi ấm
    / Bản chất ma pháp hệ Hỏa là sưởi ấm lòng người
- src: 那就接受這里的一切吧！
  type: câu chốt nghi thức
  meaning: Dùng ở cả cảnh Simelia lẫn cảnh Cha xứ
  why: Lặp có chủ đích
  vi: Vậy thì hãy đón nhận tất cả nơi đây! (y hệt ở cả hai cảnh)
- src: \N[59] (= 賤奴) / 賤……\N[59]明白了
  type: tự xưng bằng biến
  meaning: Cách tự xưng hèn bắt buộc của nô lệ Thành chủ; câu vấp cho thấy giá trị là 賤奴
  why: Trục tẩy não; các lần vấp và sửa lời là điểm kịch (Map139 ev9p0, Map144 ev24p0, Map085)
  vi: 'Giá trị DB: ''Con Nô Hèn''. Câu vấp: ''Tiện… \N[59] hiểu rồi''. Mọi câu phải đọc trôi khi biến
    hiện thành ''Con Nô Hèn'' ở mọi vị trí.'
- src: 拜托～主人～能不能不要滿嘴都是\N[59]啊……
  type: đùa về chính biến tự xưng
  meaning: Succubus than Lilina mở miệng là xưng 'Con Nô Hèn'
  why: Phá tường thứ tư (Map144 ev24p0)
  vi: Trời ạ～ chủ nhân～ đừng có mở miệng ra là \N[59] nữa được không…
- src: （\N[59]是\C[5]一條母狗 x N\C[0]）
  type: tự thôi miên, meme
  meaning: Nhẩm đi nhẩm lại một câu
  why: Ký hiệu 'x N' tạo hài đen (Map143 ev23p1, Map144 ev7p3)
  vi: (\N[59] là \C[5]một con chó cái x N\C[0]) — giữ 'x N' và mã màu
- src: \N[59]是屬于主人的，侍奉主人是\N[59]的榮幸，只要能聽到主人愉悅的叫聲，\N[59]就會感到無比的滿足，并獲得無盡的力量！
  type: câu niệm lặp
  meaning: Câu tự thôi miên của nô lệ
  why: Lặp như thần chú (Map144 ev7p6)
  vi: \N[59] thuộc về chủ nhân, được hầu hạ chủ nhân là vinh hạnh của \N[59]. Chỉ cần nghe tiếng chủ nhân
    sung sướng, \N[59] sẽ thấy mãn nguyện vô cùng và có được sức mạnh vô tận!
- src: \{\C[6]Zapfkiel～\C[0]\}… \{\C[6]Aleph！！！\C[0]\}
  type: tên chiêu tối thượng
  meaning: Zaphkiel (tên thiên thần), Aleph (chữ cái Hebrew)
  why: Khí thế chiêu cuối; Succubus can ngăn
  vi: Giữ nguyên chữ Latin và toàn bộ mã
- src: 不Y～～這樣的～～被Z怕D肏～～S的啊 / 舒F～～～再L啊！～～～還Y啊！
  type: lời rên bị bịt, viết tắt âm đầu pinyin
  meaning: '''Đừng… bị thứ đáng sợ nhất đụ chết mất'' / ''Sướng… nữa… còn muốn…'''
  why: Giả dạng tiếng nói vỡ vụn
  vi: Đ～～thế này～～bị cái thứ đ… s… nhất đụ～～ch… mất / S…～～～N… nữa!～～～M… nữa! (giữ số chữ bị cắt tương
    đương)
- src: 這下好多了，謝……啊！我……我在想什么呢！
  type: tự vả
  meaning: Suýt cảm ơn con côn trùng
  why: Chữ bị cắt giữa chừng mới gây cười
  vi: Đỡ hơn nhiều rồi, cảm ơ… Á! Mình… mình đang nghĩ cái gì thế này!
- src: 可惡，我居然身心都敗給了火焰……我可是火的魔女啊…… / 你不是火系魔法師嗎？難道還怕火？
  type: tự giễu, cà khịa
  meaning: Là Phù thủy Lửa mà thua lửa, sợ lửa
  why: Nối với danh hiệu Phù thủy Lửa
  vi: Đáng ghét, cả thân lẫn tâm đều thua lửa… mình là Phù thủy Lửa cơ mà… / Mày chẳng phải pháp sư hệ
    Hỏa sao? Còn sợ lửa à?
- src: 淫魔女王可不是異種的苗床哦～／（唉？不是嗎？）／當然不是啊！
  type: đối đáp hài
  meaning: Lilina ngây ngô hỏi lại
  vi: Nữ hoàng Succubus đâu phải ổ giống cho dị loài～ / (Ơ? Không phải à?) / Dĩ nhiên là không!
- src: 隨……隨便玩……／對～隨～便～玩～哦～
  type: điệp lời trêu
  vi: Tùy… tùy ý chơi… / Ừ～tùy～ý～chơi～nha～
- src: 這次就只劫財不劫色了 / 萬一中獎了，你可別怪我哦～
  type: thành ngữ, uyển ngữ
  meaning: '''Trúng thưởng'' = dính bầu'
  vi: Thôi, lần này chỉ cướp của, không cướp sắc. / Lỡ trúng số thì đừng trách tao nhé～
- src: 好啦，哈，跟原來一模一樣～
  type: punchline
