    không khớp nhau: giữ đúng nguyên văn.'
  - 'Ma thạch: Robert giấu ở khe đá gần hang nhỏ bãi biển phía tây cảng Anvil; pháp sư ở Bad End B nói
    ''đá ma thuật vẫn trong tay ta''; Succubus lén trả cho Lilina ''thứ gì đó'' ở đá phong ấn, không nói
