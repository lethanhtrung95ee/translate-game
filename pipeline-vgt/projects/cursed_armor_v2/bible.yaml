    có lúc lỡ gọi tên rồi sửa: ''\N[13]… à không, chủ nhân～''. Trong độc thoại gọi ''hắn''.'
  note: Với tân binh than thở thì cô ở thế đàn chị khuyên bảo nên dùng tôi–cậu. Biết hắn là kẻ khống chế
    mình thì đổi sang tôi–anh, giữ khoảng cách mà vẫn có tình. [biên tập trưởng độc lập, 02/11]
- from: mercenary
  to: lilina
  self: 'tao / bọn tao / bổn đại gia; khi trêu ghẹo, dụ dỗ: anh'
  call: mày / cừu non / con đĩ nhỏ / nhỏ kia
  note: Đám lính đánh thuê thô, đểu; 'anh' chỉ là giọng chọc ghẹo ('làm cừu non của anh nào～'). [biên
    tập trưởng độc lập, 02/11]
- from: lilina
  to: mercenary
  self: 'em / người ta (人家); khi chống cự: tôi'
  call: 'anh / anh lính (傭兵哥哥) / đại ca; khi chống cự: các người'
  note: Bị đuổi bắt, van nài nên hạ mình 'em – anh'; lúc cứng giọng chống lại mới 'tôi – các người'. [biên
    tập trưởng độc lập, 02/11]
- from: jude
  to: lilina
  self: 'tôi; khi lộ mặt / là chủ: ta'
  call: 'cô (gốc gọi 獵天使大人 thì dịch ''Thiên Sứ Săn Mồi đại nhân''); khi lộ mặt / là chủ: ngươi; trêu lúc
    làm tình: phu nhân / cựu phu nhân hội trưởng～'
  changes: 'Map014 (nhánh vòng cổ): đổi sang ta–ngươi ngay khi cô đeo vòng. Torres: lộ mặt ở Map154 ev2p6,
    làm chủ mới từ Map158 ev8p6.'
  note: Lúc đóng vai người ủy thác thì cố ý lễ độ, giữ khoảng cách nên dùng 'tôi'. Khi lật mặt thì đổi
    hẳn sang giọng trên dưới, gọi 'ngươi' cho đúng vẻ lạnh và thô. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: jude
  self: 'tôi; khi hắn là khách / chủ: \N[59]'
  call: 'anh; khi hắn là khách / chủ: chủ nhân'
  changes: 'Map154 (cô đã tự do, hắn giả thầy phòng y tế đi bói): vẫn tôi–anh. Bị ép làm nô lệ: \N[59]–chủ
    nhân.'
  note: Hai người lớn mới quen qua việc ủy thác, cô nói gọn kiểu mạo hiểm giả nên tôi–anh là tự nhiên.
    Không dùng 'ngài' để khỏi lệch với giọng lém của cô. [biên tập trưởng độc lập, 02/11]
- from: jude
  to: jon
  self: thuộc hạ / tôi
  call: đại nhân
- from: jon
  to: jude
  self: ta; bổn vương sau khi lộ mặt
  call: ngươi / \N[17]
- from: lilina
  to: chloria
  self: '\N[59] khi gốc dùng \N[59]; còn lại: em; khi chống cự: tôi'
  call: 'chủ nhân; khi chống cự: cô / đồ biến thái / ác quỷ'
  changes: 'Bị Chloria sửa nên dùng ''chủ nhân'' + \N[59]. Map140 ev18p1: lỡ gọi tên thì bị bắt sửa lại.'
  note: Ở Torres là nô dưới quyền Chloria; 'tôi – cô' chỉ dùng khi cố ý cự lại. [biên tập trưởng độc lập,
    02/11]
- from: chloria
  to: lilina
  self: '\N[59] khi gốc dùng \N[59]; còn lại: chị; khi mắng: tao'
  call: 'cưng (親愛的) / \N[1] / \N[61]; khi mắng: mày'
  note: Nữ nô được sủng ái, lớn hơn, đứng trên Lilina; ác nhân ngọt hợp 'chị – cưng', trở mặt thì 'tao
    – mày'; bỏ 'tôi'. [biên tập trưởng độc lập, 02/11]
- from: trosi
  to: lilina
  self: 'em; khi dắt Lilina làm chó: chủ nhân (gốc dùng \N[59] thì giữ \N[59])'
  call: 'chị; khi dắt chó: cún (gốc gọi \N[61] thì giữ \N[61]; nói về Lilina với Chloria thì dùng ''nó'')'
  changes: 'Vào cảnh đóng vai chó: chuyển từ em–chị sang chủ nhân–cún; hết cảnh trở lại em–chị.'
  note: Trosi nhỏ tuổi, gọi Lilina 姐姐 nên ngoài cảnh là em–chị; trong cảnh thì ra lệnh như dạy chó, gọi
    Lilina là 它 (nó). Câu 姐姐 trong samples là Trosi nói với Chloria, không phải với Lilina. [biên tập
    trưởng độc lập, 02/11]
- from: lilina
  to: trosi
  self: 'chị; khi đóng vai chó: \N[59] khi gốc dùng, không thì chỉ sủa ''Gâu～'''
  call: 'em; khi đóng vai chó: chủ nhân'
  changes: 'Trong cảnh vai chó: gọi Trosi ''chủ nhân'' (主人), tự xưng \N[59].'
  note: 'Bảng cũ cho Lilina gọi Trosi là ''chị'' là ngược vai vế: Trosi nhỏ hơn nên Lilina gọi em, chỉ
    trong cảnh nô lệ mới gọi chủ nhân. [biên tập trưởng độc lập, 02/11]'
- from: trosi
  to: chloria
  self: em; giữ \N[59] khi gốc dùng \N[59]
  call: chị
  note: Em gái ngoan theo chị, gốc gọi 姐姐. [biên tập trưởng độc lập, 02/11]
- from: chloria
  to: trosi
  self: chị; giữ \N[59] khi gốc dùng \N[59]
  call: 'em; khi gốc dùng 好妹妹: em gái ngoan'
  note: Chị ruột; \N[59] là tự xưng nô lệ trong gốc nên giữ nguyên. [biên tập trưởng độc lập, 02/11]
- from: chloria
  to: sanga
  self: \N[59]
  call: 'mày; khi mỉa: hồ ly tinh'
  note: Chloria ghen và khinh Sanga, vừa xưng \N[59] mỉa mai vừa mắng, nên gọi 'mày', gọi 'hồ ly tinh'
    khi chửi thẳng; khi giảng cho Lilina thì gọi Sanga là 'nó'. [biên tập trưởng độc lập, 02/11]
- from: chloria
  to: jon
  self: \N[59]
  call: chủ nhân
  note: Gốc dùng thẳng \N[59] và 主人, giọng õng ẹo nữ nô được sủng ái. [biên tập trưởng độc lập, 02/11]
- from: chloria
  to: guard53
  self: em; giữ \N[59] khi gốc dùng \N[59]
  call: 'chủ nhân (\N[53]主人); sau lưng: lũ đàn ông thối'
  note: Chloria ngoài mặt õng ẹo hạ mình với đàn ông, bên trong khinh; 'em – chủ nhân' cho đúng giọng
    ngọt giả. [biên tập trưởng độc lập, 02/11]
- from: jon
  to: chloria
  self: bổn vương
  call: 'nàng (gọi tên theo gốc \N[62]/\N[63]); cả hai chị em: hai đứa'
  note: 本王 ban ơn với nô được sủng ái nhất; 'nàng' thể hiện cưng chiều mà vẫn ở trên. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: jon
  self: \N[59]
  call: chủ nhân (giữ '\N[14] chủ nhân' khi gốc ghép tên)
  note: Trong vai nô lệ, gốc dùng \N[59] và 主人 nhất quán. Đóng vai chó thì chỉ 'Gâu～'. Độc thoại vẫn xưng
    \N[59] theo gốc. [biên tập trưởng độc lập, 02/11]
- from: jon
  to: lilina
  self: bổn vương
  call: 'ngươi (gọi tên \N[1] khi gốc gọi tên); khi khinh: con chó cái / chó cái nhỏ (小母狗); sau khi ban
    tên: \N[61] (\N[62] khi gốc dùng \N[62])'
  changes: Từ lúc ban tên ở Map158 ev8p0 thì gọi \N[61].
  note: 'Thành chủ quyền lực tuyệt đối, giọng ban ơn: bổn vương–ngươi. [biên tập trưởng độc lập, 02/11]'
- from: lilina
  to: sanga
  self: '\N[59] khi gốc dùng \N[59]; còn lại: chị; khi điều giáo ra oai: ta'
  call: em / \N[64] → \N[18]
  changes: 'Map144 ev16p1: Sanga xin được gọi tên thật, chuyển từ \N[64] sang \N[18].'
  note: Lilina là 'chủ nhân' điều giáo nhưng thương Sanga, nên 'chị – em'; ra oai mới 'ta'. [biên tập
    trưởng độc lập, 02/11]
- from: sanga
  to: lilina
  self: '\N[59] khi gốc dùng \N[59]; còn lại: em; khi kiêu hãnh/chống cự: ta (gọi Lilina là ''ngươi'')'
  call: 'chủ nhân / \N[1] chủ nhân; khi được cứu, riêng tư: chị \N[1]; nhánh sa ngã: chị'
  changes: 'Map144 ev8p0: lần đầu lí nhí gọi ''\N[1] chủ nhân''. Lúc chống cự đầu tiên: ''ta là công chúa
    Đế quốc!'''
  note: Công chúa kiêu hãnh thì 'ta – ngươi', thuần rồi thì nũng 'em – chủ nhân/chị'. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: trainer
  self: 'tôi; khi bị ép theo luật nô lệ: \N[59] (giữ gốc)'
  call: 'ông; khi bị ép: chủ nhân'
  changes: 'Khi bị bắt thêm ''chủ nhân'' sau mỗi câu cảm ơn (''Cảm… cảm ơn… chủ nhân…''): chuyển sang
    \N[59]–chủ nhân.'
  note: Lúc đầu Lilina chống đối, cố ý giữ khoảng cách với kẻ buôn người nên dùng tôi–ông; chỉ khi bị
    cưỡng ép mới đổi. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: guard53
  self: '\N[59] khi gốc dùng \N[59]; khi làm nô lệ/lả lơi: em; tỉnh táo với lính gác lạ: tôi'
  call: 'khi làm nô lệ: chủ nhân / chủ nhân lính gác; lả lơi: anh lính; bình thường: ngài lính gác / đại
    nhân'
  note: Ở Torres là nô lệ nên 'chủ nhân'; ngoài đó gặp lính gác lạ mới giữ 'tôi – ngài lính gác'. [biên
    tập trưởng độc lập, 02/11]
- from: guard53
  to: lilina
  self: tao
  call: mày / con nô lệ / đồ gái dâm
  note: Lính gác hống hách, dâm, ra lệnh cộc với nô lệ; dùng 'tao – mày' thống nhất. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: resk
  self: em
  call: anh / anh \N[19]
  note: Resk là mạo hiểm giả đàn anh trong Hội, Lilina là người mới; em – anh khớp với giọng anh ta bao
    bọc, lo lắng cho cô. [biên tập trưởng độc lập, 02/11]
- from: resk
  to: lilina
  self: 'anh; khi dọa người khác: tao'
  call: 'em / \N[1]; khi gốc trêu: tiểu thư \N[1] / Thiên Sứ Săn Mồi đại nhân'
  note: Đàn anh bình dân, tốt bụng, nhiệt tình ('Em ổn chứ! Bị thương chỗ nào? Anh đưa em đi bác sĩ ngay!');
    bỏ 'tôi' của hồ sơ vì quá xa cách. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: shuria
  self: em
  call: cô
  note: Shuria là cô giáo cũ, gốc gọi 老師 suốt, nên em/cô như học trò với cô giáo. Không gọi 'bà chủ' khi
    gốc ghi 老師. [biên tập trưởng độc lập, 02/11]
- from: shuria
  to: lilina
  self: cô
  call: 'em; khi trêu ghẹo: tiểu mỹ nhân'
  note: Cô giáo với học trò cũ, khớp với Lilina gọi 'cô'. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: nell
  self: mình
  call: cậu
  note: Hai nữ mạo hiểm giả trẻ cùng Hội, Lilina chủ động bắt chuyện thân thiện; dùng mình–cậu. Ở Torres
    vẫn giữ mình–cậu, vì là người quen cũ. [biên tập trưởng độc lập, 02/11]
- from: nell
  to: lilina
  self: mình
  call: cậu (gốc gọi tên thì giữ \W[3])
  note: Nell biết Lilina qua cái tên \W[3] cô tự giới thiệu; ngang hàng, về sau thì bỗ bã và hơi trách
    móc nhưng vẫn mình–cậu. [biên tập trưởng độc lập, 02/11]
- from: lilith
  to: lilina
  self: tôi
  call: quý khách → cô
  changes: Lúc chào hàng thì gọi 'quý khách'; từ khi ký hợp đồng/vi phạm hợp đồng thì gọi 'cô' ('Cô vi
    phạm hợp đồng!').
  note: Chủ tiệm khôn buôn cố ý giữ giọng thương mại, lạnh lùng khi đòi phạt theo hợp đồng. [biên tập
    trưởng độc lập, 02/11]
- from: lisa
  to: lilina
  self: chị
  call: 'em; khi dỗ ngọt: đứa trẻ ngoan'
  note: Giữ hồ sơ cũ; bỏ dạng 'em / đứa trẻ ngoan', chỉ dùng 'đứa trẻ ngoan' khi gốc dỗ dành. [biên tập
    trưởng độc lập, 02/11]
- from: meili
  to: lilina
  self: 'chị; trong phòng SM: ta (xưng chủ nhân khi gốc dùng)'
  call: 'em / \N[1]; trong phòng SM: mày / con chó cái nhỏ biến thái'
  changes: Từ lúc đưa Lilina về phòng thực hiện giao ước (đêm làm nô lệ) đổi sang ta – mày; sáng hôm sau
    trở lại chị – em.
  note: Meili là 'đại tỷ' trưởng nhóm, cộc, bá đạo, thích ra điều kiện; ngoài đời chị – em, vào phòng
    SM thì chủ – nô. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: meili
  self: em
  call: 'chị \N[5]; trong phòng SM: chủ nhân'
  changes: Vào phòng phải gọi chủ nhân (vẫn xưng em), sáng hôm sau hết hạn thì gọi lại chị.
  note: Lilina nhỏ hơn và đang mang ơn/nợ nhóm của Meili; xưng em kiểu cãi cố ('Nhưng nhiệm vụ đâu có
    xong!') vẫn khớp với chị – em. [biên tập trưởng độc lập, 02/11]
- from: meili
  to: roger
  self: ta
  call: 'mày; khi gọi thẳng (賤狗): đồ chó hèn'
  note: Roger là nô lệ, đầy tớ của Meili; cô ta ở vị thế 'chủ nhân' tuyệt đối, ra lệnh cộc. Sửa 'chó hèn
    / đồ chó' thành một cách gọi duy nhất. [biên tập trưởng độc lập, 02/11]
- from: roger
  to: meili
  self: tôi
  call: chủ nhân
  note: Roger ít lời, phục tùng hoàn toàn, chỉ đáp 'Vâng! Chủ nhân!'; 'tôi' là cách xưng của kẻ hầu. [biên
    tập trưởng độc lập, 02/11]
- from: roger
  to: lilina
  self: anh
  call: em
  note: Roger ít lời, tử tế ('Cứ để anh!', 'Em chạy mau đi'); sửa 'tôi – cô' trong hồ sơ cho khớp chiều
    ngược lại. [biên tập trưởng độc lập, 02/11]
- from: lucia
  to: melissa
  self: Lucia
  call: chủ nhân
  note: Phục tùng tuyệt đối, tự xưng bằng tên, 'Vâng, chủ nhân'. [biên tập trưởng độc lập, 02/11]
- from: melissa
  to: lilina
  self: chị
  call: 'em; khi gốc gọi đứa trẻ nóng vội: cô bé nóng vội'
  note: Đàn chị cùng Hội, nói ngọt mà toan tính, bề trên ('Chúc em may mắn!', 'nể tình cùng Hội, một triệu
    G, thế nào?'); giọng chị – em ngọt ngào làm tăng chất ác nhân ngọt hơn 'ta – cô'. [biên tập trưởng
    độc lập, 02/11]
- from: lilina
  to: melissa
  self: em
  call: 'chị; khi gốc gọi tên: chị \N[9]'
  note: Lilina là người nhỏ tuổi hơn trong Hội, đến hỏi chuyện, nhờ việc, nên em – chị; khi cãi chuyện
    vi phạm hợp đồng vẫn giữ em – chị, chỉ đổi giọng gắt. [biên tập trưởng độc lập, 02/11]
- from: lilina
  to: darren
  self: 'tôi; khi sa đọa: em (''người ta'' khi gốc dùng 人家)'
  call: 'ngài; khi sa đọa: ngài, có lúc gọi thẳng tên Darren'
  note: Tù nhân với giám ngục là quan hệ xa cách, bị ép buộc, cô dè chừng ('呼……好險') nên giữ tôi–ngài.
    Khi sa đọa mới mềm thành 'em'. [biên tập trưởng độc lập, 02/11]
- from: darren
  to: lilina
  self: 'ta; khi dâm, đắc ý: lão đây'
  call: 'ngươi (gọi tên \N[1] khi gốc gọi tên); khi chửi: tiện nhân / con đĩ'
  note: 'Giám ngục với nữ tù: quan cách, ra lệnh cộc, khinh rẻ nên dùng ta–ngươi. [biên tập trưởng độc
    lập, 02/11]'
- from: lilina
  to: robert
  self: cháu
  call: ông
  note: 'Cô gái trẻ với ông lão tù hiền hậu: cháu–ông. Câu 老人家 dịch thành ''ông ơi'' hoặc ''ông cụ''.
    [biên tập trưởng độc lập, 02/11]'
- from: robert
  to: lilina
  self: 'ông; tự giễu (糟老頭): lão già này'
