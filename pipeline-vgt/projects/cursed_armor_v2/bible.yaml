# HO SO DICH - hay doc ky va sua truoc khi dich hang loat.
# Sai o day = sai ca game (xung ho, gioi tinh, ten).
# Xong thi doi `reviewed: false` thanh `reviewed: true`.
#
# characters[].names : moi cach ten xuat hien trong game (ke ca \N[1], ten trong 【】)
# characters[].faces : ten file mat nhan vat (RPG Maker) de nhan ra nguoi noi khi khong co ten
# characters[].self  : dai tu tu xung mac dinh; forbid: tu cam dung cho nhan vat nay
# relations          : A noi voi B -> self (A xung), call (A goi B)
# key_scenes         : nhom/canh quan trong -> dich bang model manh (xem config models.key_scene)
# work               : boi canh, premise (gui kem moi lo dich), cot truyen, chu de, chi tiet cai cam
# style.strategy     : muc Han-Viet, cach xu ly choi chu / tho / ten
# handbook           : cau dua, choi chu, tho, ke, than chu va cach dich thong nhat
# can_xac_nhan       : diem chua chac -> nguoi dung tra loi, sua o day
reviewed: true
note: tự rà bởi Claude 31/10/2026 (đối chiếu Actors.json, HUONG_DAN mục 6), người dùng chưa duyệt; can_xac_nhan
  còn mở.
source_lang: zh
work:
  background: 'Cursed Armor (詛咒鎧甲) là game của tác giả wolfzq (itch.io: wolfzq.itch.io/cursedarmor; có
    Patreon). Game làm bằng RPG Maker MV, dùng plugin riêng Z_Wolfzq_Text.js. Trên Steam là app 907090,
    phát hành khoảng 14/11/2018 qua dòng Mango Party, nhãn Adult Only. Bản tiếng Anh chính thức có giao
    diện và phụ đề, không lồng tiếng; tên nữ chính chính thức là Lilina. Game có hai DLC ''Flesh sheath'',
    ''IF Aisha'' và phần tiếp Cursed Armor II (True End tuyến Bọ quỷ kết bằng dòng quảng cáo ''Cursed
    Armor II – Kinh đô Đế quốc''). Thể loại: sandbox sa đọa phi tuyến, hơn 200 sự kiện, chơi trên 20 giờ,
    nhiều tuyến và nhiều kết loại trừ nhau, có hệ thống thay trang phục (đổi sprite và hoạt ảnh) cùng
    các chỉ số Dâm năng, Phục tùng, Trung thành. Script viết bằng chữ Trung phồn thể, còn sót dấu vết
    chuyển từ giản thể (么, 圣, 杰, 后, 仆…) và có nhiều lỗi gõ. Phần lớn cảnh có hai biến thể thoại: Lilina
    còn trong trắng/đang kháng cự, và Lilina đã sa đọa. Tác giả hay chen lời meta: Giọng của Thần (\N[50]),
    Thần Sói (狼神, hiện thân tự giễu của wolfzq, ''con sói lười''), quảng cáo Patreon, ''các quý ông''
    (紳士 = người chơi), câu ''Cursed Armor còn ra phần tiếp à?''. Game nhại nhiều nguồn: meme mạng Trung
    Quốc (Đại thoại Tây du, ''高，實在是高'' trong phim Địa đạo chiến, ''骯臟的PY交易'', ''藥不能停'', ''泰迪''), Skyrim/Elder
    Scrolls (đầu gối trúng tên, Skooma), Fate (Tamamo, Nero, Jeanne Alter), Re:Zero (Ram/Rem), SAO, Date
    A Live, Taimanin… Ý đồ tác giả: để người chơi tự chọn giữa giữ ước mơ và sa ngã. Hài và bi xen nhau.
    Mỗi tuyến là một ''vở kịch'' thao túng có người giật dây (Owen, Jude, Ross/Berika, Thần Sói), và nhiều
    cú lật đến từ chính những người Lilina tin.'
  premise: 'JRPG người lớn của wolfzq. Lilina, pháp sư hệ Hỏa ngây thơ, mơ thành mạo hiểm giả vĩ đại.
    Cô bị ép đội Vương miện Nguyền Rủa của Chúa tể Succubus Eros, trong giáp có Succubus trú ngụ, vừa
    giúp vừa xúi cô sa ngã. Muốn cởi giáp, cô phải tìm sáu thánh vật qua hàng chục tuyến rẽ nhánh: Hội
    mạo hiểm, nhà ngục, học viện, thành nô lệ Torres, trường đua kỳ lân, hang bọ. Cái hay: mỗi cảnh có
    hai giọng (trong trắng/sa đọa); độc thoại trong ngoặc tỉnh táo, cà khịa, trái hẳn lời phục tùng ngoài
    miệng; hài tự vả, meta; và những cú phản bội từ chính người cô tin.'
  synopsis: 'KHUNG CHUNG (phi tuyến, nhiều nhánh loại trừ nhau): 1500 năm sau khi Ma Vương bị phong ấn,
    Lilina, cô gái lớn lên ở cô nhi viện, cựu học viên ưu tú hệ Hỏa và còn trinh, đến thành Anvil. Trước
    tượng nữ anh hùng \N[60], một Giọng nói bí ẩn dụ cô ra khu mộ, và tay cô tự đội Vương miện Nguyền
    Rủa lên đầu. Cha xứ Hiller (\N[2], người nuôi cô) cứu cô khỏi một zombie. Ông xác định đây là lời
    nguyền của Chúa tể Succubus Eros, tìm được sách 《Nhẫn Succubus》 kể về cô gái Kyle từng giải lời nguyền
    bằng thánh vật, rồi lần lượt đưa manh mối về sáu thánh vật; có lần ông lỡ nói ''7'' rồi chữa là ''nói
    nhầm''. Bộ giáp hiện hình thành Succubus (\N[4]), dạy Lilina về năng lượng dâm dục: thiếu năng lượng
    dâm dục thì giáp tan và cô bị dục vọng hành hạ. Giáp tiến hóa từ vương miện → gông → vòng cổ → giáp
    toàn thân qua lễ đăng quang. Succubus muốn đưa Lilina lên ngôi Nữ hoàng Succubus. Sáu thánh vật: Tinh
    thể Thần Nước (khế ước 7 ngày với ba chị em Người rắn), Quả Vàng (Cây Thần nghìn năm), Quyền trượng
    Chết chóc (vua vong linh Galon giữ hồn vợ là Sophia), Sừng gãy của Bò Thần (Succubus đem 1/7 linh
    hồn Lilina ban sự sống cho Vệ binh Đất), Hoa Băng (Tinh linh Nước chiếm xác Tinh linh băng), Ngọc
    Lửa Rực (Tinh linh Lửa nhập xác Lilina để làm vợ quỷ ăn thịt người Bù-rù). Sau mỗi khế ước Lilina
    lại mất trí nhớ, và cô tưởng là do bộ giáp.

    TUYẾN HỘI / ANVIL: Hội trưởng Owen (\N[12]) đòi 5000G hoặc ''trả bằng thân thể''. Lilina gặp Meili
    (\N[5]) và đầy tớ Roger, nhà nghiên cứu Melissa (\N[9]), học giả slime, cô bán hoa với ''mật mã hoa'',
    ông chủ nhà tắm, Anh hùng Hentai ZERO. Vụ hiếp dâm hàng loạt: chỉ huy Loki (\N[69]) dùng Lilina làm
    mồi, cùng bậc thầy phòng y tế thôi miên Long Ngâm (\N[7]) cài ám thị. Thủ phạm thật là phó quan Berika
    (\N[8]), vật chủ của Mắt Quỷ; cô ta khắc Dấu ấn linh hồn và chuỗi ám thị lên Lilina, rồi bị bắt. Long
    Ngâm ăn năn, tỏ tình, hai người thành đôi. Lính gác bị ám sát và Hội bị vu là thủ phạm. Lilina làm
    nội gián hai mang giữa Owen và Cospiro (\N[13], thực ra là thủ lĩnh Đoàn lính đánh thuê). Cospiro
    khống chế cô bằng độc (5 ngày phải uống thuốc giải đặc biệt một lần) và dần thật lòng với cô. Owen
    cầu hôn, dàn xếp cho cô thắng danh hiệu Thiên Sứ Săn Mồi, hy sinh bạn thân Reno. Ở Map133 Owen lộ
    là kẻ viết ''kịch bản'': kẻ chết thay, tai mắt trong đoàn, danh hiệu, lời cầu hôn đều được dựng. Lilina
    phải nhận vai ''nữ vương'' của Succubus để thoát phục kích, rồi đổi sự phục tùng lấy mạng Cospiro.
    Kết: người của Owen chính là kẻ xúi vụ ám sát; hắn nắm thuốc giải, Lilina phải xưng ''đại nhân''.
    Có đám cưới ở Nhà thờ lớn Thánh đô. Ở nhánh ''Kết thúc vở kịch này'' (Map135), Owen thành thủ lĩnh
    đoàn lính đánh thuê và biến cô thành nô lệ tình dục của cả đoàn.

    TUYẾN TORRES (Map137–158): ở Torres, ''thiên đường của đàn ông, địa ngục của đàn bà'', đàn bà chỉ
    được vào thành với thân phận nô lệ. Theo ủy thác của Jude (\N[17]), Lilina giả làm nô lệ để cứu Công
    chúa thứ ba Sanga (\N[18], Công chúa Trăng Bạc). Cô bị kẻ thuần hóa khống chế và đem đấu giá. Chloria
    (\N[15]), nữ nô sủng ái nhất của Thành chủ Jon (\N[14]), lừa cô ký khế ước nô lệ vĩnh viễn. Cô phải
    tự xưng \N[59] (Con Nô Hèn), được ban tên chó \N[61] (Teddy Đen), đóng vai chó cùng Trosi (\N[16]).
    Rồi chính cô được giao thuần hóa công chúa, và Succubus khơi máu S của cô. Các tuyến phụ: đấu trường,
    kỹ viện (cô giáo cũ Shuria), quán rượu múa gợi tình, Skooma, cuộc thi Nữ hoàng vũ điệu, tiệm Ngôi
    Nhà Tình Yêu (thí nghiệm Futa). Jude bày kế giả bắt cóc chị em Chloria qua tay Resk (\N[19]), dồn
    Lilina vào thế phải đầu độc Thành chủ. Map158 ev8p5: tùy độ Trung thành mà cô giết hoặc cứu Thành
    chủ. Map153: cô bị chém đầu, Succubus hồi sinh cô và xóa ký ức cả đảo; lần đầu cô hứa ''cân nhắc''
    việc làm nữ vương. Cú lật Map154: Jude là đệ nhất mưu sĩ Đế quốc chơi hai mặt; ''？？？'' là em trai,
    cũng là ''cái bóng'' của Thành chủ, đã cướp Xiềng xích nô lệ để thành Thành chủ mới; Jude thành chủ
    mới của Chloria và Trosi. Nhánh khác: Jude đeo vòng cổ chém đầu và bán cô sang Torres (Map014 ev11p0);
    về sau cô là Thiên Sứ Săn Mồi bề ngoài anh hùng nhưng lén tuyển nô lệ, và quản gia Sax (\N[21]) dùng
    dinh thự ở cảng làm cơ sở.

    TUYẾN NHÀ NGỤC ĐẾ QUỐC: trưởng ngục Darren (\N[35]), phiếu lao động, mỏ quặng, nông trại, trùm phòng
    giam, quan hậu cần Bill. Ông lão tù Robert (\N[40]) là cha của Lucia (\N[10]), từng bị Melissa hủy
    hoại gia đình, và giữ bí mật về đá ma thuật Abaddon. Lilina vượt ngục bằng túi khí, hoặc ở lại làm
    nô lệ.

    TUYẾN HỌC VIỆN MA PHÁP: ''lẽ thường'' của học viện bị bẻ cong thành ''học ma pháp bằng tình dục'',
    mỗi hệ một ám thị. Ross (\N[25], thầy phòng y tế hướng dẫn, tay chân của ''bà ta'' Berika) và con
    trai Roster (\N[26]) dùng chuông thôi miên và thủy tinh hút năng lượng dâm dục. Berika giả làm quyền
    hiệu trưởng, phong ấn Succubus; Long Ngâm bị xóa ký ức. Map041–047: Lilina đập vỡ thủy tinh; hoặc
    thành búp bê sống, bị ép giết Long Ngâm, nhận đồng hồ quả quýt ''di vật''; hoặc Ross thành hiệu trưởng.
    Map159–165 (phép cấm Búp bê sống): ở nhánh tốt, tình yêu với Long Ngâm phá phép cấm, Lilina giết Ross,
    Succubus thú nhận không muốn phục sinh Vua Succubus, Lilina quyết làm Nữ hoàng Succubus và thề thanh
    toán với \N[8]. Các bad end: Mẹ của Succubus, u linh, Bad End B (20 năm sau Vua Succubus phục sinh).

    TUYẾN MA TRÙNG / ABADDON: Melissa và Lucia (Kiếm Thánh Gió, nay là Nữ vương Abaddon), đá ma thuật,
    đá phong ấn ở Làng Đảo Nhỏ. Ở hang Ký sinh trùng, Lilina gặp Aisha (\N[23]), cựu nữ mạo hiểm giả số
    một nay là ''vợ trùng''; cô sinh Vua Côn Trùng của riêng mình (con này đọc to suy nghĩ của cô), nhường
    ngôi cho Aisha và nhận dây chuyền. Làng có tượng ma thần (Map168–184): anh em dân làng bỏ thuốc mê,
    quán trọ trả bằng thân thể, bọn cướp (Map173), gia sư cho cha con Dale và Seth (Map174). Vương trùng
    ký sinh, Lilina hóa nữ yêu Abaddon, mất dần nhân tính; Luna (\N[41]) xin làm ''con'' cô, và ở Bad
    End A sử sách chỉ ghi tên Luna. True End (Map026 ev4p2): Succubus đồng hóa ấu trùng Vương trùng và
    có quyền điều khiển thân thể Lilina. Map189–190 (Troops): Thần Sói (\N[56]), vị thần giật dây các
    dòng thế giới, bị Lilina ''giết thần'' đánh bại; Thần Sói xóa ký ức cô (''chắc lại say rồi''); hậu
    truyện là Succubus mượn thân thuần hóa Thần Sói thành nô lệ Harpy. Map184: kết ''Hoàng Yến trong lồng'',
    hoặc Lilina bỏ đám cưới với James (\N[47]); tuyến James có ''Thử thách cô dâu'' cùng Ram/Rem.

    TUYẾN TRƯỜNG ĐUA KỲ LÂN: Lilina mắc nợ Fitch (\N[65]), bị cho uống ''thánh thủy'' nên Succubus bị
    phong ấn. Vua Kỳ Lân (người tình của Fitch) muốn cô sinh con cho tộc kỳ lân; Bạch Tuyết (\N[67]) bị
    ép làm tay trong. Có hôn lễ thần thánh với \N[11] và Kỳ Lân End.

    TUYẾN DI TÍCH (cao trào, Map100): Hiller thực ra là Tướng quỷ số một (Cánh Đen, vốn là người, bị xóa
    ký ức), Simelia (\N[3]) theo phe ông, Succubus phản cả hai. Các kết: Good End A (Hiller tự phong ấn,
    Simelia ôm ông biến mất, nhại Đại thoại Tây du), Bad End A (Eros hút Lilina, Map079), Normal End (Succubus
    chiếm thân), Good End B (10 năm trong mật thất của Hội).'
  themes:
  - 'Sa ngã hay giữ ước mơ: cùng một cảnh có hai giọng trong trắng và sa đọa'
  - 'Ý chí bị thao túng: ám thị, ''lẽ thường'' bị bẻ cong, khế ước 1/7 linh hồn, thuốc giải, Skooma, vòng
    cổ nô lệ'
  - 'Thao túng như sân khấu: ''kịch bản'' của Owen, Jude, Thần Sói/tác giả, và nhân vật chống lại kịch
    bản'
  - 'Ngôn ngữ làm công cụ tẩy não: xưng hô (\N[59], ''chủ nhân''), chữ ''lẽ thường'', câu niệm'
  - 'Lời ngoài miệng và lòng thật: độc thoại trong （） là phao cứu bản ngã'
  - 'Gia đình và phản bội: Cha xứ, Simelia, Owen, Jude'
  - 'Mỉa mai danh hiệu: Thiên Sứ Săn Mồi, phu nhân hội trưởng, thánh nữ khoác lên thân phận nô lệ'
  - 'Quyền lực đảo vai: nô lệ thành chủ, công chúa bắt ''chủ nhân'' chịu trách nhiệm, thần thành nô lệ'
  - 'Tình yêu bị tước đoạt: Long Ngâm, Tinh linh Lửa với Bù-rù, Galon với Sophia'
  - 'Cái giá của sức mạnh: con số 7, 1/7 linh hồn'
  - Hài tự giễu, meta, phá tường thứ tư làm đối trọng cho bi kịch
  arcs: '1) Lilina: hồn nhiên (''một mạo hiểm giả vĩ đại sắp ra đời～'') → bị nguyền → giằng co giữa tự
    trách (''Mình đang nghĩ cái gì thế này!'') và buông thả. Mỗi tuyến cô sa ngã một kiểu (nô lệ, phu
    nhân giả, búp bê, vợ trùng, vợ thú, nữ yêu, nữ vương), ở nhánh thiện vẫn bám ước mơ; dần đi tới vị
    trí ''nữ vương''. 2) Lilina–Succubus: từ kẻ ký sinh trục lợi, đòi giá bằng năng lượng dâm dục, thành
    người bảo hộ mập mờ (ghen, dỗi; sợ Lilina thành công cụ của Vua Succubus như \N[60]; quá khứ là người
    tên Cecilia), thú nhận không muốn Vua Succubus phục sinh. 3) Lilina–Hiller/Simelia: tình cha con,
    chị em ấm áp, nghi ngờ được gieo dần rồi vỡ ở Map100; nghẹn ở câu ''các con đều là người nhà yêu quý
    nhất''. 4) Lilina–Long Ngâm: ngượng ngùng → tỏ tình → ''anh yêu'' → bị xóa ký ức / chết dưới tay cô
    / là ước nguyện cuối cùng phá phép cấm búp bê. 5) Lilina–Owen: từ gã dê xồm thành chỗ dựa, người cầu
    hôn, rồi lộ là tác giả ''kịch bản''. Cospiro: kẻ khống chế mà thật lòng. 6) Torres: kháng cự → phục
    tùng giả → ranh giới giữa diễn và thật mòn đi (''\N[59] là một con chó cái x N'') → máu S khi làm
    chủ của Sanga → giết hay cứu Thành chủ. 7) Lilina–Aisha: từ chửi ''lợn nái!'' đến nhường ngôi. 8)
    Ma trùng/Thần Sói: mất nhân tính nhẹ tênh mà rợn, chống lại ''kịch bản'', thắng thần, bị xóa ký ức;
    hậu truyện buồn: ''chân ái là thứ mình không bao giờ có được ở nhân gian''. 9) Các mạch phụ cảm động:
    Robert, Tinh linh Lửa–Bù-rù, Galon–Sophia, Bạch Tuyết, Sanga.'
  foreshadowing:
  - '6 hay 7 thánh vật: Hiller lỡ nói 7 rồi chữa ''nói nhầm'' (Map007/008); Succubus nói cần 7 thánh vật
    và phải đánh bại Hiller cùng Simelia (Map026 ev3p0); Good End A nhắc 7. Dịch ĐÚNG con số trong từng
    câu, không ''sửa'' cho thống nhất.'
  - 'Hiller: ''không có thánh quang che chở thì ở lâu với con ta cũng mất lý trí''; Simelia: ''giả sử
    \N[2] lừa em thì sao''; Eros: \N[2] vốn là người. Tất cả dồn về Map100. Giữ độ mơ hồ.'
