# MAU VAN PHONG do NGUOI DUNG chon / tu viet. Dua vao prompt dich gia + kiem dinh vien MOI game.
# dung: ban nguoi dung duyet/tu viet; kem_hon: cac ban nguoi dung KHONG chon (khong sai, nhung kem hon);
# tranh: dich chu nguoi dung che. Them muc moi moi khi nguoi dung sua cau.
- tinh_huong: Bà chủ quán quát cô hầu lười
  y: lại lười nữa đúng không, mau làm việc, không thì tối nay khỏi ăn
  dung: Lại làm biếng nữa rồi chớ gì? Làm lẹ lên, hông thôi tối nay nhịn đói nghe chưa!
  tranh:
  - Lẹ lẹ làm đi
  - Lẹ lên làm đi
  ly_do: 'dịch chữ theo trật tự 快點+động từ; người Việt nói động từ trước: ''làm lẹ lên'''
  nguon: người dùng chọn 01/11 (4 câu đầu)
- tinh_huong: Cô gái ngượng, nói tránh khi bị đụng chạm
  y: ch-chỗ đó… không được đụng đâu
  dung: Ch… chỗ đó… hổng được đâu mà…
  tranh: []
  ly_do: 'giọng miền Nam tự nhiên: hổng, mà'
  nguon: người dùng chọn 01/11 (4 câu đầu)
- tinh_huong: Cô gái đang làm tình với người yêu (văn H, không chửi)
  nguoi_lon: true
  y: cái đó của anh nóng quá, bắn hết vào trong em đi
  dung:
  - Gậy thịt của anh nóng quá… anh bắn hết vô trong em đi~
  - Gậy thịt của anh nóng quá… cho em hết đi~
  - Gậy thịt của anh nóng quá… ra hết trong em đi~
  tranh:
  - bắn hết vô trong lỗ nhỏ của em luôn đi mà~
  - nóng dữ thần
  ly_do: '''vào trong lỗ nhỏ của em'' là dịch chữ 射進我的小穴裡; người Việt nói ''vô trong em'', ''cho em'', ''ra trong em'''
  nguon: người dùng chọn 01/11 (4 câu đầu)
- tinh_huong: Tên côn đồ nói thô với cô gái
  nguoi_lon: true
  y: con điếm thối, cặc của ông mày có sướng không
  dung: Đồ đĩ thúi, bị tao chơi có sướng không hả?
  tranh: []
  ly_do: người dùng thích dịch thoáng, đổi cấu trúc cho ra câu chửi thật, giữ đúng độ thô
  nguon: người dùng chọn 01/11 (4 câu đầu)
- tinh_huong: Hai bạn gái thân cà khịa nhau (hài)
  y: cậu lại ăn vụng bánh của tớ đúng không, kem dính đầy mặt kìa
  dung: Cậu lại ăn vụng bánh của tớ nữa phải không? Mặt dính đầy kem kìa.
  kieu: sát ý
  kem_hon:
  - Lại ăn vụng bánh tui nữa chớ gì? Kem dính đầy mặt kìa bà!
  - Bà lại ăn vụng bánh của tui nữa hả? Kem dính tèm lem cả mặt kìa!
  nguon: trang chọn văn phong 02/11, câu 1
- tinh_huong: Hiệp sĩ thề với công chúa (trang trọng)
  y: thần thề bảo vệ người đến hơi thở cuối cùng
  dung: Dù cho thân thể này có tan xương nát thịt, thần cũng quyết không để ai chạm tới vạt áo của người.
  kieu: người dùng tự viết
  kem_hon:
  - Thần xin thề sẽ bảo vệ người đến hơi thở cuối cùng.
  - Thần thề, chừng nào còn thở thì thần còn bảo vệ người.
  - Dù có chết, thần cũng không để ai đụng tới người.
  nguon: trang chọn văn phong 02/11, câu 2
- tinh_huong: Phản diện đe dọa lạnh lùng
  y: ngươi nghĩ có thể trốn thoát sao, thật ngây thơ
  dung: Ngươi nghĩ có thể trốn thoát khỏi tay ta sao? Suy nghĩ viễn vông.
  kieu: người dùng tự viết
  kem_hon:
  - Ngươi nghĩ mình trốn thoát được sao? Thật ngây thơ.
  - Tưởng chạy được à? Ngây thơ quá.
  - Mày tưởng mày thoát được hả? Khờ quá đi.
  nguon: trang chọn văn phong 02/11, câu 3
- tinh_huong: Ông lão trong làng dặn cô gái lạ
  y: cô gái, trời tối rồi, đừng vào rừng một mình
  dung: Cô gái trẻ, trời tối rồi, đừng vào rừng một mình.
  kieu: sát ý
  kem_hon:
  - Nè cô hai, tối rồi, đừng có vô rừng một mình nghe.
  - Con gái, trời sụp tối rồi, đừng có đi vô rừng một mình nghen con.
  nguon: trang chọn văn phong 02/11, câu 4
- tinh_huong: Cô gái bực, nói thầm trong lòng (hài)
  y: tên khốn đó, lần sau gặp nhất định cho hắn một trận
  dung: (Tên khốn đó… lần sau gặp lại nhất định phải cho hắn một trận!)
  kieu: sát ý
  kem_hon:
  - (Thằng cha đó… gặp lại là biết tay tui!)
  - (Đồ khốn… để lần sau gặp coi, tui đập cho một trận!)
  nguon: trang chọn văn phong 02/11, câu 5
- tinh_huong: Rên khi đang làm tình (sướng)
  y: a… không được… sâu quá… em sắp ra rồi
  dung: A… hông được… sâu quá à… em… em ra mất…
  kieu: dịch thoáng
  kem_hon:
  - A… không được… sâu quá… em sắp… ra rồi…
  - Ư… đừng… sâu quá… em chịu hết nổi… ra rồi…
  nguoi_lon: true
  nguon: trang chọn văn phong 02/11, câu 6
- tinh_huong: Bị cưỡng ép, van xin (đau)
  y: dừng lại… xin anh… đau quá… đừng mà
  dung: Dừng lại… xin anh… đau quá… đừng mà…
  kieu: sát ý
  kem_hon:
  - Thôi… em xin anh… đau lắm… đừng mà…
  - Buông ra… làm ơn… đau quá trời… đừng mà…
