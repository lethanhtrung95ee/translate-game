# Mau "giong may dich" theo ngon ngu nguon (G-001), dung chung cho MOI game.
# Dong khop ca src (cau goc) lan vi (ban dich) -> canh bao W cho kiem dinh vien xac minh (khong tu sua).
# Them mau moi moi khi nguoi dung chi ra mot cau dich may (kem game + cau goc lam bang chung).
# lang: ma ngon ngu nguon (zh, ja, ko, en) ; src/vi: regex (Python) ; why: ly do ngan
- lang: zh
  src: "做為|作為|做为|作为"
  vi: "\\blàm (tiền|phần|quà|món|cái)?\\s*(thưởng|quà|lễ vật|bồi thường)"
  why: "bê 做為 thành 'làm …' (vd 'làm tiền thưởng thêm')"
  bang_chung: "cursed_armor_v2 Map012.json:ev29p2"
