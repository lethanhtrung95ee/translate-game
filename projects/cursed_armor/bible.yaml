# HO SO DICH - hay doc ky va sua truoc khi dich hang loat.
# Sai o day = sai ca game (xung ho, gioi tinh, ten).
# Xong thi doi `reviewed: false` thanh `reviewed: true`.
#
# characters[].names : moi cach ten xuat hien trong game (ke ca \N[1], ten trong 【】)
# characters[].faces : ten file mat nhan vat (RPG Maker) de nhan ra nguoi noi khi khong co ten
# characters[].self  : dai tu tu xung mac dinh; forbid: tu cam dung cho nhan vat nay
# relations          : A noi voi B -> self (A xung), call (A goi B)
# key_scenes         : nhom/canh quan trong -> dich bang model manh (xem config models.key_scene)
reviewed: true
source_lang: zh
style:
  genre: 'RPG fantasy người lớn (H-game RPG Maker, bản tiếng Trung phồn thể) – Cursed Armor / 詛咒鎧甲. Bối
    cảnh phương Tây giả tưởng: thành Anvil, thành Torres, Hội Mạo hiểm giả, Học viện Ma pháp, nô lệ, quái
    vật, lời nguyền.'
  tone: Dâm tục, phóng túng, có lúc hài hước phá vỡ bức tường thứ tư (Giọng Thần, Lang Thần, Giọng Giáo
    chủ nói về 'phần sau', 'người chơi'). Thoại ngắn, nhiều tiếng rên và dấu ～, ……
  notes: '1) GIỮ NGUYÊN mọi mã điều khiển: \N[n], \C[n], \V[n], \G, \W[n], \S, \{ \}, \! \| \^ \. và xuống
    dòng \n; không dịch, không thêm/bớt khoảng trắng bên trong mã. Dòng mở đầu kiểu ''\C[6]\N[1]\C[0]：''
    là nhãn tên người nói – giữ y nguyên các mã, đổi dấu ''：'' thành '':''. 2) \N[59] là ĐẠI TỪ TỰ XƯNG
    của nô lệ (tên DB 賤奴 → ''tiện nô''); câu chứa \N[59] phải viết sao cho thay ''tiện nô'' vào vẫn đúng
    ngữ pháp (vd: ''\N[59] không hề muốn...'', ''tử cung của \N[59]''). 3) \N[61] = tên nô lệ/nghệ danh
    của Lilina ở Torres (DB 黑泰迪 → ''Teddy Đen''), \N[62] = 金絲雀 ''Chim Hoàng Yến'', \N[60] = 奈斯特拉 ''Nestra''
    (nữ anh hùng mạo hiểm nổi tiếng nhất đại lục) – suy ra từ thứ tự DB, CẦN XÁC NHẬN. 4) Đổi ～ thành
    ~ (ASCII), giữ …… như bản gốc; tiếng rên: 啊→a/á, 嗯→ưm, 唔→ư/ưm, 嗚→hu/ư, 哈→ha, 嘖→chụt, 咕嚕→ực, 咳→khụ.
    5) Văn trần thuật ([?]) dùng ngôi thứ ba, gọi Lilina là ''cô'' / ''nàng'' thống nhất là ''cô''. 6)
    Hệ thống/UI: câu hỏi Có/Không ngắn gọn, ví dụ ''是否需要跳過重復H？'' → ''Bỏ qua cảnh H đã xem?''. 7) Từ ngữ
    tình dục: dịch thẳng, tự nhiên kiểu H-game Việt (dương vật/cặc tùy giọng nhân vật: người thô lỗ dùng
    từ thô, Lilina lúc tỉnh táo dùng từ nhẹ hơn), không kiểm duyệt nhưng không thêm thắt. 8) Mọi nhân
    vật trong cảnh tình dục là người trưởng thành; các từ 少女/小女孩 dịch là ''cô gái''/''cô nhóc'' (giọng
    điệu), không ám chỉ trẻ vị thành niên. 9) Tên người phương Tây: phiên âm Latin; tên gốc Hán (龍吟, 白雪):
    dùng Hán-Việt.'
characters:
- id: lilina
  names:
  - 莉莉娜
  - \N[1]
  - \C[6]\N[1]\C[0]
  name_vi: Lilina
  gender: nữ
  age: thiếu phụ trẻ (đã kết hôn)
  role: Nhân vật chính; nữ pháp sư, mạo hiểm giả mạnh nhất Hội, danh hiệu 'Thợ Săn Thiên Thần', vợ hội
    trưởng Owen; bị bộ giáp nguyền rủa ký sinh, dần sa đọa
  personality: Ban đầu nghiêm túc, có chí làm 'mạo hiểm gia vĩ đại', sợ ma; bị lời nguyền và thôi miên
    làm dâm đãng, thay đổi giữa xấu hổ/chống cự và ham muốn; tinh nghịch với Succubus
  speech_style: 'Tự nhiên, nữ tính; lúc chống cự: ngắt quãng, kêu ''không cần đâu''; lúc sa đọa: nũng
    nịu, kéo dài ～. Độc thoại trong ngoặc （）. Khi ở thân phận nô lệ dùng \N[59] tự xưng và gọi ''chủ nhân'''
  self: tôi
  forbid:
  - tao
  note: 'Với chị Simeria: ''em''; với chồng Owen: ''em''; với ''anh lính đánh thuê'' trong cảnh: ''em''/''người
    ta'' (人家). Khi là nô lệ: \N[59] (tiện nô). Bản thân Lilina cũng có thể bị gọi bằng \N[61]. Lời dẫn
    gọi Lilina là ''cô''. CẦN XÁC NHẬN: sau khi biết Owen lợi dụng mình, Lilina có đổi sang ''tôi – anh/ông''
    với Owen không.'
