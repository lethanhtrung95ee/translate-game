# HO SO DICH - hay doc ky va sua truoc khi dich hang loat.
# Sai o day = sai ca game (xung ho, gioi tinh, ten).
# Xong thi doi `reviewed: false` thanh `reviewed: true`.
#
# characters[].names : moi cach ten xuat hien trong game (ke ca \N[1], ten trong 【】)
# characters[].faces : ten file mat nhan vat (RPG Maker) de nhan ra nguoi noi khi khong co ten
# characters[].self  : dai tu tu xung mac dinh; forbid: tu cam dung cho nhan vat nay
# relations          : A noi voi B -> self (A xung), call (A goi B)
# key_scenes         : nhom/canh quan trong -> dich bang model manh (xem config models.key_scene)
# work               : boi canh, premise (gui kem moi lo dich), cot truyen, chu de, chi tiet cai cam
# style.strategy     : muc Han-Viet, cach xu ly choi chu / tho / ten
# handbook           : cau dua, choi chu, tho, ke, than chu va cach dich thong nhat
# can_xac_nhan       : diem chua chac -> nguoi dung tra loi, sua o day
reviewed: true
note: tự rà bởi Claude 31/10/2026 (đối chiếu Actors.json, HUONG_DAN mục 6), người dùng chưa duyệt; can_xac_nhan còn mở.
source_lang: zh
work:
  background: 'Cursed Armor (詛咒鎧甲) là game của tác giả wolfzq (itch.io: wolfzq.itch.io/cursedarmor; có
    Patreon). Game làm bằng RPG Maker MV, dùng plugin riêng Z_Wolfzq_Text.js. Trên Steam là app 907090,
    phát hành khoảng 14/11/2018 qua dòng Mango Party, nhãn Adult Only. Bản tiếng Anh chính thức có giao
    diện và phụ đề, không lồng tiếng; tên nữ chính chính thức là Lilina. Game có hai DLC ''Flesh sheath'',
    ''IF Aisha'' và phần tiếp Cursed Armor II (True End tuyến Ma trùng kết bằng dòng quảng cáo ''Cursed
    Armor II – Vương thành Đế quốc''). Thể loại: sandbox sa đọa phi tuyến, hơn 200 sự kiện, chơi trên
    20 giờ, nhiều tuyến và nhiều kết loại trừ nhau, có hệ thống thay trang phục (đổi sprite và hoạt ảnh)
    cùng các chỉ số Dâm năng, Phục tùng, Trung thành. Script viết bằng chữ Trung phồn thể, còn sót dấu
    vết chuyển từ giản thể (么, 圣, 杰, 后, 仆…) và có nhiều lỗi gõ. Phần lớn cảnh có hai biến thể thoại: Lilina
    còn trong trắng/đang kháng cự, và Lilina đã sa đọa. Tác giả hay chen lời meta: Thần chi âm (\N[50]),
    Lang Thần (狼神, hiện thân tự giễu của wolfzq, ''con sói lười''), quảng cáo Patreon, ''các quý ông''
    (紳士 = người chơi), câu ''Cursed Armor còn ra phần tiếp à?''. Game nhại nhiều nguồn: meme mạng Trung
    Quốc (Đại thoại Tây du, ''高，實在是高'' trong phim Địa đạo chiến, ''骯臟的PY交易'', ''藥不能停'', ''泰迪''), Skyrim/Elder
    Scrolls (đầu gối trúng tên, Skooma), Fate (Tamamo, Nero, Jeanne Alter), Re:Zero (Ram/Rem), SAO, Date
    A Live, Taimanin… Ý đồ tác giả: để người chơi tự chọn giữa giữ ước mơ và sa ngã. Hài và bi xen nhau.
    Mỗi tuyến là một ''vở kịch'' thao túng có người giật dây (Owen, Jude, Ross/Berika, Lang Thần), và
    nhiều cú lật đến từ chính những người Lilina tin.'
  premise: 'JRPG người lớn của wolfzq. Lilina, pháp sư hệ Hỏa ngây thơ, mơ thành mạo hiểm giả vĩ đại.
    Cô bị ép đội Vương miện Nguyền Rủa của Dâm Ma Vương Eros, trong giáp có Succubus trú ngụ, vừa giúp
    vừa xúi cô sa ngã. Muốn cởi giáp, cô phải tìm sáu thánh vật qua hàng chục tuyến rẽ nhánh: Hội mạo
    hiểm, nhà ngục, học viện, thành nô lệ Torres, trường đua kỳ lân, hang trùng. Cái hay: mỗi cảnh có
    hai giọng (trong trắng/sa đọa); độc thoại trong ngoặc tỉnh táo, cà khịa, trái hẳn lời phục tùng ngoài
    miệng; hài tự vả, meta; và những cú phản bội từ chính người cô tin.'
  synopsis: 'KHUNG CHUNG (phi tuyến, nhiều nhánh loại trừ nhau): 1500 năm sau khi Ma Vương bị phong ấn,
    Lilina, cô gái lớn lên ở cô nhi viện, cựu học viên đặc đẳng hệ Hỏa và còn trinh, đến thành Anvil.
    Trước tượng nữ anh hùng \N[60], một Giọng nói bí ẩn dụ cô ra khu mộ, và tay cô tự đội Vương miện Nguyền
    Rủa lên đầu. Cha xứ Hiller (\N[2], người nuôi cô) cứu cô khỏi một zombie. Ông xác định đây là lời
    nguyền của Dâm Ma Vương Eros, tìm được sách 《Nhẫn Dâm Ma》 kể về cô gái Kyle từng giải lời nguyền bằng
    thánh vật, rồi lần lượt đưa manh mối về sáu thánh vật; có lần ông lỡ nói ''7'' rồi chữa là ''nói nhầm''.
    Bộ giáp hiện hình thành Succubus (\N[4]), dạy Lilina về dâm năng: thiếu dâm năng thì giáp tan và cô
    bị dục vọng hành hạ. Giáp tiến hóa từ vương miện → gông → vòng cổ → giáp toàn thân qua nghi thức gia
    miện. Succubus muốn đưa Lilina lên ngôi Nữ vương Dâm ma. Sáu thánh vật: Kết tinh Thủy Thần (khế ước
    7 ngày với ba chị em Xà nữ), Quả Vàng (Thần Thụ Nghìn năm), Quyền trượng Tử vong (vua vong linh Galon
    giữ hồn vợ là Sophia), Sừng gãy Thần Ngưu (Succubus đem 1/7 linh hồn Lilina ban sự sống cho Hộ vệ
    Đại Địa), Hoa Băng Tinh (Thủy tinh linh chiếm xác Băng tinh linh), Bảo châu Liệt Diễm (Hỏa tinh linh
    nhập xác Lilina để làm vợ quỷ ăn thịt người Bù-rù). Sau mỗi khế ước Lilina lại mất trí nhớ, và cô
    tưởng là do bộ giáp.

    TUYẾN HỘI / ANVIL: Hội trưởng Owen (\N[12]) đòi 5000G hoặc ''trả bằng thân thể''. Lilina gặp Meili
    (\N[5]) và đầy tớ Roger, nhà nghiên cứu Melissa (\N[9]), học giả slime, cô bán hoa với ''mật mã hoa'',
    ông chủ nhà tắm, Anh hùng Hentai ZERO. Vụ hiếp dâm hàng loạt: chỉ huy Loki (\N[69]) dùng Lilina làm
    mồi, cùng đại sư thôi miên Long Ngâm (\N[7]) cài ám thị. Thủ phạm thật là phó quan Berika (\N[8]),
    vật chủ của Ma Nhãn; cô ta khắc Lạc ấn linh hồn và chuỗi ám thị lên Lilina, rồi bị bắt. Long Ngâm
    ăn năn, tỏ tình, hai người thành đôi. Lính gác bị ám sát và Hội bị vu là thủ phạm. Lilina làm nội
    gián hai mang giữa Owen và Cospiro (\N[13], thực ra là thủ lĩnh Đoàn lính đánh thuê). Cospiro khống
    chế cô bằng độc (5 ngày phải uống thuốc giải đặc chế một lần) và dần thật lòng với cô. Owen cầu hôn,
    dàn xếp cho cô thắng danh hiệu Thiên Sứ Săn, hy sinh bạn thân Reno. Ở Map133 Owen lộ là kẻ viết ''kịch
    bản'': kẻ chết thay, tai mắt trong đoàn, danh hiệu, lời cầu hôn đều được dựng. Lilina phải nhận vai
    ''nữ vương'' của Succubus để thoát phục kích, rồi đổi sự phục tùng lấy mạng Cospiro. Kết: người của
    Owen chính là kẻ xúi vụ ám sát; hắn nắm thuốc giải, Lilina phải xưng ''đại nhân''. Có đám cưới ở Đại
    giáo đường Thánh đô. Ở nhánh ''Kết thúc vở kịch này'' (Map135), Owen thành thủ lĩnh đoàn lính đánh
    thuê và biến cô thành nô lệ tình dục của cả đoàn.

    TUYẾN TORRES (Map137–158): ở Torres, ''thiên đường của đàn ông, địa ngục của đàn bà'', đàn bà chỉ
    được vào thành với thân phận nô lệ. Theo ủy thác của Jude (\N[17]), Lilina giả làm nô lệ để cứu Tam
    công chúa Sanga (\N[18], Công chúa Ngân Nguyệt). Cô bị điều giáo sư khống chế và đem đấu giá. Chloria
    (\N[15]), nữ nô sủng ái nhất của Thành chủ Jon (\N[14]), lừa cô ký khế ước nô lệ vĩnh viễn. Cô phải
    tự xưng \N[59] (Tiện nô), được ban tên chó \N[61] (Teddy Đen), đóng vai chó cùng Trosi (\N[16]). Rồi
    chính cô được giao điều giáo công chúa, và Succubus khơi máu S của cô. Các tuyến phụ: đấu trường,
    kỹ viện (cô giáo cũ Shuria), quán rượu Diễm Vũ, Skooma, cuộc thi Vũ hậu, tiệm Ngôi Nhà Tình Yêu (thí
    nghiệm Futa). Jude bày kế giả bắt cóc chị em Chloria qua tay Resk (\N[19]), dồn Lilina vào thế phải
    đầu độc Thành chủ. Map158 ev8p5: tùy độ Trung thành mà cô giết hoặc cứu Thành chủ. Map153: cô bị chém
    đầu, Succubus hồi sinh cô và xóa ký ức cả đảo; lần đầu cô hứa ''cân nhắc'' việc làm nữ vương. Cú lật
    Map154: Jude là đệ nhất mưu sĩ Đế quốc chơi hai mặt; ''？？？'' là em trai, cũng là ''cái bóng'' của
    Thành chủ, đã cướp Xiềng xích nô lệ để thành Thành chủ mới; Jude thành chủ mới của Chloria và Trosi.
    Nhánh khác: Jude đeo vòng cổ chém đầu và bán cô sang Torres (Map014 ev11p0); về sau cô là Thiên Sứ
    Săn bề ngoài anh hùng nhưng lén tuyển nô lệ, và quản gia Sax (\N[21]) dùng dinh thự ở cảng làm cơ
    sở.

    TUYẾN NHÀ NGỤC ĐẾ QUỐC: giám ngục trưởng Darren (\N[35]), phiếu lao động, mỏ quặng, nông trại, trùm
    phòng giam, quan vật tư Bill. Ông lão tù Robert (\N[40]) là cha của Lucia (\N[10]), từng bị Melissa
    hủy hoại gia đình, và giữ bí mật về ma thạch Abaddon. Lilina vượt ngục bằng túi khí, hoặc ở lại làm
    nô lệ.

    TUYẾN HỌC VIỆN MA PHÁP: ''thường thức'' của học viện bị bẻ cong thành ''học ma pháp bằng tình dục'',
    mỗi hệ một ám thị. Ross (\N[25], thầy hướng dẫn, tay chân của ''bà ta'' Berika) và con trai Roster
    (\N[26]) dùng chuông thôi miên và thủy tinh hút dâm năng. Berika giả làm quyền hiệu trưởng, phong
    ấn Succubus; Long Ngâm bị xóa ký ức. Map041–047: Lilina đập vỡ thủy tinh; hoặc thành búp bê sống,
    bị ép giết Long Ngâm, nhận đồng hồ quả quýt ''di vật''; hoặc Ross thành hiệu trưởng. Map159–165 (cấm
    chú Búp bê sống): ở nhánh tốt, tình yêu với Long Ngâm phá cấm chú, Lilina giết Ross, Succubus thú
    nhận không muốn phục sinh Dâm Ma Vương, Lilina quyết làm Nữ vương Dâm ma và thề thanh toán với \N[8].
    Các bad end: Mẹ của dâm ma, u linh, Bad End B (20 năm sau Dâm Ma Vương phục sinh).

    TUYẾN MA TRÙNG / ABADDON: Melissa và Lucia (Phong Kiếm Thánh, nay là Nữ vương Abaddon), ma thạch,
    đá phong ấn ở Làng Đảo Nhỏ. Ở hang Ký sinh trùng, Lilina gặp Aisha (\N[23]), cựu nữ mạo hiểm giả số
    một nay là ''vợ trùng''; cô sinh Trùng Vương của riêng mình (con này đọc to suy nghĩ của cô), nhường
    ngôi cho Aisha và nhận dây chuyền. Làng có tượng ma thần (Map168–184): anh em dân làng bỏ thuốc mê,
    quán trọ trả bằng thân thể, bọn cướp (Map173), gia sư cho cha con Dale và Seth (Map174). Vương trùng
    ký sinh, Lilina hóa nữ yêu Abaddon, mất dần nhân tính; Luna (\N[41]) xin làm ''con'' cô, và ở Bad
    End A sử sách chỉ ghi tên Luna. True End (Map026 ev4p2): Succubus đồng hóa ấu trùng Vương trùng và
    có quyền điều khiển thân thể Lilina. Map189–190 (Troops): Lang Thần (\N[56]), vị thần giật dây các
    dòng thế giới, bị Lilina ''giết thần'' đánh bại; Lang Thần xóa ký ức cô (''chắc lại say rồi''); hậu
    truyện là Succubus mượn thân điều giáo Lang Thần thành nô lệ Habi. Map184: kết ''Hoàng Yến trong lồng'',
    hoặc Lilina bỏ đám cưới với James (\N[47]); tuyến James có ''Thử thách cô dâu'' cùng Ram/Rem.

    TUYẾN TRƯỜNG ĐUA KỲ LÂN: Lilina mắc nợ Fitch (\N[65]), bị cho uống ''thánh thủy'' nên Succubus bị
    phong ấn. Kỳ Lân Vương (người tình của Fitch) muốn cô sinh con cho tộc kỳ lân; Bạch Tuyết (\N[67])
    bị ép làm tay trong. Có hôn lễ thần thánh với \N[11] và Kỳ Lân End.

    TUYẾN DI TÍCH (cao trào, Map100): Hiller thực ra là Đệ nhất Ma tướng (Hắc Dực, vốn là người, bị xóa
    ký ức), Simelia (\N[3]) theo phe ông, Succubus phản cả hai. Các kết: Good End A (Hiller tự phong ấn,
    Simelia ôm ông biến mất, nhại Đại thoại Tây du), Bad End A (Eros hút Lilina, Map079), Normal End (Succubus
    chiếm thân), Good End B (10 năm trong mật thất của Hội).'
  themes:
  - 'Sa ngã hay giữ ước mơ: cùng một cảnh có hai giọng trong trắng và sa đọa'
  - 'Ý chí bị thao túng: ám thị, ''thường thức'' bị bẻ cong, khế ước 1/7 linh hồn, thuốc giải, Skooma,
    vòng cổ nô lệ'
  - 'Thao túng như sân khấu: ''kịch bản'' của Owen, Jude, Lang Thần/tác giả, và nhân vật chống lại kịch
    bản'
  - 'Ngôn ngữ làm công cụ tẩy não: xưng hô (\N[59], ''chủ nhân''), chữ ''thường thức'', câu niệm'
  - 'Lời ngoài miệng và lòng thật: độc thoại trong （） là phao cứu bản ngã'
  - 'Gia đình và phản bội: Cha xứ, Simelia, Owen, Jude'
  - 'Mỉa mai danh hiệu: Thiên Sứ Săn, phu nhân hội trưởng, thánh nữ khoác lên thân phận nô lệ'
  - 'Quyền lực đảo vai: nô lệ thành chủ, công chúa bắt ''chủ nhân'' chịu trách nhiệm, thần thành nô lệ'
  - 'Tình yêu bị tước đoạt: Long Ngâm, Hỏa tinh linh với Bù-rù, Galon với Sophia'
  - 'Cái giá của sức mạnh: con số 7, 1/7 linh hồn'
  - Hài tự giễu, meta, phá tường thứ tư làm đối trọng cho bi kịch
  arcs: '1) Lilina: hồn nhiên (''một mạo hiểm giả vĩ đại sắp ra đời～'') → bị nguyền → giằng co giữa tự
    trách (''Mình đang nghĩ cái gì thế này!'') và buông thả. Mỗi tuyến cô sa ngã một kiểu (nô lệ, phu
    nhân giả, búp bê, vợ trùng, vợ thú, nữ yêu, nữ vương), ở nhánh thiện vẫn bám ước mơ; dần đi tới vị
    trí ''nữ vương''. 2) Lilina–Succubus: từ kẻ ký sinh trục lợi, đòi giá bằng dâm năng, thành người bảo
    hộ mập mờ (ghen, dỗi; sợ Lilina thành công cụ của Dâm Ma Vương như \N[60]; quá khứ là người tên Cecilia),
    thú nhận không muốn Dâm Ma Vương phục sinh. 3) Lilina–Hiller/Simelia: tình cha con, chị em ấm áp,
    nghi ngờ được gieo dần rồi vỡ ở Map100; nghẹn ở câu ''các con đều là người nhà yêu quý nhất''. 4)
    Lilina–Long Ngâm: ngượng ngùng → tỏ tình → ''anh yêu'' → bị xóa ký ức / chết dưới tay cô / là ước
    nguyện cuối cùng phá cấm chú búp bê. 5) Lilina–Owen: từ gã dê xồm thành chỗ dựa, người cầu hôn, rồi
    lộ là tác giả ''kịch bản''. Cospiro: kẻ khống chế mà thật lòng. 6) Torres: kháng cự → phục tùng giả
    → ranh giới giữa diễn và thật mòn đi (''\N[59] là một con chó cái x N'') → máu S khi làm chủ của Sanga
    → giết hay cứu Thành chủ. 7) Lilina–Aisha: từ chửi ''lợn nái!'' đến nhường ngôi. 8) Ma trùng/Lang
    Thần: mất nhân tính nhẹ tênh mà rợn, chống lại ''kịch bản'', thắng thần, bị xóa ký ức; hậu truyện
    buồn: ''chân ái là thứ mình không bao giờ có được ở nhân gian''. 9) Các mạch phụ cảm động: Robert,
    Hỏa tinh linh–Bù-rù, Galon–Sophia, Bạch Tuyết, Sanga.'
  foreshadowing:
  - '6 hay 7 thánh vật: Hiller lỡ nói 7 rồi chữa ''nói nhầm'' (Map007/008); Succubus nói cần 7 thánh vật
    và phải đánh bại Hiller cùng Simelia (Map026 ev3p0); Good End A nhắc 7. Dịch ĐÚNG con số trong từng
    câu, không ''sửa'' cho thống nhất.'
  - 'Hiller: ''không có thánh quang che chở thì ở lâu với con ta cũng mất lý trí''; Simelia: ''giả sử
    \N[2] lừa em thì sao''; Eros: \N[2] vốn là người. Tất cả dồn về Map100. Giữ độ mơ hồ.'
  - Succubus định cài ám thị 'không muốn lập đội'; về sau Lilina nói 'không hiểu sao cứ thấy nhiệm vụ
    này phải tự làm'. Hai câu phải khớp chữ.
  - 'Succubus từng là người; tên thật 西西莉婭 (Cecilia, tạm) lộ ở Map070. Lilina buột ''西……'' ở trường đua,
    và gọi ''西西'' lúc bị khơi máu S: để cụt đúng như gốc.'
  - Lilina mất trí nhớ và đổ cho giáp, thật ra là do các khế ước 1/7 linh hồn. Không lộ trước.
  - 'Berika: Lilina chỉ hé ''Be… Beri…'', ''đêm nào cũng bị \N[8] điều giáo''. Ở tuyến học viện Ross chỉ
    gọi ''bà ta'', ''bà ta không phải hiệu trưởng''. Không lộ danh tính sớm.'
  - Long Ngâm giữ ám thị 'Cởi đồ thì tỉnh' vì 'chắc chắn sẽ có ích'; anh nói 'đã làm sai một lần' trong
    khi Lilina khen anh không bao giờ lạm dụng năng lực. Trong mắt anh thỉnh thoảng có ánh thủy tinh.
  - Ross nhắc \N[26] 'luôn nghe lời cha'; Roster gọi Ross là \N[51] trước mặt người khác. Ross suýt lỡ
    miệng về khiếm khuyết của búp bê sống, về sau chính là 'ước nguyện khó dứt' với Long Ngâm.
  - 'Galon: 1000 năm trước, người đàn bà đeo Nhẫn Dâm Ma lấy quyền trượng, Kyle trả lại. Số năm ở Galon
    không khớp nhau: giữ đúng nguyên văn.'
  - 'Ma thạch: Robert giấu ở khe đá gần hang nhỏ bãi biển phía tây cảng Anvil; pháp sư ở Bad End B nói
    ''ma thạch vẫn trong tay ta''; Succubus lén trả cho Lilina ''thứ gì đó'' ở đá phong ấn, không nói
    rõ là gì.'
  - 'Melissa: ''trước khi cô hoàn hảo, ta sẽ không ra tay''.'
  - 'Cospiro: ''có lý do bắt buộc phải lên trung cấp nhưng không thể nói''; ''tỉnh dậy chỉ còn quần lót,
    áo trả lại dính máu''. Câu ''tai mắt ngươi cài trong đoàn lính không phải \N[1]…'' bị cắt bằng \!.
    Hắn gọi Lilina ''thiên thần may mắn'' trong nhật ký, vọng lại ''thiên thần của tôi''.'
  - 'Owen: chiếc nhẫn ''làm tín vật'' (Map121); ''cô đánh ngất lính gác gọn lắm'', thời điểm ''quá trùng
    hợp''. Succubus: ''Có lẽ \N[12] hoàn toàn không như cô thấy'' (Map133). Tên đào ngũ bị ngắt ở ''chuyện
    ngươi và \N[1] đính…''. Đám cưới: ''Chỉ tiếc một điều là… chẳng còn kẻ thù nào nữa!''. Giọng chân
    thành ở cảnh cầu hôn phải giữ.'
  - 'Torres: Thành chủ ''như biến thành người khác''; câu hỏi thần khí ''có phải bẩm sinh''. Tất cả dẫn
    tới ''cái bóng'' ở Map154 ev2p6. Trước đó giữ nhãn ''？？？'', không đặt tên. Ở Map146 ev21 Jude phải
    trông như đồng minh tốt; câu buột ''tôi nhất định sẽ biến cô thành……'' (chữ nhỏ) để lấp lửng.'
  - Thần lực trong tinh dịch Thành chủ nuốt sức Succubus và biến đổi tử cung Lilina; Succubus muốn hỏi
    Hắc Ma Nữ \N[9]. Sanga có 'năng lực khác thường' và nhắn Lilina tới Đế quốc tìm mình. \N[60] từng
    tới Torres và thành công cụ của Dâm Ma Vương.
  - 'Dây chuyền của Aisha là ''món cuối cùng chứng minh cô còn là người''; Owen: ''cô ấy cuối cùng đã
    từ bỏ thân phận con người''.'
  - 'Kỳ Lân Vương: sức Dâm Ma Vương cho Lilina tuổi thọ ngang kỳ lân; Lilina tự nói ''kẻ bất tử như ta''.
    ce88: ''Em hay nó, cuối cùng chỉ được chọn một''.'
  - 'ce148 (thầy Thổ ''rất hứng thú với con của cô''), ce20 (''sữa để dành cho một vị đại nhân nào đó''),
    ce10 (''chìa khóa dự phòng có lẽ bị cô gái kia lấy trộm''): giữ mơ hồ.'
  - 'Thủy tinh linh: ''ta nghĩ hoa này không phải thứ cô thật sự cần''.'
  - 'Map169 ev4p0: ''sau lưng có thứ gì đó'' (bị ký sinh). Luna thì thầm ''thế này lại càng hợp ý tôi''.
    Lilina-nữ yêu không sợ lửa vì là Ma nữ Lửa.'
  - 'Mô-típ say: ''hôm đó say quá'' (Map185) và ''chắc lại say rồi'' (Map190, sau khi bị xóa ký ức) phải
    cùng một cụm từ.'
  - '''Kịch bản'' của Owen vọng lại ở Lang Thần (Troops tr51p1). Dùng cùng chữ ''kịch bản'', ''vở kịch''.'
  - 'Succubus dặn dạy con của Lang Thần ''làm thần, đừng giống mẹ nó''. Map184: ''Xin lỗi \N[47], cuối
    cùng em cũng đã lừa anh''. Map165: em út ba anh em giáo vụ ''đi xa kiếm tiền''. Map168: dân làng cố
    ý để lại dấu vết.'
  - 'ce169: bảng kết cục là text hệ thống; giữ đủ thông tin điều kiện.'
style:
  genre: JRPG người lớn (eroge, Adult Only), dark fantasy phương Tây, sandbox sa đọa nhiều nhánh, nhiều
    kết (Good/Bad/Normal/True End, Hậu truyện), có thay trang phục và các chỉ số
  tone: 'Dâm tục thẳng thắn, cưỡng ép, nhưng nhiều tiếng cười: Lilina tự vả và cà khịa trong đầu, Succubus
    đỏng đảnh, ác nhân ngọt (Chloria), phản diện lố (Ross, Hentai ZERO), giọng ban ơn (Thành chủ), giọng
    giảng đường vô lý (thầy cô học viện), meta phá tường thứ tư (Thần chi âm, Lang Thần). Xen giữa là
    những đoạn bi kịch thật (Học viện, Di tích, Hỏa tinh linh, Galon, Torres, hậu truyện Lang Thần) cần
    giọng trầm, không đùa thêm, không làm nhẹ đi. Thế giới và tên người theo kiểu phương Tây; văn gốc
    là tiếng Trung khẩu ngữ mạng.'
  notes: '1) MÃ ĐIỀU KHIỂN: giữ nguyên tuyệt đối \N[n] \C[n] \W[n] \V[n] \G \{ \} \. \| \^ \!, kể cả mã
    lỗi gốc (''\C[2]\N[12]'', ''\C[3]\C[18]\C[0]'', ký tự \u001e). Riêng dấu ''\'' lạc đứng trước chữ Hán (''\安維爾'',
    ''\千年樹精C'') thì BỎ dấu ''\'' khi dịch: MV không hiển thị nó, còn ''\'' đặt trước chữ Latin sẽ nuốt chữ (''\Chìa''). Kiểm
    định viên không bắt lỗi việc bỏ dấu này. \. và \^ đặt giữa từng âm để ngắt nhịp: giữ đúng số lượng, phân bố theo âm tiết tiếng
    Việt.

    2) TÊN ĐỘNG \N[n] là tên Actor, được dịch một lần trong Actors.json. Có actor là danh từ chung: \N[50]=Thần
    chi âm, \N[51]=Thầy, \N[52]=Học viên, \N[53]=Lính gác, \N[54]=Tù nhân, \N[55]=Dân làng, \N[59]=Tiện
    nô. Tiếng Việt đặt định ngữ SAU danh từ nên phải đảo vị trí mã: ''帝國\N[53]'' → ''\N[53] Đế quốc'',
    ''\N[53]們'' → ''đám \N[53]'', ''\N[64]妹妹'' → ''em \N[64]'', ''\N[13]大人'' → ''\N[13] đại nhân''. Câu
    chứa \N[1] phải đọc được cả khi \N[1] bị đổi thành danh hiệu (tuyến nhà ngục). Câu chứa \N[59] phải
    đọc trôi khi biến hiện thành ''Tiện nô'' ở mọi vị trí (chủ ngữ, tân ngữ, ''…của \N[59]'').

    3) DẤU: ''～'' của gốc viết thành ''~'' đúng vị trí (font không có ～, hệ thống tự đổi; chữ ký giọng của Lilina, Succubus, Chloria, Trosi); ''……''; ngoặc () cho
    độc thoại; 【】, 「」 nếu có. Chữ kéo dài từng âm (''Long~Ngâm~'') thì đặt ~ sau mỗi tiếng.

    4) ĐỘC THOẠI （） là lòng thật của Lilina: giọng tự nhiên, sắc, hay chửi thầm, tương phản rõ với câu
    ngoài miệng.

    5) HAI BIẾN THỂ: cùng một cảnh có câu trong trắng và câu sa đọa thay nhau. Dịch song song, cùng cấu
    trúc.

    6) ĐỘ TUỔI: mọi nhân vật trong cảnh tình dục được trình bày là người trưởng thành. 少女 → ''cô gái/thiếu
    nữ''; không dùng ''bé gái, em bé, nhóc'' trong cảnh tình dục; không thêm chi tiết gợi tuổi nhỏ. 學生/學院
    → ''học viên''. Nếu gặp cảnh có dấu hiệu nhân vật vị thành niên (xem can_xac_nhan: Map186 少年, Seth)
    thì DỪNG, không dịch phần tình dục, báo chủ dự án.

    7) THANG TỪ TỤC (thống nhất, không nhẹ hơn, không tục hơn gốc): 肏 → ''đụ''; 干/做 → ''làm/chơi''; 肉棒
    → ''cây gậy thịt'' (Lilina e thẹn thì ''cái ấy''); 雞巴 → ''con cặc''; 淫穴 → ''lỗ dâm''; 小穴 → ''khe thịt/lỗ
    nhỏ'' (KHÔNG ''cô bé''); 屁眼/菊穴 → ''lỗ đít/hoa cúc''; 精液 → ''tinh dịch/tinh''; 高潮 → ''lên đỉnh''; 丟了/要丟了
    → ''ra… ra mất rồi''/''sắp ra rồi''; 母狗 → ''chó cái''; 母豬 → ''lợn nái''; 騷貨 → ''đồ dâm đãng''; 婊子
    → ''con điếm''; 蕩婦 → ''con đĩ''; 癡女 → ''si nữ''; 調教 → ''điều giáo''.

    8) Tiếng rên, tượng thanh: Việt hóa (''A～'', ''Ưm～'', ''Hự''), độ dài tương đương. Lời bị bịt viết
    tắt bằng chữ Latin (Y/Z/D/S…) thì đổi sang lối đứt chữ tiếng Việt.

    9) Câu kích hoạt ám thị, tên ám thị, câu ''thường thức'', câu niệm nô lệ: giống từng chữ ở mọi chỗ.
    Thuật ngữ UI (chỉ số, trạng thái, vật phẩm) khớp từng chữ với thoại có nhắc tới. Cảnh lặp và lựa chọn
    lặp dịch y hệt.

    10) Không lộ trước bí mật: Hiller là Ma tướng, Berika là thủ phạm, Owen chủ mưu, Cospiro là lính đánh
    thuê, tên thật Succubus, Long Ngâm chết, ''？？？'' là cái bóng của Thành chủ, Jude hai mặt, ý đồ của
    Luna.

    11) Lỗi gõ trong gốc thì dịch theo nghĩa đúng: 期約→契約, 不馬→不是馬, 別看玩笑→別開玩笑, 把持住→沒把持住, 繞/求繞→饒, 差不過→差不多,
    難倒→難道, 無亂→無論, 踐習→實踐, 堵住→賭注, 亦然→依然, 試者→試著, 正視→正式, 識實物→識時務, 好想→好像, 會去→回去, 不削→不屑, 我先在→我現在, 在來→再來, 遍離開→便離開,
    大副→大幅, 窮北→窮唄, 處于→出于, 再司機→再伺機. ''Nromal End'' → ''Normal End'' (chờ duyệt).

    12) Meta và quảng cáo (Thần chi âm, Patreon, Tamamo, ''phần sau sẽ làm'', ''các quý ông'') dịch đủ,
    giữ giọng tác giả. ''(未完成)'' → ''(Chưa hoàn thành)''.

    13) Nhãn người nói có thể bị gán nhầm (xem can_xac_nhan): dịch theo ngữ cảnh, không sửa nhãn trong
    dữ liệu.'
  strategy:
    han_viet: 'Mức VỪA PHẢI. Thoại đời thường, cà khịa, chửi bới và cảnh H dùng tiếng Việt khẩu ngữ, thuần
      Việt, gần lối nói người trẻ. Hán-Việt dành cho tên thánh vật, chiêu thức, danh hiệu, chức vị, thuật
      ngữ huyền huyễn (Kết tinh Thủy Thần, Bảo châu Liệt Diễm, Đại Địa Chi Nộ, Ma Nhãn, Lạc ấn linh hồn,
      Dâm Ma Vương, Phong Kiếm Thánh, Hắc Dực, Thành chủ, thần lực, cấm chú, kết giới, dị chủng, thường
      thức, điều giáo). Xưng hô Hán-Việt chỉ dùng cho nhân vật được chỉ định, để tạo giọng hoặc nhại:
      Eros (吾/汝 → ''bổn vương/ta – ngươi/nàng/ái phi''), Thành chủ Jon (''bổn vương''), Sax (''lão phu''),
      lính đánh thuê (''bổn đại gia''), tên lính đánh thuê sến kiểu kiếm hiệp, Hentai ZERO hô chiêu. Không
      dùng ''tại hạ'', ''nô gia'', ''bổn cô nương'' cho Lilina hay nô lệ. Thành ngữ Hán đổi sang thành
      ngữ Việt tương đương; câu tao nhã dùng mỉa (''Một khắc đêm xuân đáng ngàn vàng'') thì giữ câu Hán-Việt
      quen thuộc.'
    wordplay: 'Giữ TÁC DỤNG, không giữ chữ, và không thêm câu đùa mới. 性福/幸福 → ''hạnh phịch''/''hạnh phúc'',
      thống nhất cả game (xem handbook). 出來賣/外賣 → ''gái ra đường bán''/''gái giao hàng tận nơi''. 菊花 →
      ''hoa cúc''. Mật mã hoa giữ tên hoa và giá. 骯臟的屁眼交易 → ''phi vụ đi cửa sau dơ bẩn''. 風之劍圣/蜂之劍圣 →
      ''Phong Kiếm Thánh''/''Ong Kiếm Thánh''. 出色 tách 色 → ''xuất "sắc"''. 回籠昏 → ''ngất nướng''. Câu lỡ
      miệng, vấp chữ (''賤……\N[59]'', chữ tục lọt giữa câu) phải dựng lại cú vấp bằng tiếng Việt. Lóng
      mạng: 泰迪 → ''Teddy'' (để giọng mỉa tự gánh nghĩa), 抖S → ''S chính hiệu/máu S'', 黑暗料理 → ''món hắc
      ám''. Meme dùng bản Việt quen thuộc (Đại thoại Tây du theo bản lồng tiếng; ''đầu gối trúng tên''
      bám sát Skyrim). Nhịp hài: giữ ''……'' đúng chỗ bị cắt (''cảm ơ… Á!''); cặp mắng nhau giữ nhịp ngắn
      (''Đồ óc heo!'', ''Đồ lợn ngu!''). Chơi chữ không có đối ứng thì viết câu Việt có cùng tác dụng,
      ngắn bằng hoặc ngắn hơn gốc, không chú thích.'
    poetry: 'Hầu như không có thơ vần. Văn nghi thức cần dịch cố định: (a) công thức ám thị ''Học ma pháp
      hệ X thì…, đó là thường thức'' / ''Dùng phép hệ X nghĩa là phải…''; (b) câu kích hoạt ''Có việc
      gì muốn làm không?'' / ''Nói thật đi''; (c) câu niệm nô lệ Torres và ''(\N[59] là một con chó cái
      x N)''; (d) khẩu quyết bốn bước ''Cảm nhận nó, khống chế nó, hội tụ nó, giải phóng nó!'' và châm
      ngôn giả của các hệ; (e) lời thề hôn lễ (Map119 với \N[11]; Map135 bản nhại bẻ vế cuối thành ''mãi
      mãi phục tùng'') theo văn lời thề cưới Công giáo quen thuộc; (f) màn xưng danh Hentai ZERO theo
      kiểu tokusatsu; (g) đoạn nhại Đại thoại Tây du ở Good End A; (h) lời chào chung của tinh linh giữ
      đền ''Nhân loại kia～ Đây không phải nơi ngươi nên đến!''; (i) câu kiếm hiệp và bài ''ca'' rượu của
      tên lính đánh thuê; (j) lời kết sử thi của các bad end: giọng biên niên trang trọng, nhịp chậm;
      (k) tên chiêu Latin Zapfkiel / Aleph giữ nguyên.'
    names: 'Chưa có bản Việt chính thức; tên tiếng Anh chính thức mới xác nhận Lilina, Aisha (tên DLC)
      và tên game Cursed Armor. Bản EN có tồn tại nên ưu tiên đối chiếu Steam EN trước khi khóa. Tạm dùng
      tên phương Tây viết Latin theo phiên âm hợp lý: Hiller, Simelia, Meili, Roger, Melissa, Lucia, Berika,
      Owen, Cospiro, Jon, Chloria, Trosi, Jude, Sanga, Resk, Sax, Shirley, Ross, Roster, Bigas, Charlo,
      Rant, Miller, Hart, Wendy, Jack, Darren, Nell, Lydis, Robert, Luna, Nicole, Lilith, Lisa, Lorin,
      James, Loki, Loken, Fitch, Matt, Galen, Galon, Sophia, Eros, Shuria, Dale, Seth, Nestra. Tên gốc
      Á dùng Hán-Việt: 龍吟 → Long Ngâm, 白雪 → Bạch Tuyết. Biệt danh mang nghĩa thì dịch nghĩa: 黑泰迪 → Teddy
      Đen, 金絲雀 → Hoàng Yến, 紅松鼠 → Sóc Đỏ, 白銀狐 → Cáo Bạc, 賤奴 → Tiện nô. Khách mời giữ tên fandom quen dùng
      (Tamamo-no-Mae, Asuna, Ram, Rem, Tokisaki Kurumi, Nero, Okita Souji…). Nhãn người nói là danh từ
      chung thì dịch nghĩa (守衛 → Lính gác, 村民1 → Dân làng 1, 男人A → Gã A, 傭兵B → Lính đánh thuê B), riêng
      ？？？ giữ nguyên. Nhãn phải khớp tên actor tương ứng. Đặt tên một lần trong glossary và không đổi
      giữa chừng.'
