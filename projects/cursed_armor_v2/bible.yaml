handbook:
- src: 性福 / 幸福 (我好～\{性福\}～哦 / 我也覺得我很\{幸福\} / 太性福了 / 好性福啊)
  type: chơi chữ đồng âm, lặp xuyên game
  meaning: 性福 (phúc chăn gối) đồng âm với 幸福 (hạnh phúc)
  why: Lilina và nô lệ nói 'tính phúc', người ngây thơ đáp 'hạnh phúc'. Lặp ở Map006, 014, 040, 045, 085,
    092, 105, 124, 143, 190 và nhiều nơi khác
  vi: '性福 → ''hạnh phịch''; 幸福 → ''hạnh phúc''. Ví dụ: ''Em hạnh～\{phịch\}～quá～'' / ''Anh cũng thấy rất
    \{hạnh phúc\}''. Thống nhất cả game (thay cho phương án ''sướng'' ở ghi chép phần 14–21). Ở cảnh khóc
    Map040 vẫn dùng ''hạnh phịch'' vì độ chua đến từ nước mắt.'
- src: 有想要做的事嗎
  type: mật lệnh kích hoạt ám thị
  meaning: Câu hỏi vô hại nhưng là công tắc kích hoạt 'Ma nữ hút tinh'
  why: Người chơi phải nhận ra câu này mỗi lần nó lặp lại
  vi: Có việc gì muốn làm không? (giữ y hệt mọi nơi, không thêm đại từ)
- src: 說實話
  type: mật lệnh ám thị
  meaning: Buộc Lilina nói ra suy nghĩ thật dù vẫn tỉnh (ám thị 'Lời nói theo lòng')
  why: Lặp hàng chục lần
  vi: 'Nói thật đi (kéo dài: ''Nói～thật～đi～'')'
- src: '暗示: 野外露出/愛玩少女/高潮失禁/捨身取欲/異種苗床/活體人偶/吸精魔女/脫衣清醒/言行一致/夜晚調教/保守秘密/抵觸強奸/無法高潮/不許說謊'
  type: tên ám thị và lạc ấn (vật phẩm Danh sách Ám thị)
  meaning: Mỗi hệ ma pháp gắn một ám thị
  why: Là cơ chế gameplay; việc lách ám thị phụ thuộc đúng câu chữ
  vi: Lộ thân nơi hoang dã / Thiếu nữ ham chơi / Lên đỉnh thất cấm / Xả thân cầu dục / Ổ giống dị chủng
    / Búp bê sống / Ma nữ hút tinh / Cởi đồ thì tỉnh / Lời nói theo lòng / Điều giáo ban đêm / Giữ bí
    mật / Kháng cự cưỡng hiếp / Không thể lên đỉnh / Không được nói dối
- src: 學習X系魔法，……，這是常識 / 使用光系魔法，就是要暴露自己的身體…
  type: công thức tẩy não lặp
  meaning: Biến hành vi tình dục thành 'kiến thức nền' của từng hệ
  why: Ross nói, Lilina lặp lại y nguyên; Map174 dùng lại
  vi: Học ma pháp hệ X thì…, đó là thường thức. / Dùng phép hệ X nghĩa là phải… (câu Lilina nhắc lại trùng
    từng chữ; 常識 luôn là 'thường thức', giữ mã màu)
- src: 感知它，控制它，聚焦它，釋放它！
  type: khẩu quyết bốn bước
  meaning: Bốn bước ma pháp Thủy hệ, ám chỉ tình dục
  why: Lặp ở Map160 ev10p0 và ev10p6
  vi: Cảm nhận nó, khống chế nó, hội tụ nó, giải phóng nó!
- src: 光的意義在於看見，正如暗的作用在於遮蔽 / 要駕馭風，先成為風 / 只有光才能揭示出了你的真實！ / 光的意義在于揭示真實
  type: châm ngôn giả, motif
  meaning: Lý lẽ để bắt cởi đồ hoặc 'tự do'
  why: Lặp ở cảnh Simelia và ở Học viện
  vi: Ý nghĩa của ánh sáng là để nhìn thấy, cũng như bóng tối là để che giấu / Muốn chế ngự gió, trước
    hết phải hóa thành gió / Chỉ ánh sáng mới phơi bày được con người thật của em! / Ý nghĩa của ánh sáng
    là phơi bày chân thật
- src: 自由之風 / 在風的領域里……一切都是自由的 / 欲望之火 / 溫暖之火 / 火系魔法的本質就是要溫暖人心
  type: motif ẩn dụ các hệ
  meaning: Gió tự do, lửa dục vọng, lửa sưởi ấm
  why: Lặp như câu chú, bị dùng làm cớ phóng túng
  vi: ngọn gió tự do / trong lãnh địa của gió… mọi thứ đều tự do / ngọn lửa dục vọng / ngọn lửa sưởi ấm
    / Bản chất ma pháp hệ Hỏa là sưởi ấm lòng người
- src: 那就接受這里的一切吧！
  type: câu chốt nghi thức
  meaning: Dùng ở cả cảnh Simelia lẫn cảnh Cha xứ
  why: Lặp có chủ đích
  vi: Vậy thì hãy đón nhận tất cả nơi đây! (y hệt ở cả hai cảnh)
- src: \N[59] (= 賤奴) / 賤……\N[59]明白了
  type: tự xưng bằng biến
  meaning: Cách tự xưng hèn bắt buộc của nô lệ Thành chủ; câu vấp cho thấy giá trị là 賤奴
  why: Trục tẩy não; các lần vấp và sửa lời là điểm kịch (Map139 ev9p0, Map144 ev24p0, Map085)
  vi: 'Giá trị DB: ''Tiện nô''. Câu vấp: ''Tiện… \N[59] hiểu rồi''. Mọi câu phải đọc trôi khi biến hiện
    thành ''Tiện nô'' ở mọi vị trí.'
- src: 拜托～主人～能不能不要滿嘴都是\N[59]啊……
  type: đùa về chính biến tự xưng
  meaning: Succubus than Lilina mở miệng là xưng 'Tiện nô'
  why: Phá tường thứ tư (Map144 ev24p0)
  vi: Trời ạ～ chủ nhân～ đừng có mở miệng ra là \N[59] nữa được không…
- src: （\N[59]是\C[5]一條母狗 x N\C[0]）
  type: tự thôi miên, meme
  meaning: Nhẩm đi nhẩm lại một câu
  why: Ký hiệu 'x N' tạo hài đen (Map143 ev23p1, Map144 ev7p3)
  vi: (\N[59] là \C[5]một con chó cái x N\C[0]) — giữ 'x N' và mã màu
- src: \N[59]是屬于主人的，侍奉主人是\N[59]的榮幸，只要能聽到主人愉悅的叫聲，\N[59]就會感到無比的滿足，并獲得無盡的力量！
  type: câu niệm lặp
  meaning: Câu tự thôi miên của nô lệ
  why: Lặp như thần chú (Map144 ev7p6)
  vi: \N[59] thuộc về chủ nhân, được hầu hạ chủ nhân là vinh hạnh của \N[59]. Chỉ cần nghe tiếng chủ nhân
    sung sướng, \N[59] sẽ thấy mãn nguyện vô cùng và có được sức mạnh vô tận!
- src: \{\C[6]Zapfkiel～\C[0]\}… \{\C[6]Aleph！！！\C[0]\}
  type: tên chiêu tối thượng
  meaning: Zaphkiel (tên thiên thần), Aleph (chữ cái Hebrew)
  why: Khí thế chiêu cuối; Succubus can ngăn
  vi: Giữ nguyên chữ Latin và toàn bộ mã
