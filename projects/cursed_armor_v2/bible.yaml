can_xac_nhan:
- 'CHỐT KHI GỘP HAI BỘ GHI CHÉP (phần 1–13 và 14–21 mâu thuẫn), cần người duyệt: 獵天使 ''Thiên Sứ Săn''
  (bỏ ''Thợ săn Thiên thần'' ở phần 10–21; lý do: danh hiệu chỉ người, nghĩa ''thiên sứ đi săn'', và joke
  ''không phải thiên sứ thật chứ''); 魔鋼 ''ma cương'' (bỏ ''ma thép''); 苗床 ''ổ giống'' (bỏ ''ổ ươm'');
  學生/特等生 ''học viên'' (bỏ ''học sinh'' của phần 14–21); 銀月公主 ''Công chúa Ngân Nguyệt'' (bỏ ''Trăng Bạc'');
  性福 ''hạnh phịch'' (bỏ phương án ''sướng''/''hạnh "phúc"''); 詛咒鎧甲 ''Giáp Nguyền Rủa'' và vật phẩm ''X
  Nguyền Rủa'' (bỏ ''giáp nguyền'', ''X bị nguyền''); 魔導水晶 ''Thủy tinh Ma đạo'' (bỏ ''Pha lê Ma đạo'');
  女王的傳送 ''Truyền tống của Nữ vương''; 不良 ''Côn đồ'', 流氓 ''Lưu manh''; 神之音 ''Thần chi âm'' (bỏ ''Tiếng
  nói của Thần''); 獄霸 ''Trùm phòng giam''; 神器 khuôn ''Vô hiệu X''; 鐵球 ''quả tạ sắt''; 鐐銬 ''xiềng''; Lilina
  độc thoại xưng ''mình'' (phần 14–21 ghi ''tôi'').'
- 'TÊN: các ghi chép phiên khác nhau. Hồ sơ chốt: Berika (bỏ Berica), Jude (bỏ Yude), Chloria (bỏ Cloria),
  Trosi (bỏ Trosy), Charlo (bỏ Sharo), Nell (bỏ Nier), Lilith (bỏ Lilis), Long Ngâm (bỏ Longyin), Lang
  Thần (viết hoa). Ngoài Lilina và Aisha, mọi tên đều tạm. Đề nghị đối chiếu bản EN Steam (app 907090)
  trước khi khóa Actors.json.'
- 'ÁNH XẠ \N[n]: ĐÃ KIỂM Actors.json 31/10 (Claude): \N[43]=Nicole, \N[44]=Lilith, \N[45]=Lisa, \N[46]=Lorin,
  \N[56]=Lang Thần, \N[60]=Nestra, \N[14]=Jon, \N[38]=Asuna, \N[39]=Fina; \N[24], \N[42], \N[57], \N[58] tên rỗng.
  Còn mở: \N[14] là Thành chủ cũ hay cái bóng.'
- 'Lệnh Đổi tên Actor (event code 320/324) cần kiểm: \N[2] (''神父'' nhưng có ''\N[2]神父'', và câu ''\N[2]傭兵哥哥~不要停''
  vô nghĩa nếu \N[2]=神父); \N[4] (Succubus nói ''ta tên \N[4], hồi làm người tên như vậy''); \N[8] (''sau
  này gọi ta là \N[8]''); \N[1] bị thay bằng danh hiệu ở nhà ngục; \N[11] do người chơi đặt. Chuỗi tên
  mới nếu có cũng phải dịch.'
- '\W[n]: \W[1] vừa là nhãn người nói chung vừa là tên cướp ''chủ nhân'' ở Map173; \W[3] là cách Nell
  gọi Lilina. Giá trị lấy từ plugin Z_Wolfzq_Text.js hoặc biến: cần kiểm.'
- 'Viết hoa giá trị actor danh từ chung (\N[51] Thầy, \N[53] Lính gác, \N[55] Dân làng, \N[59] Tiện nô)
  sẽ thành ''chủ nhân Lính gác'' giữa câu. Cần quyết viết hoa hay thường. Phương án khác cho \N[59]: ''nô
  tì''.'
- 'CHÍNH SÁCH NỘI DUNG: Map186 ev2p0 có nhân vật ''少年'' chưa rõ tuổi trong cảnh có nội dung tình dục;
  Seth (塞斯) phần 1–13 ghi trưởng thành nhưng phần 19–20 ghi ''thiếu niên'' (Map174). Hồ sơ KHÔNG đưa hướng
  dẫn dịch phần tình dục của các cảnh này. Chưa xác nhận rõ là người trưởng thành thì giữ trống, báo chủ
  dự án. Không được ''đổi'' nhân vật thành người lớn trong bản dịch.'
- 'Phạm vi phát hành và mức giữ chữ tục: thang từ tục và quy ước ''học viên'' là đề xuất của hồ sơ; chủ
  dự án cần duyệt.'
- 'Xưng hô Succubus: các phần dùng lẫn ta/em/chị đây/tôi. Hồ sơ chốt ''em – chủ nhân'' với Lilina, ''ta''
  với người khác.'
- 'Lilina với Trùng Vương: phần 1–13 dùng ''tao – mày'', nhưng phần 14–21 cấm ''tao'' cho Lilina. Hồ sơ
  chốt ''ta – mày''. Câu Lilina với Dale: ''cháu – bác'', khi cà khịa thì ''tôi''. Cần duyệt.'
- '尾器 (đuôi Trùng Vương) và 尾巴 (đuôi Lilina-nữ yêu) đều dịch ''đuôi''. Phần 14–21 đề xuất ''vĩ khí'' cho
  尾器. Cần chọn: thống nhất ''đuôi'' hay tách ra.'
- '言行一致: tên ám thị ''Lời nói theo lòng'', mật lệnh ''Nói thật đi''. Cần xem vật phẩm Danh sách Ám thị
  để khớp.'
- 'Học viện có hai cụm map (Map041–047 và Map159–165, ''cải biến thường thức'', thẻ học viên phân viện):
  một tuyến hay hai tuyến/hai phân viện? Kết cục khác nhau (Ross bị hiệu trưởng già diệt / bị Lilina giết
  / lên làm hiệu trưởng / làm quốc vương ở Bad End B).'
- 'Nhãn kết cục theo từng tuyến trùng chữ: Bad End A (Di tích Map079 / Ma trùng Map169), Bad End B (Ma
  trùng: bán cho Melissa / Học viện Map162), True End tuyến Ma trùng (Map026 ev4p2 Succubus đồng hóa ấu
  trùng / Map189–190 Lang Thần). Giữ nhãn như gốc; cần xác nhận quan hệ giữa chúng.'
- 'Owen lộ mặt: phần 1–13 ghi ''tuyến Hội ev4p3 (cuối)'' không rõ map, phần 14 ghi Map133 ev23p2. Cần
  id chính xác. Thứ tự Map135 và Map136 cũng chưa rõ.'
- 'Nhãn người nói có thể gắn nhầm: Map058 ev1p1 ([梅莉] giọng Succubus); 梅麗婭 ở ce55; Map026 ev3p0 cuối ([魅魔]
  好的, có lẽ là Lilina); Map117 ev7p0 (''\N[1]~不啊～'', có lẽ là \N[11]); Map144 ev7p1/ev7p2/ev7p6/ev8p0
  (lẫn Trosi/Chloria/Sanga/Lilina); Map162 ev9p1/ev11p1 (Lilina/Wendy/hồn ma); Map189 ev6p0, Map190 ev5p0/ev6p1/ev6p2
  (nhãn 莉莉娜 cho nhiều Lilina và Succubus mượn thân). Không sửa nhãn khi chưa duyệt.'
- 'Giới tính chưa rõ: Charlo (phần 7 ghi nữ, phần 6/8/18 nghiêng nam), Ils, Islebur, thầy/cô Phong và
  Thủy hệ, chủ quán Diễm Vũ, trưởng làng, quản lý Thương hội, Ma Nhãn, Thủy/Băng tinh linh, Dâm Ma Hộ
  Vệ, học giả (trước khi lộ là Nữ vương Slime).'
- '淫魔守衛 (54 dòng): là Dâm Ma Hộ Vệ ở đền Thổ hay lính gác dâm ma ở nơi khác (phần 14–21 xếp vào nhóm lính
  gác)?'
- \N[11] có phải chính Kỳ Lân Vương nếu người chơi chọn con vàng? (thoại Map117 ev3p2 rất giống)
- 'Ram/Rem: kịch bản chỉ ghi ''đôi chị em''; hồ sơ đề xuất Ram là chị. Tuổi tương đối Lilina–Sanga (chị–em),
  Lilina–Luna (tôi–cô), Lilina–Nell (mình–cậu): chưa có dữ liệu.'
- '''哈比'' (Habi) trong tiếng Trung cũng là tên dịch của ''Happy'' (Fairy Tail): tạm giữ Habi.'
- 'Nhà ngục Rừng (Anvil) và Nhà ngục Đế quốc: một hay hai? Darren ở đâu? 不良 ở Map045 là Hart hay Miller?'
- 'Các phần sau có thể sửa phần trước: Jude ở Map014 ev11p0 (lật mặt ngay) và Jude ở Torres (đồng minh
  đến Map154): hai nhánh hay một mạch? ''夫人'' Jude dùng: Torres xảy ra sau hay trước đám cưới với Owen?'
- 'Độc của Cospiro: ''không chết người, không có thuốc giải vẫn sống như thường'' mâu thuẫn với ''không
  có cách chữa tận gốc''. Dịch đúng từng câu, không tự hòa giải. Số năm ở Galon (1000/500/1300) cũng giữ
  nguyên văn.'
- 'Chưa rõ: thứ Succubus lén trả ở đá phong ấn (Map090 ev8p1); ''vị đại nhân kia'' của Shirley/Sax/Hỏa
  tinh linh; 令郎 của Sax; ''\N[23]姬'', ''朧大人'', ''群里某個抖S王廚'' ở Ngôi Nhà Tình Yêu; 塞露貝利亞, 莉艾麗, 米卡, 世者之樹女神
  (世界之樹?), 緋月, VH01; ''西西'' là tên thân mật của Succubus hay không.'
- 'Ghi chép không mô tả vài nhân vật/nhãn nhiều thoại: 主人 (154 dòng), 調教師 (90), 狼神 phần trước Map189,
  洛基/梅莉 ngoài cảnh đã nêu. DLC Flesh sheath và IF Aisha có thể chưa được đọc.'
- 'Mã lỗi gốc (''\千年樹精C'', ''[\C學生5] \C\C[3]…'', \u001e ở Map014 ev6p0, ''\C[2]\N[12]'' ở Map136, ''\C[3]\C[18]\C[0]''
  ở Map154 ev2p6): giữ nguyên hay để kỹ thuật sửa? Cần quyết định.'
- '''Nromal End'' → ''Normal End'': cần đồng ý. Ký tự ''～'' cần kiểm font tiếng Việt của game hiển thị
  được; nếu không, kỹ thuật đổi đồng loạt sang ''~''.'
