Map050.json:ev2p0:
  effect: Thương cảm cho Galon, nhục cho Lilina, cười vì lời nghĩ thầm
  mood: Bi thương, ép buộc, hài đen
  summary: Vua Galon kể chuyện người vợ Sophia và người phụ nữ đeo nhẫn Succubus từ 1000 năm trước. Ông
