  mood: Căng thẳng, lật ngược tình thế
  summary: Succubus trở lại, chỉ ra tiếng chuông là ám thị và viên thủy tinh là thứ hút dâm năng. Lilina
    phá thủy tinh, Ross gọi 'hiệu trưởng đại nhân', Berika hiện ra.
Map043.json:ev31p0:
