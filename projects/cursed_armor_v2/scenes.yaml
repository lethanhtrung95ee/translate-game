  effect: chức năng
  mood: hệ thống
  summary: Menu bật/tắt thần khí.
CommonEvents.json:ce12:
  effect: bất an, tò mò
  mood: rùng rợn, bất lực
  summary: 'Trạng thái qua đêm: tinh dịch/sữa rỉ ra, phát độc, ký sinh trùng chiếm cơ thể, phản phệ của
    khế ước vào ''Ngày khế ước''. Cuối cùng một ý thức ''về tổ'' nuốt mất lý trí, cô đi về khu phố cũ.'
CommonEvents.json:ce120:
  effect: chức năng
  mood: hệ thống
  summary: Menu mô phỏng (擬態) trang phục theo bộ đã lưu 1–9 hoặc theo trang bị; có lựa chọn hủy hoặc giữ
    mô phỏng.
CommonEvents.json:ce121:
  effect: căng
  mood: giằng xé
  summary: 'Cơn nghiện phát: chọn nhịn hay dùng Skooma.'
CommonEvents.json:ce125:
  effect: chức năng
  mood: hệ thống
  summary: 'Menu Bình báu tinh dịch: pha chế hoặc đổi chế độ thu gom.'
CommonEvents.json:ce126:
  effect: chức năng
  mood: hệ thống
  summary: Thông báo tháo đai trinh tiết và các loại xiềng.
CommonEvents.json:ce127:
  effect: chức năng
  mood: hệ thống
  summary: 'Menu thao tác đồ ma cương: đổi hình, làm mềm, định hình.'
CommonEvents.json:ce132:
  effect: chức năng
  mood: hệ thống
  summary: Thông báo đai ma cương bị mở bằng chìa, bị phá, bị làm mềm.
CommonEvents.json:ce138:
  effect: nghẹn, tổng kết số phận
  mood: trầm, tự soi
  summary: 'Soi gương: tóm tắt thân phận hiện tại của Lilina (thiếu nữ, nữ u linh, nô lệ thuộc về ai,
    chỉ số nô lệ), các vai trò ở từng thành (phu nhân hội trưởng, kỹ nữ, bồn cầu thịt, vợ côn trùng, vợ
    thú yêu \N[11]).'
CommonEvents.json:ce139:
  effect: chức năng
  mood: hệ thống
  summary: Hiển thị buổi trong ngày và số ngày ở Học viện.
CommonEvents.json:ce14:
  effect: vừa ghê vừa thương
  mood: đau đớn pha dịu dàng
  summary: Mang thai quái, bụng hút ma lực rồi sinh nở. Lilina luyến tiếc bỏ đứa con lại, dặn nó 'tự cố
    gắng lớn lên'.
CommonEvents.json:ce143:
  effect: chức năng
  mood: hệ thống
  summary: 'Menu tùy chỉnh kiểu Tamamo-no-Mae: tóc, mắt, mặt, độ dài tóc.'
CommonEvents.json:ce145:
  effect: chức năng
  mood: đời thường
  summary: 'Ở Học viện: thoại khi đến sai lớp hoặc lớp chưa xếp (hệ Thổ, Thủy, Lôi, Hỏa).'
CommonEvents.json:ce147:
  effect: hài/khiêu khích
  mood: lả lơi
  summary: Thoại kỹ năng quyến rũ trong chiến đấu.
CommonEvents.json:ce148:
  effect: nghẹn, tò mò về thầy hệ Thổ
  mood: nặng nề, có chút hài khi Succubus phủ nhận 'lò ấp'
  summary: Lilina sắp sinh nhưng không nuôi được con. Succubus gợi ý phá thai bằng dâm ma pháp; con trước
    đã gửi cho thầy hệ Thổ (ông ta rất hứng thú với con của cô). Cô học kỹ năng Sinh nở & Phá thai và
    phải chọn.
CommonEvents.json:ce15:
  effect: nội dung người lớn
  mood: H
  summary: 'H với slime: hai biến thể trong trắng/sa đọa, kết bằng thu gom tinh dịch và lời than về lời
    nguyền.'
CommonEvents.json:ce153:
  effect: ngượng, giằng xé
  mood: mê hoặc, tự giễu
  summary: Ở dạng u linh, Lilina hút tinh khí nam sinh đang ngủ. Cô sợ nghiện, không muốn làm u linh,
    tự gọi mình là 'si nữ'.
CommonEvents.json:ce156:
  effect: thương
  mood: tuyệt vọng
  summary: Lên cơn thèm thuốc; câu phải về hầu ngủ chủ nhân.
CommonEvents.json:ce157:
  effect: xác lập danh xưng
  mood: hệ thống
  summary: 'Các tiền tố cách NPC gọi Lilina: ''Phu nhân'', ''Đại nhân Thợ săn Thiên thần'' (kèm biến thể
    lắp bắp, ngạc nhiên) hoặc gọi tên.'
CommonEvents.json:ce158:
  effect: ngột ngạt
  mood: áp bức
  summary: Người lạ nhận ra vòng cổ không lỗ khóa, biết cô là nô lệ vĩnh viễn rời Torres không có chủ,
    và ép cô nhận hắn làm chủ.
CommonEvents.json:ce16:
  effect: nội dung người lớn
  mood: H
  summary: 'H với slime độc: lời thoại xen tiếng ho vì trúng độc.'
CommonEvents.json:ce161:
  effect: căng nhẹ
  mood: gấp gáp
  summary: Succubus phát hiện chủ nhân bị ký sinh, giục đi chữa trước khi cơ thể bị cải tạo.
CommonEvents.json:ce168:
  effect: chức năng
  mood: hệ thống
  summary: Menu hiệu ứng ký sinh trùng trên người và ở đuôi.
CommonEvents.json:ce169:
  effect: thông tin quan trọng
  mood: hệ thống
  summary: Bảng thống kê số lần đạt các kết cục và điều kiện (tuyến Di tích, Học viện, Thánh thú, Ma trùng,
    True End của Giáp Nguyền Rủa); bật bỏ qua siêu tốc bằng phím A.
CommonEvents.json:ce17:
  effect: nội dung người lớn
  mood: H
  summary: 'H với slime gây tê: Lilina tê miệng, chỉ còn rên vô nghĩa.'
CommonEvents.json:ce177:
  effect: chức năng
  mood: hệ thống
  summary: Dùng 20 dâm năng để tăng tỉ lệ vùng thoát.
CommonEvents.json:ce18:
  effect: nội dung người lớn
  mood: H
  summary: H với ong sát thủ.
CommonEvents.json:ce180:
  effect: chức năng
  mood: hệ thống
  summary: Xem phòng CG, kèm hướng dẫn phím.
CommonEvents.json:ce19:
  effect: nội dung người lớn
  mood: H
  summary: H với bọ cạp độc.
CommonEvents.json:ce2:
  effect: ngượng
  mood: ngượng
  summary: 'Thoại khi không chịu cởi đồ: xấu hổ, còn trinh, giữa đông người.'
CommonEvents.json:ce20:
  effect: nội dung người lớn
  mood: H
  summary: 'Vắt sữa: các trường hợp bị trói hoặc ''giữ sữa cho vị đại nhân nào đó''; cảnh vắt sữa thu
    được Ma Nhũ.'
CommonEvents.json:ce24:
  effect: chức năng
  mood: hệ thống
  summary: Menu lưu hoặc chọn bộ trang phục 1–9.
CommonEvents.json:ce25:
  effect: nhắc nhở
  mood: cam chịu
  summary: 'Nhắc lịch phải đến làm nô lệ cho các ''chủ'': Ba chị em Xà nữ, Thụ tinh Ngàn năm, Garon, Dâm
    ma vệ binh, Thủy tinh linh, Hỏa tinh linh; có lựa chọn bỏ qua hoặc xem.'
CommonEvents.json:ce27:
  effect: cười ngượng
  mood: hài – ngượng
  summary: U linh nhập vào làm Lilina mọc 'dương vật'; cô thủ dâm cho nó bắn hết ma lực thì nó biến mất.
CommonEvents.json:ce28:
  effect: định hướng
  mood: hướng dẫn, có chút hài trong ngoặc
  summary: 'Danh sách mục tiêu nhiệm vụ chính: vào Hội Mạo hiểm, hỏi \N[2] về thánh vật, sáu thánh vật
    ở các nơi, cởi giáp ở Di tích Đế quốc, chơi vòng mới.'
CommonEvents.json:ce29:
  effect: nội dung người lớn
  mood: H
  summary: Lần đầu tiết sữa, học kỹ năng Vắt sữa; thoại khi bị bắn đầy.
CommonEvents.json:ce30:
  effect: nội dung người lớn
  mood: H, ghê
  summary: H với zombie, kết bằng câu chê 'siêu ghê tởm'.
CommonEvents.json:ce31:
  effect: nội dung người lớn
  mood: H, ghê
  summary: H với xương binh.
CommonEvents.json:ce32:
  effect: nội dung người lớn, mở đầu cho ce27
  mood: H, sợ
  summary: Lilina sợ ma nhất; u linh hút ma lực rồi nhập vào, để lại 'vật nhô ra' bán trong suốt.
CommonEvents.json:ce33:
  effect: nội dung người lớn
  mood: H
  summary: Bị đám vong linh vệ binh vây, miệng bị chặn nên chỉ có tiếng ư ư; sau đó bị nhập như ce32.
CommonEvents.json:ce34:
  effect: chức năng
  mood: căng/lả lơi
  summary: Thoại khi bị lột đồ trong chiến đấu.
CommonEvents.json:ce40:
  effect: nội dung người lớn
  mood: H
  summary: H khi bị bắt (ở trạng thái sa đọa).
CommonEvents.json:ce41:
  effect: nội dung người lớn
  mood: H
  summary: H với dâm ma, thoại kèm độc thoại nội tâm.
CommonEvents.json:ce42:
  effect: căng
  mood: H, thách thức
  summary: Nhờ đai trinh tiết mà dâm ma thất bại và ném cô ra; ở biến thể khác, cô phải dẫn dâm ma về
    phòng trong cùng, và khinh thường việc nó định thuần phục cô.
CommonEvents.json:ce43:
  effect: chức năng
  mood: hệ thống
  summary: Kỹ năng vô hiệu; menu dịch chuyển (Anvil, Vương thành Garon, Làng Đảo nhỏ, Di tích Đế quốc);
    cô gái được cứu cảm ơn.
CommonEvents.json:ce44:
  effect: nội dung người lớn
  mood: H
  summary: H với chim ưng.
CommonEvents.json:ce45:
  effect: nội dung người lớn
  mood: H
  summary: H với ma ngưu.
CommonEvents.json:ce46:
  effect: chức năng
  mood: hệ thống
  summary: 'Chọn cách quyến rũ: theo lựa chọn hoặc trực tiếp.'
CommonEvents.json:ce47:
  effect: cảnh báo
  mood: hệ thống
  summary: Hấp thu tinh dịch còn sót làm Lilina sa đọa hơn; hỏi xác nhận.
CommonEvents.json:ce48:
  effect: nội dung người lớn
  mood: H
  summary: H với quái bạch tuộc.
CommonEvents.json:ce49:
  effect: nội dung người lớn
  mood: H
  summary: H với hỏa long; câu kết lo bị 'chinh phục' hoàn toàn.
CommonEvents.json:ce5:
  effect: rợn, tò mò về \N[8]
  mood: lạnh lùng, đáng sợ
  summary: 'Danh sách ám thị thôi miên trên người Lilina: mỗi hệ phép một ám thị (Phơi thân, Thiếu nữ
    ham chơi, Lên đỉnh mất kiểm soát, Xả thân thỏa dục, Lò ấp dị chủng, Búp bê sống), cùng các ám thị
    gắn với \N[8] (giữ bí mật, kháng cự cưỡng hiếp, không thể lên đỉnh…), kèm hiệu ứng khi thành Lạc ấn
    vĩnh viễn.'
CommonEvents.json:ce50:
  effect: cười ngượng
  mood: H, tự giễu
  summary: Bị lửa vây, Lilina dùng tượng đá hút lửa và ma lực, rồi xấu hổ vì 'phù thủy lửa' lại thua lửa.
CommonEvents.json:ce51:
  effect: nội dung người lớn
  mood: H
  summary: H với dơi hút máu.
CommonEvents.json:ce52:
  effect: rợn
  mood: ghê tởm
  summary: Ký sinh trùng úp mặt, đẻ trứng vào dạ dày; cô phải về hội chữa.
CommonEvents.json:ce54:
  effect: căng/hài ('đàn ông dễ đối phó thật')
  mood: căng, ranh mãnh
  summary: Lính gác bắt vì khỏa thân hoặc lộ ký sinh, giật ký sinh, bắt giam. Có lựa chọn quyến rũ để
    thoát; nếu không thì bị tống ngục.
CommonEvents.json:ce55:
  effect: chức năng
  mood: hệ thống
  summary: 'Menu kiểu tóc và ngoại hình nhân vật: đuôi ngựa, sừng, hắc hóa, thần hóa, kỵ sĩ công chúa
    cuồng loạn hoặc phản loạn, dùng kiểu tóc của Melia/\N[9]…'
CommonEvents.json:ce6:
  effect: chức năng
  mood: hệ thống
  summary: Thoại khi kỹ năng không có tác dụng, thiếu dâm năng hoặc cần về phòng mới dịch chuyển được.
CommonEvents.json:ce61:
  effect: chức năng
  mood: cực nhọc
  summary: 'Lao động trong ngục: bị trói không làm được, đào được quặng bạc/vàng, ngất vì đói.'
CommonEvents.json:ce63:
  effect: khó chịu
  mood: suy đồi, bất lực
  summary: Trong ngục, Lilina mang dấu trói mai rùa của 'bồn cầu thịt' do quản ngục công nhận. Cô dụ hoặc
    bị lính gác ép (dọa dùng thuốc), làm để xin giảm án và tự hỏi có phải giáp biến mình thành si nữ.
CommonEvents.json:ce64:
  effect: cười nhẹ
  mood: hài nhẹ
  summary: Uống thuốc vô hiệu, chọn tăng liều 10 bình; ăn phải thứ dở tệ.
CommonEvents.json:ce66:
  effect: căng – thở phào
  mood: hồi hộp, lén lút
  summary: 'Lục phòng Darren: lấy đồ ăn, tiền, chìa khóa, dây thép, đọc nhật ký ghi chép việc huấn luyện
    mình. Gây tiếng động, Darren tỉnh dậy, cô viện cớ nhờ cởi trói.'
CommonEvents.json:ce68:
  effect: cười ('y hệt như cũ')
  mood: H, hài nhẹ
  summary: Lilina đổi đồ ăn lấy sự 'giúp đỡ' của nữ tù nhân; nữ tù cởi rồi buộc lại dây y hệt cũ.
CommonEvents.json:ce69:
  effect: cười, liều lĩnh
  mood: tinh quái
  summary: Ngày ra tù, Lilina dụ lính gác phá luật của quản ngục; lính sợ chết nhưng vẫn liều.
CommonEvents.json:ce7:
  effect: nội dung người lớn
  mood: H, bức bối
  summary: Thủ dâm để giảm dục vọng; bị ám thị chặn cực khoái.
CommonEvents.json:ce70:
  effect: cười nhẹ
  mood: hệ thống, phá tường
  summary: Menu can thiệp hiệu ứng hình ảnh; Giọng Thần nói đùa về trang phục, Succubus ngơ ngác 'cái
    gì thế?'.
CommonEvents.json:ce71:
  effect: chức năng
  mood: hệ thống
  summary: 'Menu tùy chỉnh chân dung đứng: vị trí, đai trinh tiết, mũ miện nguyền, âm thanh.'
CommonEvents.json:ce74:
  effect: chức năng
  mood: đời thường
  summary: 'Menu tắm rửa: toàn thân, mặt, làm sạch tử cung; bị trói thì không tự tắm được.'
CommonEvents.json:ce75:
