  summary: 'Lần quay lại Thần thụ theo khế ước: có lựa chọn phản kháng. Lilina thoáng tỉnh táo rồi lại
    sa vào khoái cảm, mất trí nhớ, tỉnh dậy thấy Quả Vàng trên tay.'
Map031.json:ev14p0:
  effect: ngượng
  mood: trơ trẽn
  summary: Lilina vào khu tắm nam và chào mời 'lỗ miễn phí'.
Map031.json:ev19p0:
  effect: ngượng
  mood: dâm đãng
  summary: Hai gã ở bồn tắm chơi với Lilina. Cô dặn họ giữ bí mật, rồi chê nhà tắm vắng khách.
Map031.json:ev19p1:
  effect: khó chịu, cười chua
  mood: bóc lột, trớ trêu
  summary: Ông chủ nhà tắm bán Lilina cho ba khách rồi tự mình lợi dụng lúc cô bất tỉnh. Người chơi chọn
    xin tiếp hoặc giả vờ ngất; nhánh giả ngất làm lộ ông ta sợ vợ. Cô nhận 2000G.
Map031.json:ev25p2:
  effect: ngượng
  mood: trớ trêu
  summary: Đang dọn nhà tắm, Lilina trượt ngã bất tỉnh, hai khách lấy cớ 'cấp cứu' để giở trò. Ông chủ
    mắng cô làm lỡ việc.
Map031.json:ev4p0:
  effect: gợi mở
  mood: hệ thống
  summary: Bà chủ hoặc ông chủ nhắc 'phu nhân' hoặc 'tiểu thư' rằng đây là khu tắm nam. Muốn kích hoạt
    cần thỏa điều kiện về xấu hổ, dục vọng, không còn trinh.
Map031.json:ev5p0:
  effect: không đáng kể
  mood: thường
  summary: Nhắc Lilina ('phu nhân' hoặc 'tiểu thư') chưa trả tiền tắm.
Map031.json:ev6p0:
  effect: bất bình; nhánh sa đọa thì khoái trá vì được lật kèo
  mood: ức hiếp, giả nhân giả nghĩa; nhánh sa đọa thì lém lỉnh
  summary: 'Lilina làm thêm ở nhà tắm. Ông chủ lấy chuyện cô ở nhà tắm nam để tống tiền, ép cô bán thân
    ban đêm. Nhánh sa đọa: cô dọa mách vợ ông ta, mặc cả chia 5 phần. Có thêm hội thoại bán vé tắm.'
Map031.json:ev6p1:
  effect: thông tin
  mood: bình thường
  summary: Bà chủ nhà tắm bán vé tắm 50G.
Map031.json:ev6p2:
  effect: ngột ngạt
  mood: nặng nề
  summary: Ban đêm ông chủ dẫn Lilina đi gặp 'mấy gã sung sức' đã chọn sẵn.
Map031.json:ev8p0:
  effect: cười vì lặp gag và màn xưng danh lố bịch
  mood: hài nhảm, parody tokusatsu
  summary: Hentai英雄ZERO trùm quần lót Lilina lên đầu, xưng danh anh hùng chính nghĩa rồi 'chế tài' cô.
    Lặp lại nhiều lần, có nhánh Lilina sa đọa tự đòi.
Map032.json:ev1p0:
  effect: cảm giác hoàn thành
  mood: trang trọng, cảm ơn
  summary: 'Màn kết: wolfzq cảm ơn người chơi, credits đội ngũ, hỏi có tiếp tục chơi nhánh phụ không.'
Map032.json:ev1p2:
  effect: rõ ràng, dễ hiểu
  mood: menu hệ thống
  summary: 'Phần thưởng chu kỳ mới: các thần khí, nâng giới hạn chỉ số sau độ khó Khó, đặt lại chỉ số
    bằng dâm năng đã dâng.'
Map035.json:ev13p0:
  effect: hiểu cơ chế
  mood: khắc nghiệt
  summary: 'Taylor giải thích luật mỏ: đào 10 quặng sắt lấy công, quặng bạc/vàng thì được thưởng thêm
    và xin giảm án.'
Map035.json:ev18p0:
  effect: chạnh lòng
  mood: u ám, thực tế
  summary: Một tù nhân khuyên Lilina dùng 'vốn liếng' thân xác để thoát ra, kể chuyện người anh em chết
    vùi trong vụ sập mỏ.
Map035.json:ev21p0:
  effect: bực bội
  mood: áp bức
  summary: Trùm phòng giam nhắc Lilina mỗi ngày phải đến phục vụ và nộp phiếu lao động.
Map035.json:ev21p1:
  effect: ngột ngạt
  mood: nhục nhã
  summary: Lần đầu Lilina phục vụ trùm phòng giam và tay chân, rồi bị biến thành 'đàn em' phải nộp phiếu
    mỗi ngày.
Map035.json:ev21p2:
  effect: nặng nề
  mood: sa đọa
  summary: 'Cô bỏ buổi nên bị phạt: bị ép uống thuốc kích dục rồi phục vụ cả đám. Cuối cùng bị trói dây
    đỏ, vứt ra cho lính canh thấy.'
Map035.json:ev22p0:
  effect: tức giận
  mood: bất công, có chút hài khi bọn chúng sợ phép
  summary: Quặng quý bị cướp, có 3 lựa chọn. Kêu lính canh thì bị vu khống, đưa vào phòng thẩm vấn. Dùng
    phép thì đám kia co vòi nhưng cô bị phạt. Nhịn thì thành đàn em.
Map035.json:ev23p0:
  effect: căng
  mood: đe dọa
  summary: Trùm phòng giam bắt gặp Lilina tự an ủi, dọa tố cô định vượt ngục để ép quan hệ. Cô viện cớ
    quy định của giám ngục, chỉ chịu phục vụ bằng miệng.
Map036.json:ev1p0:
  effect: thương
  mood: khổ sở
  summary: Lilina bị nhốt, xin nước và đồ ăn nhưng bị từ chối.
Map036.json:ev5p0:
  effect: ghê tởm, nặng nề
  mood: tàn bạo, mỉa mai
  summary: Bộ ba lính canh ở phòng thẩm vấn ép Lilina 'ăn cơm' bằng tinh dịch, tiêm thuốc kích dục cho
    gia súc. Án tù của cô bị kéo dài.
Map036.json:ev5p1:
  effect: bất lực
  mood: lạnh lùng
  summary: Lilina bị khám người, tịch thu đồ cấm.
Map036.json:ev5p3:
  effect: nặng nề
  mood: tra tấn
  summary: Bị tra hỏi bằng cưỡng hiếp để buộc nhận tội trộm. Nhận hoặc không nhận đều chịu tiếp.
Map036.json:ev6p0:
  effect: thông tin
  mood: hệ thống
  summary: Hết hình phạt, cô bị thông báo án tăng thêm.
Map037.json:ev1p0:
  effect: ngộp thở
  mood: ngột ngạt, tuyệt vọng
  summary: 'Lần đầu Lilina thấy nhà ngục: đồng ruộng điền viên bị tường thành cao như pháo đài vây kín.'
Map037.json:ev53p0:
  effect: ghê, nhục
  mood: nhục nhã cực độ
  summary: Không nộp đủ phiếu nên ban đêm Potter bắt Lilina làm 'gia súc' kéo bừa, tưới, bón ruộng.
Map037.json:ev62p0:
  effect: căng thẳng rồi nhẹ nhõm
  mood: hồi hộp
  summary: Lilina dùng túi khí vượt ngục qua sông, có lựa chọn đi vòng để tránh bờ biển.
Map037.json:ev6p0:
  effect: hướng dẫn
  mood: khô khan
  summary: 'Potter và Bill giao việc nông trại: hái 10 củ cải, rau, lúa mì, nho.'
Map038.json:ev11p0:
  effect: căng, khó chịu
  mood: nhục nhã, áp bức
  summary: 'Darren tiếp nhận Lilina, khám người trước mặt lính canh. Có các nhánh: bắt lại sau vượt ngục
    (án gấp đôi), hoặc cô tự quay về vì ''không rời được nơi này''.'
Map038.json:ev11p2:
  effect: rùng mình
  mood: sa đọa
  summary: Darren phát hiện cô vi phạm 'khế ước'. Thú thật thì cô xin ở lại làm nô lệ, được phòng 'bồn
    cầu thịt' riêng. Nói dối thì bị cộng 20 ngày.
Map038.json:ev12p0:
  effect: bực vì cáo già
  mood: âm mưu
  summary: Darren tăng giá vật tư gấp đôi để ép Lilina nhận điều giáo, đổi lại đồ ăn và giảm án.
Map038.json:ev12p1:
  effect: căng
  mood: đe dọa
  summary: Darren thấy dây đỏ đánh dấu bị gỡ, tra xem ai gỡ. Mỗi lựa chọn dẫn tới một kiểu phạt, rồi hắn
    đánh dấu lại.
Map038.json:ev13p0:
  effect: cười ngượng, ghê
  mood: hài bẩn
  summary: Lính canh hỏi có phải Lilina bón rau không rồi hớn hở định ăn 'phần đôi'.
Map038.json:ev17p0:
  effect: theo dõi tiến trình
  mood: lặp lại hệ thống
  summary: 'Vòng nghỉ ngày đêm: nộp phiếu cho đàn em của trùm hoặc lính canh, phạt khi thiếu, sự kiện
    mất chìa khóa, rồi đến hạn ra tù và lựa chọn ở lại hay đi.'
Map038.json:ev20p0:
  effect: dễ chịu, thương
  mood: ấm áp
  summary: Ông lão tù xin thuốc lá. Lilina xin được từ quan vật tư, giấu ông cách cô có được nó. Ông tự
    giới thiệu là Robert.
Map038.json:ev20p1:
  effect: xúc động, rồi tò mò
  mood: ấm áp chuyển sang căng thẳng
  summary: 'Robert lắng nghe Lilina khóc kể nỗi oan, đùa câu ''đầu gối trúng tên'', tặng túi khí và chỉ
    đường vượt ngục qua sông. Tuyến Ma trùng: nghe hỏi về ma trùng Abaddon thì ông nổi giận, nghĩ cô là
    người của \N[9].'
Map038.json:ev20p2:
  effect: tiết lộ, tò mò
  mood: thân mật, buồn
  summary: Ban đêm Lilina lẻn vào, kể bí mật lời nguyền và 'chứng minh' bằng thân thể. Robert đặt điều
    kiện giết \N[9], sau đổi thành cứu con gái ông \N[10]. Cuối cùng ông tiết lộ chỗ giấu ma thạch ở bãi
    biển phía tây cảng Anvil.
Map038.json:ev25p0:
  effect: tiến trình
  mood: hệ thống
  summary: Biến thể vòng nghỉ ngày đêm (không có lựa chọn làm nô lệ cho Darren), cuối có đàn em báo 'đại
    ca tìm mày'.
Map040.json:ev10p0:
  effect: sốc, hả hê vì thủ phạm bị lộ
  mood: sa đọa rồi bất ngờ
  summary: Berika điều giáo Lilina, bắt sủa 'gâu gâu' và đổi cách xưng hô thì bị Loki và Long Ngâm bắt
    quả tang. Lộ ra Berika là phụ nữ có dương vật, chính là kẻ hiếp dâm thật, và bị bắt.
Map040.json:ev3p0:
  effect: căng, ghê sợ, tò mò về Ma Nhãn và Dâm Ma Vương
  mood: đen tối, căng, tuyệt vọng
  summary: Succubus đối thoại với Ma Nhãn và Berika nhưng không cứu được Lilina, chỉ gài được lời hứa
    không đổi nhân cách. Berika lộ mặt là kẻ hiếp dâm thật, cưỡng bức Lilina, dùng Lạc ấn linh hồn, cài
    các ám thị 'Nói thật đi', 'Giữ bí mật', 'Điều giáo ban đêm' rồi thả cô đi lĩnh thưởng.
Map040.json:ev3p1:
  effect: nghẹn, căm phẫn; cuối cảnh Lilina quyết tìm cách tố giác
  mood: áp bức, nhục nhã
  summary: 'Đêm thứ hai: Berika trút giận vì bị Loki giao việc. Lilina bị ''Nói thật đi'' ép thú nhận
    khoái cảm. Berika thêm ám thị ''Kháng cự cưỡng hiếp'', vì chê cô ''dâm quá nên mất vui''.'
Map040.json:ev3p2:
  effect: ghê rợn, đau đớn
  mood: bạo liệt, cực đoan
  summary: 'Đêm tiếp: Berika cố tình cưỡng hiếp để kích hoạt ám thị. Lilina gào lên muốn giết Berika thì
    vỡ ám thị, khoái cảm ập tới làm cô sụp đổ. Linh hồn cô được mô tả đang quỳ như chó.'
Map040.json:ev3p3:
  effect: nghẹn (giọt nước mắt), rồi hả hê khi Berika bị bắt
  mood: tuyệt vọng rồi đảo chiều
  summary: 'Berika phát hiện Lilina nhờ Loki hoãn áp giải, liền phạt bằng ''Không thể lên đỉnh'' và bỏ
    mặc cô 5 tiếng. Lilina sủa gâu gâu, lạc ấn ăn sâu vào linh hồn, cô vừa ''hạnh phúc'' vừa rơi nước
    mắt. Nhánh khác: Loki và Long Ngâm ập vào bắt Berika.'
Map041.json:ev10p4:
  effect: ngượng, tò mò
  mood: lả lơi
  summary: Ban đêm, Lilina gợi ý với thầy Giáo vụ, nhắc lại 'buổi học Phong hệ' trước đó; ông nhận ra
    cô và dẫn đi.
Map041.json:ev11p0:
  effect: ấm áp, hơi lo
  mood: ngọt ngào nhưng có gợn
  summary: Hẹn hò lần đầu ở góc khuất. Lilina dò hỏi Long Ngâm về nội quy và 'học sinh đặc đẳng'; anh
    không biết gì đặc biệt. Hai người âu yếm, anh thề sẽ bảo vệ tình yêu của cô bằng cả mạng sống.
Map041.json:ev11p1:
  effect: buồn cười vì anh ngây ngô, xót vì cô đang dắt anh theo
  mood: hài pha ngượng
  summary: Lilina ép Long Ngâm 'chửi' và 'dùng' mình. Anh lúng túng nói theo rồi xin lỗi vì 'nói quá lời'.
    Cô thầm nghĩ 'phải từ từ'.
Map041.json:ev11p2:
  effect: cười, ngượng
  mood: tinh nghịch
  summary: 'Trò nhập vai ''người lạ'': Lilina giả không quen Long Ngâm, gãi ngứa, tự nhận ''ma nữ hư'',
    xin anh ''điều giáo''. Anh bảo ''bị em chinh phục rồi''.'
Map041.json:ev11p3:
  effect: căng, xót cho Long Ngâm
  mood: hồi hộp, tội lỗi
  summary: Các lần hẹn tới muộn với cớ 'ôn bài với bạn cùng phòng'. Lilina giấu chuyện tinh dịch đang
    chảy ra, căng thẳng rồi xin về.
Map041.json:ev12p0:
  effect: tò mò, bất an
  mood: ngọt rồi chuyển sang nghi ngờ
  summary: Long Ngâm kể mình dạy Tâm linh ma pháp, tức môn chống thôi miên. Lilina khoe 'học ma pháp bằng
    cơ thể', 'nước là thủy nguyên tố'. Chuyện ký túc xá chung nam nữ khiến anh hoảng, Lilina phải nói
    đùa cho qua và nhận ra chỉ mình anh không biết 'thường thức' của học viện.
Map041.json:ev12p1:
  effect: buồn, lo
  mood: trầm, phân vân
  summary: Lilina dò lại chuyện 'trò đùa' ký túc, Long Ngâm vẫn không nhận ra. Có người tới, họ hẹn tối
    mai gặp ở sân thượng tầng 2. Lilina buồn vì anh quá để ý người ngoài.
Map041.json:ev1p0:
  effect: mở đầu tuyến; biến thể kết gợi mất mát
  mood: trung tính / u buồn (biến thể)
  summary: 'Cổng học viện: nhập học, thầy Giáo vụ dẫn tân sinh lên phòng Hiệu trưởng. Một biến thể là
    lúc Lilina đã mất ma pháp, không muốn quay lại ''nơi đau lòng''. Cổng cần thẻ sinh viên hoặc thẻ giáo
    viên.'
Map041.json:ev21p0:
  effect: vừa sốc vừa buồn cười vì logic 'thường thức' bị bẻ cong
  mood: nhại học thuật, trơ trẽn
  summary: 'Lớp Thủy hệ ''cảnh giới tối cao'' với thầy \N[51] và đám học sinh, có cả ''bổ sung thủy nguyên
    tố'' bằng nước tiểu và dụng cụ, rồi màn phun nước từ sân thượng; Lilina được phong ''Ma nữ Nước''.
    Sau đó Bigas cho ''thực hành Quang hệ'': cô phô thân trước người giao hàng, hắn tưởng cô là gái làng
    chơi.'
Map041.json:ev21p2:
  effect: ngượng, cười nhẹ
  mood: lả lơi, tự do
  summary: Lilina chuyển thư của thầy cho thầy Giáo vụ, nhờ ông 'phối hợp học Phong hệ'. Xong việc cô
    chê ông không biết chiều, rồi lấy cớ 'sự tự do của gió' để đi tìm trải nghiệm mới, xin lỗi \N[28]
    vì bắt đợi.
Map041.json:ev22p0:
  effect: cười, hồi hộp
  mood: tinh quái
  summary: 'Trốn học với Miller: gặp Hart, thấy một nữ sinh bị trói bỏ mặc, Miller dụ Lilina ''luyện thủy
    nguyên tố'' ngoài trời. Cô làm bộ chê rồi đùa ''sẽ học hành tử tế''.'
Map041.json:ev23p0:
  effect: căng sợ bị phát hiện, buồn cười vì thầy Giáo vụ
  mood: hồi hộp kiểu hài
  summary: Lilina tự xin Hart trói mình bỏ mặc. Cô lần lượt nghe thầy Giáo vụ tự nói một mình, một vụ
    bắt nạt đòi tiền bảo kê, rồi Miller dắt cô nữ sinh bí ẩn tới, hai người 'đổi vai' cho nhau.
Map041.json:ev26p0:
  effect: nghẹn
  mood: tang thương, lặng
  summary: Lilina từ biệt Hiệu trưởng, được giữ lại thẻ sinh viên và nhận chiếc đồng hồ quả quýt, 'di
    vật' Long Ngâm để lại trước khi chết; rồi cô gọi Succubus.
Map042.json:ev11p0:
  effect: trung tính
  mood: hệ thống
  summary: 'Cửa lớp Quang hệ và Phong hệ: chọn đợi vào học, vào thẳng, hoặc để sau.'
Map042.json:ev12p0:
  effect: trung tính
  mood: hệ thống
  summary: Cửa lớp Thủy hệ và Hỏa hệ; nếu chưa đến lượt thì báo 'chưa xếp lớp này cho mình'.
Map042.json:ev16p0:
  effect: ấm áp, ngạc nhiên
  mood: vui, bất ngờ
  summary: Lilina gặp lại Long Ngâm ở học viện; anh tiết lộ mình chính là 'thầy đang tìm cô'.
Map042.json:ev19p0:
  effect: ngượng, hồi hộp
  mood: tinh quái, hồi hộp
  summary: Miller dắt Lilina đi trong vai 'chó cái nhỏ', nghe lén giờ học, rủ ra phơi nắng; cô sợ bị phát
    hiện.
Map043.json:ev11p4:
  effect: Ghê sợ trước việc Ross thao túng. Bất an cho Long Ngâm. Bật cười ở màn chê 'Hoàn toàn không
    được!'
  mood: Ngột ngạt, mỉa mai, có lúc hài đen
