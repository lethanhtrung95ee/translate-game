  mood: hài hước méo mó
  summary: Ba học sinh kém tôn Lilina làm 'nữ thần', cô tình nguyện 'thực hành cùng ôn bài'.
Map051.json:ev4p0:
  effect: rợn và buồn cười
  mood: mở đầu âm mưu, xen hài
  summary: Ross dẫn Lilina tới phòng chung với Roster, dùng chuông thôi miên ép cô chấp nhận 'đặc đẳng
