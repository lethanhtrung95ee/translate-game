Map162.json:ev9p6:
  effect: nặng nề, cảm giác kết cục
  mood: tuyệt vọng
  summary: Lilina bị tước nhân quyền, làm đồ dùng cho học sinh lớp Ám hệ đến khi tinh thần sụp đổ (Bad
