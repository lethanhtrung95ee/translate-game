Map052.json:ev26p0:
  effect: khó chịu, rồi bất ngờ buồn cười ở đoạn kết
  mood: nhục nhã rồi lật ngược
  summary: Lilina, với tư cách 'ma nữ Lửa', đi 'sưởi ấm' Rant đang bỏ học. Hắn làm nhục cô trong nhà vệ
    sinh nam, mềm lòng khi cô khóc rồi bắt cô làm thú cưng. Cuối cùng chính hắn bị vắt kiệt, phải kêu
    cứu.
Map052.json:ev33p0:
  effect: khó chịu
  mood: cưỡng ép
  summary: Jack chặn Lilina ở nhà vệ sinh nữ, viện cớ 'ma nữ Lửa không được từ chối', rồi đòi cô 'biến
    thành u linh'.
Map052.json:ev33p4:
  effect: cười với câu 'cậu là chó à', hơi ấm ở đoạn kết
  mood: hài pha khổ
  summary: Jack nhận ra 'u linh dâm nữ' là Lilina. Cô chỉ trả lời bằng gật/lắc đầu, bị hắn dọa khui bí
    mật nên phải hẹn mỗi đêm. Ngày cuối hắn hứa quên chuyện.
Map052.json:ev37p0:
  effect: căng lúc Long Ngâm đi ngang
  mood: liều lĩnh, hồi hộp
  summary: Anna dẫn Lilina đi 'chơi' với nhóm học sinh trốn học trong nhà vệ sinh, suýt bị Long Ngâm phát
    hiện ở buồng bên. Sau đó Lilina nhờ Anna bày cách gom dâm năng nhanh.
Map052.json:ev37p3:
  effect: nặng nề, hồi hộp
  mood: tàn nhẫn, mệt mỏi
  summary: Anna bố trí cho Lilina bị trói làm 'bồn chứa' cả ngày cho học sinh toàn trường, rồi bỏ quên
    cô. Long Ngâm suýt bước vào. Lilina thú nhận đây là cách gom dâm năng nhanh, định dùng thêm xuân dược.
Map052.json:ev4p0:
  effect: trớ trêu
  mood: lén lút
  summary: Miller dẫn Lilina vào nhà vệ sinh nam, cho nghe Anna ở buồng bên. Hai người làm theo, cuối
    cảnh Lilina hẹn Anna lần sau cùng trốn học.
Map053.json:ev26p1:
  effect: tò mò, ghép manh mối
  mood: chuyện phiếm rùng rợn
  summary: 'Nữ sinh trong ký túc tám chuyện: Roster dâm đãng nhưng có ''lão già'' chống lưng, một thầy
    (\N[29]) đẹp trai, chính trực. Họ bàn chuyện ma ở hành lang, con trai mất sức, ma lực không hồi phục,
    đêm có tiếng cười. Quản lý ký túc trước là nữ tu.'
Map054.json:ev13p3:
  effect: tò mò
  mood: rờn rợn
  summary: Wendy kể chuyện ma nữ trần truồng ở tấm gương trước lớp Ám hệ, rủ Lilina tới học lớp ban đêm.
    Lilina sợ ma.
Map054.json:ev14p0:
  effect: bình thường
  mood: thân thiện
  summary: Anna mừng vì được vào học viện, nói Lilina cần gì cứ hỏi.
