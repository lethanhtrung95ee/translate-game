Map051.json:ev7p0:
  effect: nghẹn, hồi hộp
  mood: căng, tội lỗi
  summary: Lilina phải chọn giữa hẹn với Long Ngâm và đi tìm Ross giữ dâm năng. Roster ép cô 'ôn Hỏa hệ'
