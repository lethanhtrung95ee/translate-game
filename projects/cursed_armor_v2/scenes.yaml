    chồng họ ân ái trên thân thể cô, cô chỉ biết chửi thầm.
Map050.json:ev2p1:
  effect: Nhẹ nhõm
  mood: Ấm áp
  summary: 'Nhánh hiền: Lilina mang Hoa Người Chết tới, Galon vui vẻ trao Quyền trượng Tử vong.'
Map051.json:ev11p1:
  effect: Cảnh lặp
  mood: Nhẹ
  summary: Lilina chủ động rủ Miller đi 'tìm vui'.
Map051.json:ev12p0:
  effect: Hệ thống
  mood: Trung tính
  summary: 'Menu dịch chuyển nhanh: tầng 2, tầng 3 học viện, vườn.'
Map051.json:ev13p0:
