    nạ của cái bóng' và thành \N[14] mới; hắn là em trai và đem 'xác anh trai' đi xử lý. \N[17] được thần
    khí cùng Cloria và Trosi.
Map155.json:ev13p0:
  effect: bất an
  mood: nũng nịu, lạnh
  summary: Thành chủ (giấu mặt) hỏi Cloria có muốn Lilina không rồi tặng cô cho Cloria và Trosi.
Map156.json:ev12p0:
  effect: rõ lựa chọn
  mood: trung tính
  summary: '\N[44] ngạc nhiên vì Lilina trốn được khỏi dinh thự của \N[46]; các lựa chọn: quay lại làm
    nô lệ Futa, nhờ tháo gậy rung, hoặc chỉ mua hàng.'
Map156.json:ev1p0:
  effect: bực vì bị lừa, buồn cười kiểu 'không đọc hợp đồng'
  mood: lừa đảo, dâm, hài đen
  summary: Ở 'Ngôi nhà Tình yêu', \N[43] dụ Lilina 'trúng thưởng', \N[44] mời cô làm người trải nghiệm
    hàng đặc cung. Lilina ký hợp đồng dày mà không đọc, bị đeo xiềng ma thép. Đó thực chất là thí nghiệm
    Futa hóa vĩnh viễn (theo suy đoán của \N[9]), cuối cùng cô bị bán cho phu nhân \N[46], quản gia \N[45]
    dỗ cô nghe lời.
Map156.json:ev5p0:
  effect: hồi hộp nhẹ
  mood: tinh nghịch
  summary: Nhân viên bắt gặp Lilina nghịch chìa khóa đồ trói; lựa chọn lấy trộm chìa khóa.
Map156.json:ev6p0:
  effect: hồi hộp nhẹ
  mood: tinh nghịch
  summary: 'Bản lặp: lấy chìa khóa đồ trói.'
Map157.json:ev1p0:
  effect: khó chịu
  mood: dâm, nhục
  summary: Cloria nhận hàng 'quần lót dương cụ ma động' ở kho, bắt Lilina thử cùng một thủy thủ cho tới
    khi cô ngất.
Map158.json:ev2p0:
  effect: nghẹn, rùng mình
  mood: lặng, sa ngã
  summary: Hết thời gian làm chó, Lilina thấy hụt hẫng, đổ cho thần khí, rồi buông xuôi 'thành chó cái
    cũng chẳng sao'.
Map158.json:ev8p0:
  effect: Lúc đầu buồn cười vì tương phản giữa tiếng sủa và lời nghĩ, về sau rợn vì mất ý chí
  mood: nhục dục, mỉa mai trong đầu chuyển dần thành mê muội
  summary: Lần đầu Lilina bị dắt tới làm chó cái của Thành chủ. Cô giả vờ phục tùng thì bị khoái cảm của
    'thần khí' nuốt chửng, được nhận nuôi và ban tên \N[61]. Succubus cảnh báo thần lực.
Map158.json:ev8p2:
  effect: bất an
  mood: mê muội
  summary: Lặp lại cảnh hầu hạ. Lilina dần nghiện phục tùng, độ phục tùng +100. Thành chủ cho cô hầu hạ
    dưới thân phận người, cô mừng vì thấy có cơ hội trốn, rồi tự hỏi sao mình lại muốn trốn.
Map158.json:ev8p3:
  effect: thấy rõ cả phòng đã sa ngã
  mood: trụy lạc, có chút hài vì ghen tuông
