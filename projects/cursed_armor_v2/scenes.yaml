Map051.json:ev34p0:
  effect: trớ trêu
  mood: ngây ngô lệch lạc
  summary: Charlotte buồn vì Wendy không tới học cùng nữa, nhờ Lilina 'ôn Thủy hệ', thực chất là quan
    hệ.
Map051.json:ev42p1:
