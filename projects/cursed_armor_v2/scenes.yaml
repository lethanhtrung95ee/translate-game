# Tom tat tung canh (gui kem moi lo dich/kiem dinh cua canh do). Sua tay duoc.
CommonEvents.json:ce1:
  effect: cho thấy cơ chế giáp, căng
  mood: bức bối, nhục nhã
  summary: Dâm năng tăng làm xuất hiện gông/vòng cổ nguyền; dâm năng thiếu thì vòng cổ, gông, giáp lần
    lượt biến mất, Lilina kiệt sức và nổi dục vọng.
CommonEvents.json:ce10:
  effect: cười nhẹ, tò mò về giao ước
  mood: hành chính, hơi hài
  summary: Thông báo hoàn thành nhiệm vụ và phần thưởng. Lilina báo đã diệt sinh vật ở mạch nước ngầm
    và đặt phong ấn; quản lý cảm ơn nhưng không trả thêm. Mary/Melissa đòi thực hiện giao ước hoặc 'thí
    nghiệm'.
CommonEvents.json:ce100:
  effect: chức năng
  mood: hệ thống
  summary: Menu bật/tắt thần khí.
CommonEvents.json:ce101:
  effect: căng, ngã rẽ đạo đức
  mood: cám dỗ, nghiêm túc
  summary: Kỹ năng quyến rũ Zapfkiel/Aleph. Succubus ngăn lại vì nếu lòng Lilina sa đọa thì không ai biết
    hậu quả; người chơi chọn 'không thể quay đầu' hay 'phải nhẫn nhịn'.
CommonEvents.json:ce106:
  effect: căng, khó chịu
  mood: u ám, nhục nhã
  summary: 'Gặp cướp: chọn làm chuyện người lớn, tiêu diệt hoặc bỏ qua. Bị cướp cưỡng bức, lấy tiền; cướp
    phát hiện vòng cổ nô lệ vĩnh viễn hoặc ép đeo đai trinh tiết rồi cướp chìa khóa.'
CommonEvents.json:ce11:
  effect: ấm áp
  mood: nhẹ nhõm
  summary: Dùng cuộn giấy về thành; cô gái được cứu cảm ơn và muốn về với cha mẹ.
CommonEvents.json:ce110:
  effect: khó chịu
  mood: nhục nhã, phục tùng
  summary: Lính gác lấy cớ nô lệ 'khiêu khích' mình để ép Lilina, nô lệ của chủ thành, phục dịch. Cô tự
    xưng bằng tên nô lệ, phục tùng, rồi tự nhủ sau này nên tránh lính gác.
CommonEvents.json:ce111:
  effect: chức năng
  mood: hệ thống
  summary: Menu bật/tắt thần khí.
