Map162.json:ev9p3:
  effect: nghẹn, tiếc nuối trước số phận không tên
  mood: u tối, sử thi bi thảm
  summary: 'Ross dâng Lilina cho dâm ma để tăng ma lực. Bad End B: cô thành búp bê hoàn hảo, hắn chiếm
    đế quốc, cô thành hoàng hậu không tên, Dâm ma vương phục sinh. Nhánh khác: tình yêu với \N[7] khiến
    Ross định giết anh ta.'
Map162.json:ev9p5:
  effect: tò mò, giật mình
  mood: căng, tiết lộ
  summary: Lilina tỉnh dậy ở lớp Ám hệ. Khi Ross nhắc tới hiệu trưởng, cô nhận ra 'bà ta không phải hiệu
