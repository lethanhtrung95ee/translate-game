Map163.json:ev10p0:
  effect: nghẹn, hồi hộp, nhẹ nhõm
  mood: xúc động, cao trào
  summary: Trong thế giới nội tâm của búp bê, \N[7] gọi Lilina. Cô vùng thoát khỏi cấm chú, hét 'Em cũng
    yêu anh! Đừng bỏ em!'.
Map165.json:ev5p0:
  effect: cười với câu đùa 'quý ông' giữa hai anh em
  mood: dâm loạn, hài nhẹ
  summary: Lilina tìm thầy giáo vụ để 'nâng phép', gặp hai anh em giáo vụ và bị cả hai cùng làm.
Map168.json:ev1p0:
  effect: bất an kèm buồn cười vì cặp đôi ngốc
  mood: rình rập, hài
  summary: Ở làng, Lilina ngủ trong nhà kho thuê. Hai dân làng rình nhưng cô chưa uống thuốc nên chúng
    bỏ đi.
Map168.json:ev1p1:
  effect: ghê, bất an
  mood: đáng sợ, hèn hạ
  summary: Lần này Lilina đã uống sữa có thuốc. Hai dân làng hiếp cô lúc ngủ (hoặc bỏ đi nếu cô mặc đai
    trinh tiết) và cố ý để lại dấu vết. Sáng ra cô thấy người đầy tinh dịch, chai sữa biến mất.
Map168.json:ev1p2:
  effect: cười vì cặp anh em ngốc
  mood: dâm tục pha hài ngớ ngẩn
  summary: Hai anh em dân làng hiếp Lilina sau khi bỏ thuốc mê vào sữa. Cô mở mắt hoặc giả ngủ, người
    anh bắt em 'cho cô ta bậc thang xuống'. Có biến thể khi Lilina đang có bầu.
Map168.json:ev20p0:
  effect: hồi hộp ngầm, người chơi biết có bẫy
  mood: ngây thơ
  summary: Lilina thấy ly sữa trong phòng, tưởng là dịch vụ đặc biệt của quán trọ.
Map168.json:ev20p1:
  effect: tò mò
  mood: tính toán
  summary: Chọn giả vờ uống, uống thật hoặc mặc kệ ly sữa. Cô giả uống để không cho ma trùng cơ hội.
Map168.json:ev7p0:
  effect: cười, căng nhẹ
  mood: tục, hài vụng trộm
  summary: Ông chủ quán báo giá phòng, cho trả tiền bằng thân thể. Hai người vụng trộm sau quầy, bà chủ
    suýt bắt gặp, ông nói dối là 'mèo hoang kêu xuân'.
Map169.json:ev22p0:
  effect: rùng mình, hụt hẫng; nhận ra Luna là kẻ hưởng lợi
  mood: sử thi, u ám
  summary: 'Bad End A của tuyến Ma trùng: Lilina biến mất, tộc nữ yêu Abaddon miễn nhiễm lửa, đánh bại
    đế quốc và chiếm đất. Sử sách chỉ ghi tên nữ yêu \N[41].'
Map169.json:ev4p0:
  effect: tò mò, bất an (cài cắm việc bị ký sinh)
  mood: rờn rợn
  summary: Trong ma cảnh, Lilina và Succubus thấy một 'ổ ươm'. Lilina cảm thấy sau lưng có thứ gì đó,
    Succubus lại không cảm thấy gì. Hai người hẹn đêm mai quay lại.
Map169.json:ev5p0:
  effect: tò mò
  mood: điều tra
  summary: Khu vực bị phá hủy nặng như bị thứ gì ăn mất, hai người nghi là vương trùng.
Map171.json:ev11p0:
  effect: cười nhẹ ('Cô đi cướp à!')
  mood: tục, hài nhẹ
  summary: Lilina (đang có bầu) đòi một dân làng đưa mỗi thứ năm phần đồ ăn, đổi lại bằng thân xác.
Map172.json:ev1p0:
  effect: cười
  mood: tục, hài
  summary: Bác sĩ phát hiện dâm trùng đã làm tổ trong tử cung. Lilina năn nỉ đừng diệt mà 'chữa' bằng
    tinh dịch. Ông than cả làng chỉ có mình ông làm bác sĩ.
Map173.json:ev16p0:
  effect: nhẹ
  mood: khám phá
  summary: Lục soát chiếc ghế trong nhà tên cướp, có thể tìm thấy đồ.
Map173.json:ev17p0:
  effect: nhẹ
  mood: khám phá
  summary: Lục thùng gỗ hỏng, có lúc tìm được đồ 'chủ nhân để lại'.
Map173.json:ev3p0:
  effect: căng nhẹ
  mood: chờ đợi
  summary: Bị xích, Lilina chọn ngủ hoặc thủ dâm, định chờ tối mới trốn.
Map173.json:ev3p1:
  effect: không đáng kể
  mood: lặp
  summary: 'Lựa chọn lặp: ngủ, thủ dâm hoặc nghĩ lại.'
Map173.json:ev3p2:
  effect: cười
  mood: cãi cọ hài
  summary: Lilina nhờ Succubus phá xích. Succubus đòi 500 dâm năng và cà khịa 'dễ thì tự làm đi'.
Map173.json:ev3p3:
  effect: ngượng, hụt hẫng
  mood: đọa lạc
  summary: Chủ nhân về, Lilina hầu hạ. Hắn gọi đồng bọn đến chơi chung, bọn cướp bàn chuyện bán cô vì
    nô lệ vĩnh viễn đáng vài triệu. Một tháng sau hắn không thỏa mãn nổi cô nữa nên định bán, có nhánh
    hắn 'còn tiếc'.
Map173.json:ev4p0:
  effect: căng, ngột ngạt
  mood: áp bức
  summary: Trốn bị bắt, chủ nhân điều giáo cô bằng gậy rung ma pháp suốt \V[19] ngày, rồi gắn khóa ma
    cương và đai trinh tiết. Có nhánh hắn không tháo được đai trinh tiết nên định bán cô.
Map173.json:ev5p0:
  effect: nhẹ
  mood: phân vân
  summary: 'Đầu kia sợi xích: có thể tự khóa mình lại để không bị phát hiện.'
Map173.json:ev7p0:
  effect: mỉm cười
  mood: hài nhẹ
  summary: 'Lục rương: thấy đồ chơi người lớn chủ nhân giấu, hoặc đồ ăn đã hỏng.'
Map173.json:ev8p0:
  effect: nhẹ
  mood: bế tắc
  summary: 'Cửa sổ: bị bịt mắt hoặc trói nên không nhìn ra ngoài được.'
Map173.json:ev8p1:
