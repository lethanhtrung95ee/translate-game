Map162.json:ev11p1:
  effect: rờn rợn pha hài (cô 'thành đúng thứ mình sợ nhất')
  mood: ma quái, chuyện kinh dị trường học
  summary: Lilina điều tra hồn ma, bị giáo viên Ám hệ (hồn ma nhập \N[33]) bắt làm vật tế, hóa u linh,
    phải đi hút tinh khí nam sinh trong ký túc xá.
Map162.json:ev9p1:
  effect: phần thưởng/hình phạt cho gameplay
  mood: nghi lễ
  summary: 'Lilina quay về qua gương: hút đủ tinh khí thì chỉ số phép tăng, thiếu thì bị phạt. Cô được
    nhận làm vật tế hợp lệ, nhận vòng tay, từ nay vào lớp qua ''lối vật tế''.'
Map162.json:ev9p2:
  effect: căng, tò mò về hiệu trưởng
  mood: bất an
  summary: Lilina tỉnh dậy, mù và không cử động được. Ross nói hiệu trưởng sai hắn 'điều giáo' cô vì cô
