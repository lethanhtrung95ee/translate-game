    Trosi vì dám than bị ra rìa.'
Map158.json:ev8p4:
  effect: Hồi hộp vì Lilina dùng mưu
  mood: căng ngầm dưới lớp nhục dục
  summary: Gồm hai nhánh. (1) Thành chủ phái Lilina về Anvil săn nữ mạo hiểm giả, Sanga phải ở lại. (2)
    Lilina lần đầu thấy công chúa Ngân Nguyệt, lấy cớ ghen tị để được giao việc huấn luyện công chúa,
    nhận chìa khóa ngục và lời dọa chém đầu.
Map158.json:ev8p5:
  effect: nghẹn và căng; ngã rẽ số phận
  mood: căng thẳng, bi kịch, đau lòng
  summary: 'Đêm ám sát: Lilina đầu độc Thành chủ. Nếu trung thành, cô cứu hắn rồi khai ra \N[17], và bị
    ép xử chém bạn. Nếu không, cô lấy vòng tay và chìa khóa rồi thoát. Nhánh khác: Cloria và Trosi trở
    về, vụ xử chém bọn bắt cóc; Lilina được cấp giấy thông hành và được ra khỏi thành 30 ngày.'
Map158.json:ev8p6:
  effect: tò mò, hụt hẫng; có câu đùa phá tường thứ tư
  mood: bí ẩn, lặng
  summary: \N[17], chủ mới, nhận ra Lilina khi Cloria dắt cô tới. Hắn đòi cô thề trung thành thì mới kể
    sự thật. Lilina từ chối và được nhắn rằng công chúa nhớ cô.
Map158.json:ev9p0:
  effect: gợi tò mò về nguồn gốc thần khí
  mood: bình lặng, dò hỏi
  summary: Sáng hôm sau, Thành chủ khen Lilina và chỉ lối mật đạo sau lò sưởi. Lilina hỏi thần khí có
    phải bẩm sinh không thì bị gạt đi.
Map158.json:ev9p1:
  effect: thấy cô đã sa ngã
  mood: êm, cam chịu
  summary: Cũng cảnh sáng hôm sau nhưng Lilina vẫn ở dạng chó, chỉ sủa và vui vì được khen.
Map159.json:ev10p0:
  effect: ngượng và cười vì logic phi lý
  mood: hài đen, phi lý kiểu cải biến thường thức
  summary: 'Học viện ma pháp, lớp ma pháp Quang: thầy dùng ''thường thức'' bắt Lilina khỏa thân, bò như
    chó, phơi bày trước lớp; cô dần thấy hưng phấn.'
Map159.json:ev10p2:
  effect: ngượng, có chút day dứt
  mood: phi lý, nhục dục
  summary: Lớp ma pháp Phong, nơi 'tự do' nghĩa là buông thả. Lilina giằng co giữa ham muốn với Charlotte
    (Hạ Lạc) và lòng chung thủy với bạn trai \N[7].
Map159.json:ev14p0:
  effect: thấy cô đã 'học xong' lớp Phong
  mood: hớn hở
  summary: Lilina quay lại lớp sau khi đưa thư, chủ động đòi làm tình. Thầy khen cô là học trò thiên tài
    nhất.
Map160.json:ev10p0:
  effect: ngượng, hài đen
  mood: phi lý, nhục dục
  summary: 'Lớp ma pháp Thủy: ''khống chế thủy nguyên tố'' bằng thủ dâm, bịt mắt, phục vụ bạn học. Lilina
    dần thông thạo.'
Map160.json:ev10p2:
  effect: cười vì sự phi lý được nói như chân lý, rờn rợn trước quá trình tẩy não
  mood: giảng đường nghiêm trang nhưng phi lý, dần dâm loạn
  summary: 'Chuỗi các buổi học Hỏa hệ của \N[29]: ''sưởi ấm'' người khác bằng ôm hôn, rồi bằng thân thể.
    Lilina tự nhận ra triết lý ''hiến thân hoàn toàn''. Có mạch phụ về học sinh cá biệt \N[30].'
Map160.json:ev10p4:
  effect: cười vì thầy quên trước quên sau và vì Lilina cà khịa trong đầu; ghê trước sự biến chất
  mood: hài đen, ông thầy hố hàng
  summary: 'Lớp Thổ hệ với ông thầy đãng trí: Lilina giao phối với thổ tinh linh, sinh dị chủng (slime,
    ma nhân, dâm ma), bị dụ trở thành ''ổ ươm thật sự''.'
Map160.json:ev10p6:
  effect: căng thẳng, sởn gai khi Ross lộ mặt thật; tò mò về 'bà ta'
  mood: từ hài hước sang âm mưu đen tối
  summary: 'Lớp Lôi hệ của Ross: tê liệt, điều khiển, ''lớp đặc biệt'' với mọi thầy cô. Đêm đó Ross thi
    triển cấm chú ''Búp bê sống'', moi bí mật về Succubus và \N[8], rồi xóa ký ức của Lilina. Các vòng
    lặp sau: Lilina mượn cớ ''bị điều khiển'' để buông thả.'
Map161.json:ev16p0:
  effect: căng, lo lắng khi chỗ dựa của Lilina sụp đổ
  mood: hoảng loạn
  summary: Succubus phát hiện ấn ký cấm chú trên ngực Lilina, rồi bị xúc tu 'Dâm ma tướng' của Ross bắt.
Map161.json:ev16p1:
  effect: nghẹn và thấy bước ngoặt, đây là tiết lộ động cơ của Succubus
  mood: trầm, thổ lộ, quyết tâm
  summary: Lilina đã giết Ross và cứu Succubus. Succubus thổ lộ không muốn phục sinh Dâm ma vương. Lilina
    quyết làm Nữ vương dâm ma, thề trả thù \N[8]. Điều kiện True END đạt được.
Map161.json:ev16p3:
  effect: rùng mình, cảm giác kết cục
  mood: mê man, tuyệt vọng ngọt ngào
  summary: 'Succubus trừng phạt Lilina vì vụ dị chủng: cô sinh dâm ma liên tục, chọn ở lại làm ''mẹ của
    dâm ma'' và hòa vào vách thịt mãi mãi (kết xấu).'
Map161.json:ev3p0:
  effect: bực ông thầy rồi mềm lòng khi ông xin lỗi
  mood: dâm loạn rồi chuyển sang ấm áp, dở khóc dở cười
