Map051.json:ev14p0:
  effect: hơi bất an, cảm giác bị nhốt
  mood: bình thường
  summary: Tủ đồ có kết giới, đồ cất vào chỉ lấy lại được khi làm thủ tục rời học viện.
Map051.json:ev25p0:
  effect: tò mò, thở phào
  mood: mơ hồ, nhẹ nhõm hoặc cam chịu
  summary: Lilina tỉnh dậy ở ký túc, thấy chiếc vòng 'vật tế' nên biết mình vẫn đang làm 'u linh dâm nữ'.
    Trong nhánh cô thất hứa, Jack kể chuyện cho mọi người nhưng không ai tin.
Map051.json:ev25p1:
  effect: bất an, người chơi hiểu Ross đang lừa
  mood: căng, âm mưu
  summary: Ross nói Long Ngâm đã được xóa ký ức nhưng có 'chỗ bất thường', hẹn Lilina tới văn phòng. Hắn
