    Long Ngâm bị thôi miên. Hắn xui cô 'hư đi', đóng vai người lạ, dàn cảnh cho Long Ngâm bắt gặp, đánh
    ngất anh và xóa ký ức. Có màn hài 'dạy quyến rũ'.
Map043.json:ev11p5:
